/* ============ AUDITS (the exercise, not the sweep) ============
   A sweep is one area, one person, twenty minutes. An audit is what a plant
   actually runs: authorised for a reason, scoped to a set of areas, carried
   out over several days by several people, and concluded with one report
   that finance signs. The sweeps are the evidence; this is the exercise.

   Two rules here matter more than the rest, and both exist because of what
   an auditor will ask:

   An area may be SKIPPED, but never silently — a reason is required and it
   appears in the report. A documented exclusion is accepted; an area that
   quietly never got done is what gets challenged.

   An area may be RE-SCANNED inside the same audit, and the latest scan is
   the one that counts. Without that, a second pass to clear exceptions
   means starting a whole new audit to redo one bay.
*/
var REASONS=[
  ["annual",   "Annual statutory verification", "the yearly physical verification the auditors ask for"],
  ["half",     "Half-yearly internal check",    "management's own mid-year check"],
  ["quarter",  "Quarterly cycle count",         "a rolling count of part of the register"],
  ["insurance","Insurance survey",              "evidence for a policy or a claim"],
  ["transfer", "Pre-transfer verification",     "before assets move site or change hands"],
  ["incident", "Post-incident check",           "after a theft, a fire or a flood"],
  ["spot",     "Spot check",                    "unannounced, usually one or two areas"]
];
function reasonLabel(k){
  for(var i=0;i<REASONS.length;i++) if(REASONS[i][0]===k) return REASONS[i][1];
  return k||"Audit";
}
function rounds(){ return list("rounds"); }
function round(id){ return (S.rounds&&S.rounds[id])||null; }
/* Several audits run at once — an annual verification across a plant while a
   spot check covers one bay, each with its own team. RND.sel is the one
   currently being looked at; a sweep binds to whichever worklist launched it,
   so overlapping scopes are never ambiguous. */
var RND={sel:"", openFloor:{}};
function openRounds(){
  return rounds().filter(function(r){return r.status==="open";})
    .sort(function(a,b){return (b.openedAt||"").localeCompare(a.openedAt||"");});
}
function openRound(){ return openRounds()[0]||null; }
function selectedRound(){
  var r=RND.sel? round(RND.sel):null;
  /* A planned audit opens on the same page as a running one \u2014 that page IS
     the plan. The only difference is that nothing has been walked yet. */
  return (r && (r.status==="open"||r.status==="planned"))? r : null;
}
function plannedRounds(){
  return rounds().filter(function(r){return r.status==="planned";})
    .sort(function(a,b){return (a.plannedFrom||"").localeCompare(b.plannedFrom||"");});
}
function liveRounds(){ return plannedRounds().concat(openRounds()); }
function roundTitle(r){ return (r&&r.title)? r.title : reasonLabel(r?r.reason:""); }
function nextRef(){
  var d=new Date(), pre="AUD-"+d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-";
  var n=rounds().filter(function(r){return String(r.ref||"").indexOf(pre)===0;}).length+1;
  return pre+("00"+n).slice(-3);
}

/* The scope is stored as whatever the supervisor picked — areas, or the
   departments that own them. Departments are resolved every time rather
   than frozen, so an area added to a department mid-audit is still covered. */
function roundAreas(r){
  if(!r) return [];
  var base;
  if(r.scopeType==="depts"){
    base=list("locations").filter(function(l){ return (r.scope||[]).indexOf(l.team)>=0; })
      .map(function(l){return l.id;});
  } else {
    base=(r.scope||[]).slice();
  }
  /* Rooms added one at a time live in `extra`, not in `scope`, so a
     department-scoped audit can gain a single room without the whole scope
     having to change shape. */
  (r.extra||[]).forEach(function(id){ if(base.indexOf(id)<0) base.push(id); });
  return base.filter(function(id){ return !!loc(id); })
    .sort(function(a,b){ return locCode(a).localeCompare(locCode(b)); });
}

/* Rooms grouped by the floor they sit on. Past a few dozen rooms the floor is
   the only unit anybody hands out or reports on. */
function roundFloors(r){
  var map={}, order=[];
  roundAreas(r).forEach(function(id){
    var l=loc(id); if(!l) return;
    var k=String(l.area||"").trim() || "\u2014 no floor set \u2014";
    if(!map[k]){ map[k]={key:k, ids:[]}; order.push(k); }
    map[k].ids.push(id);
  });
  order.sort(function(a,b){return a.localeCompare(b);});
  return order.map(function(k){ return map[k]; });
}
function floorProgress(r,ids){
  var done=0, skipped=0, exc=0;
  ids.forEach(function(id){
    var sc=roundScan(r,id);
    if(sc){ done++; exc+=sc.counts.misplaced+sc.counts.missing+sc.counts.unknown; }
    else if(roundSkip(r,id)) skipped++;
  });
  return {done:done, skipped:skipped, exc:exc, total:ids.length, left:ids.length-done-skipped};
}
/* "" = nobody, "*mixed*" = more than one person or only part of the floor. */
function assignedTo(r,ids){
  var who={}, n=0;
  ids.forEach(function(id){ var p=(r.assign||{})[id]; if(p){ who[p]=1; n++; } });
  var ks=Object.keys(who);
  if(!ks.length) return "";
  return (ks.length===1 && n===ids.length)? ks[0] : "*mixed*";
}
/* ---- What the audit has actually found -----------------------------------
   Every sweep already records, asset by asset, what it could not find and what
   turned up in the wrong room. Until now that detail lived only inside each
   single sweep's own report, so the audit page could say three things needed
   fixing but not which three, or where. For a statutory count that is the
   whole point: "two rooms walked" is progress, "the torque wrench is not in
   the crib" is the finding. */
function roundFindings(r){
  var miss=[], mis=[], unk=[], away=[], found=[], checked=0, expected=0, lost=0;
  roundAreas(r).forEach(function(id){
    var sc=roundScan(r,id); if(!sc) return;
    expected += sc.expected||0;
    checked  += (sc.counts.inplace||0)+(sc.counts.eyeballed||0);
    (sc.rows||[]).forEach(function(row){
      var rec={at:id, assetId:row.assetId, epc:row.epc, nbv:row.nbv||0,
               when:sc.endedAt, by:sc.operator, home:row.home||""};
      if(row.b==="missing"){ miss.push(rec); lost+=rec.nbv; }
      else if(row.b==="misplaced") mis.push(rec);
      else if(row.b==="unknown") unk.push(rec);
      else if(row.b==="away") away.push(rec);
      /* Eyeballed counts as found: somebody stood in front of it and said so,
         which is the evidence an auditor accepts for an asset that cannot
         carry a tag. */
      else if(row.b==="inplace"||row.b==="eyeballed"){ rec.how=row.b; found.push(rec); }
    });
  });
  return {missing:miss, misplaced:mis, unknown:unk, away:away, found:found,
          checked:checked, expected:expected, lost:lost};
}

function roundFindingsPanel(r){
  var f=roundFindings(r);
  var n=f.missing.length+f.misplaced.length+f.unknown.length;
  var h='<section class="panel"><div class="panel-h"><h2>What has been found</h2>'+
    '<span class="sub">'+(f.expected? f.checked+' of '+f.expected+' expected assets accounted for so far' : 'nothing walked yet')+'</span></div>';

  /* Nothing walked yet means nothing to say. An empty panel announcing its own
     emptiness is just another box to scroll past. */
  if(!f.expected) return "";

  /* Found is the bulk of any healthy count \u2014 950 rows of good news would
     bury the dozen that need acting on. So it is folded shut, present as
     evidence rather than as a thing to read. */
  var foundBlock="";
  if(f.found.length){
    var cap=f.found.slice(0,60);
    foundBlock='<details class="bucket b-ok"><summary><span class="c">'+f.found.length+'</span>Found where they should be'+
      '<span class="d">verified in place by a sweep</span></summary>'+
      '<div class="tw cardtbl"><table><thead><tr><th>Asset</th><th>Room</th>'+
      '<th class="num">Net block</th><th>How</th></tr></thead><tbody>'+
      cap.map(function(x){
        var a=asset(x.assetId);
        return '<tr><td><b>'+esc(a?a.name:"(deleted asset)")+'</b> <span class="epc">'+esc(a?a.code:x.assetId)+'</span></td>'+
          '<td data-l="Room">'+esc(locName(x.at))+'</td>'+
          '<td class="num" data-l="Net block">'+money(x.nbv)+'</td>'+
          '<td data-l="How">'+(x.how==="eyeballed"? '<span class="chip mute">seen by eye</span>' : '<span class="chip ok">tag read</span>')+'</td></tr>';
      }).join("")+'</tbody></table></div>'+
      (f.found.length>cap.length? '<div class="muted" style="padding:10px 14px">Showing '+cap.length+' of '+f.found.length+
        '. The whole list is in the audit report and the CSV export.</div>' : '')+
      '</details>';
  }

  if(!n) return h+'<div class="panel-b"><div class="tallybar ok"><b>Nothing out of place.</b> '+
    'Every asset expected in the rooms walked so far was found where the register says it should be.</div></div>'+
    (foundBlock? '<div class="panel-b">'+foundBlock+'</div>' : '')+'</section>';

  if(f.missing.length){
    h+='<div class="panel-b" style="padding-bottom:0"><b style="color:var(--crit)">Not found \u2014 '+f.missing.length+'</b>'+
       '<span class="muted" style="font-size:12.5px;margin-left:8px">'+money(f.lost)+' of net block unaccounted for</span></div>'+
       '<div class="tw cardtbl"><table><thead><tr><th>Asset</th><th>Should be in</th>'+
       '<th class="num">Net block</th><th>Walked by</th></tr></thead><tbody>';
    f.missing.forEach(function(x){
      var a=asset(x.assetId);
      h+='<tr><td><b>'+esc(a?a.name:"(deleted asset)")+'</b> <span class="epc">'+esc(a?a.code:x.assetId)+'</span></td>'+
         '<td data-l="Should be in">'+esc(locName(x.at))+' <span class="epc">'+esc(locCode(x.at))+'</span></td>'+
         '<td class="num" data-l="Net block">'+money(x.nbv)+'</td>'+
         '<td data-l="Walked by"><small class="muted">'+esc(x.by||"")+' \u00b7 '+fmtDate(x.when)+'</small></td></tr>';
    });
    h+='</tbody></table></div>';
  }

  if(f.misplaced.length){
    h+='<div class="panel-b" style="padding-bottom:0;border-top:1px solid var(--line)"><b>In the wrong room \u2014 '+f.misplaced.length+'</b>'+
       '<span class="muted" style="font-size:12.5px;margin-left:8px">found, but not where the register says</span></div>'+
       '<div class="tw cardtbl"><table><thead><tr><th>Asset</th><th>Belongs in</th><th>Turned up in</th><th>Walked by</th></tr></thead><tbody>';
    f.misplaced.forEach(function(x){
      var a=asset(x.assetId);
      h+='<tr><td><b>'+esc(a?a.name:"(deleted asset)")+'</b> <span class="epc">'+esc(a?a.code:x.assetId)+'</span></td>'+
         '<td data-l="Belongs in">'+esc(locName(x.home||(a?a.home:"")))+'</td>'+
         '<td data-l="Turned up in"><b>'+esc(locName(x.at))+'</b></td>'+
         '<td data-l="Walked by"><small class="muted">'+esc(x.by||"")+'</small></td></tr>';
    });
    h+='</tbody></table></div>';
  }

  if(f.unknown.length){
    h+='<div class="panel-b" style="padding-bottom:0;border-top:1px solid var(--line)"><b>Tags that match nothing \u2014 '+f.unknown.length+'</b>'+
       '<span class="muted" style="font-size:12.5px;margin-left:8px">read on the floor but not in the register</span></div>'+
       '<div class="tw cardtbl"><table><thead><tr><th>Tag</th><th>Read in</th><th>Walked by</th></tr></thead><tbody>';
    f.unknown.forEach(function(x){
      h+='<tr><td><span class="epc">'+esc(x.epc)+'</span></td>'+
         '<td data-l="Read in">'+esc(locName(x.at))+'</td>'+
         '<td data-l="Walked by"><small class="muted">'+esc(x.by||"")+'</small></td></tr>';
    });
    h+='</tbody></table></div>';
  }

  if(foundBlock) h+='<div class="panel-b" style="border-top:1px solid var(--line)">'+foundBlock+'</div>';
  if(f.away.length){
    h+='<div class="panel-b" style="border-top:1px solid var(--line)"><span class="muted" style="font-size:12.5px">'+
       f.away.length+' asset'+(f.away.length===1?' is':'s are')+' signed out and not expected in the area \u2014 not counted as missing.</span></div>';
  }
  return h+'</section>';
}

function personName(id){ var u=id&&S.people&&S.people[id]; return u? (u.name||"") : ""; }
function auditPeopleOpts(sel){
  return '<option value="">\u2014 nobody \u2014</option>'+
    list("people").filter(function(u){ return u.active!==false; })
      .sort(function(a,b){return (a.name||"").localeCompare(b.name||"");})
      .map(function(u){
        return '<option value="'+esc(u.id)+'"'+(sel===u.id?" selected":"")+'>'+esc(u.name)+'</option>';
      }).join("");
}
function roundScan(r,locId){
  return list("audits").filter(function(a){ return a.roundId===r.id && a.locationId===locId; })
    .sort(function(a,b){ return (b.endedAt||"").localeCompare(a.endedAt||""); })[0]||null;
}
function roundScanCount(r,locId){
  return list("audits").filter(function(a){ return a.roundId===r.id && a.locationId===locId; }).length;
}
function roundSkip(r,locId){ return (r.skips||{})[locId]||null; }

/* Coverage used to be read against the expected count, and the expected
   count quietly leaves out every untagged asset and every mobile one. A line
   with three hundred register assets, forty of them never tagged, reported
   "248 of 248 \u2014 100%". That is a physical-verification certificate for a
   population narrowed by seventeen per cent, and the auditor samples from the
   register, not from our expected list.

   So both numbers are carried now: coverage against what RFID could see, and
   coverage against the whole register for those areas. Every report states
   the second and says what the gap is made of. */
function roundPopulation(r){
  var areas=roundAreas(r), ids={};
  areas.forEach(function(id){ ids[id]=1; });
  var total=0, untagged=0, mobile=0, offsite=0, retired=0;
  list("assets").forEach(function(a){
    if(!ids[a.home]) return;
    if(isRetired(a)){ retired++; return; }
    total++;
    if(!a.epc) untagged++;
    else if(isOffsite(a)) offsite++;
    else if(a.mobile) mobile++;
  });
  return {onRegister:total, untagged:untagged, mobile:mobile, offsite:offsite, retired:retired};
}
function roundProgress(r){
  var areas=roundAreas(r), done=0, skipped=0, exc=0, expected=0, found=0, atRisk=0, verified=0, days={};
  var eyes=0, awayN=0;
  areas.forEach(function(id){
    var sc=roundScan(r,id);
    if(sc){
      done++;
      exc += sc.counts.misplaced + sc.counts.missing + sc.counts.unknown;
      expected += sc.expected||0;
      found += sc.counts.inplace;
      eyes += sc.counts.eyeballed||0;
      awayN += sc.counts.away||0;
      atRisk += sc.valueMissing||0;
      verified += sc.valueChecked||0;
      /* Local day, not the UTC slice: in IST a sweep finishing before 05:30
         was being dated to the previous day on one report and the correct day
         on another, so the two disagreed about when the area was counted. */
      days[dayKey(sc.endedAt)]=1;
    } else if(roundSkip(r,id)) skipped++;
  });
  var pop=roundPopulation(r);
  /* Verified = read in place, plus confirmed by eye where the tag could not
     be read. Both are physical verification; only the method differs. */
  var vf=found+eyes;
  return { areas:areas, total:areas.length, done:done, skipped:skipped,
           left:areas.length-done-skipped, exceptions:exc,
           expected:expected, found:found, eyeballed:eyes, awayN:awayN,
           atRisk:atRisk, verified:verified,
           pop:pop, verifiedN:vf,
           days:Object.keys(days).sort(),
           pct: areas.length? Math.round((done+skipped)/areas.length*100) : 0,
           coverage: expected? Math.round(found/expected*100) : 0,
           registerCoverage: pop.onRegister? Math.round(vf/pop.onRegister*100) : 0 };
}
function roundTasks(r){
  return list("alerts").map(migrateTask).filter(function(t){ return t.roundId===r.id; });
}

}


/* The Audit tab is a list first. An open audit is not a mode the whole app
   sits in — it is one row among several, and a team walks into it. */
function roundBar(p){
  var done=p.total? p.done/p.total*100:0, skip=p.total? p.skipped/p.total*100:0;
  return '<div class="rbar" title="'+p.done+' scanned, '+p.skipped+' skipped, '+p.left+' to do">'+
    '<i class="ok" style="width:'+done+'%"></i><i class="sk" style="width:'+skip+'%"></i></div>';
}
/* Every job, every scan and every exception already carries the audit that
   produced it. Until it is shown, a supervisor looking at ten open jobs has
   no way to tell which exercise raised them. */
function roundTag(id){
  var r=id? round(id):null;
  if(!r) return '<span class="muted">\u2014</span>';
  return '<button class="linkish" data-roundrep="'+esc(r.id)+'" title="'+esc(roundTitle(r))+'">'+esc(r.ref)+'</button>';
}
function roundOpts(sel,blank){
  var rs=rounds().sort(function(a,b){return (b.openedAt||"").localeCompare(a.openedAt||"");});
  return '<option value="all">'+(blank||"All audits")+'</option>'+
    rs.map(function(r){ return '<option value="'+esc(r.id)+'"'+(sel===r.id?" selected":"")+'>'+
      esc(r.ref)+' \u2014 '+esc(roundTitle(r))+'</option>'; }).join("");
}
/* Two sections, not one list. "What is happening on the floor right now" and
   "what have we committed to doing" are different questions asked by different
   people at different times, and merging them meant neither could be read at a
   glance. Same page, so planning the next audit is never more than a glance
   away from the one in flight. */
/* Whole days from today to a plain yyyy-mm-dd, worked out in local time. Both
   sides are pinned to local midnight, so a plan due today never reads as
   overdue just because UTC has already turned over \u2014 in IST that is every
   evening after half past six. */
function daysUntil(ymd){
  var p=String(ymd).split("-");
  if(p.length!==3) return null;
  var y=+p[0], m=+p[1], d=+p[2];
  /* A half-typed or imported date must leave the column blank rather than
     print "NaN days overdue" \u2014 which is how a screen loses its reader. */
  if(!(y>1900 && m>=1 && m<=12 && d>=1 && d<=31)) return null;
  var then=new Date(y, m-1, d);
  if(isNaN(then.getTime())) return null;
  var now=new Date(); var today=new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((then-today)/86400000);
}
function roundListPanel(){
  return runningPanel()+plannedPanel();
}

     '<th class="num">Rooms</th><th>Walked</th><th class="num">To fix</th><th></th></tr></thead><tbody>';

function plannedPanel(){
  var pl=plannedRounds();

    '<span class="sub">'+(pl.length? pl.length+' audit'+(pl.length===1?'':'s')+' agreed but not started' : 'nothing planned yet')+'</span>'+

  if(!pl.length) return h+'<div class="empty">Nothing planned. Plan one and it waits here until you press Start.</div></section>';
  h+='<div class="tw cardtbl"><table><thead><tr><th>Name</th><th>Reference</th><th>Planned for</th>'+
     '<th class="num">Rooms</th><th>Given out</th><th></th></tr></thead><tbody>';
  pl.forEach(function(r){
    var ids=roundAreas(r);
    var given=ids.filter(function(id){ return (r.assign||{})[id]; }).length;
    /* Days until it is due. A plan nobody started on the day it was due is the
       one thing on this screen that needs chasing, so it is the one that is

      ? fmtDay(r.plannedFrom)+(r.plannedTo&&r.plannedTo!==r.plannedFrom? ' \u2013 '+fmtDay(r.plannedTo):'')

       '<td><b>'+esc(roundTitle(r))+'</b><br><small class="muted">'+esc(reasonLabel(r.reason))+'</small></td>'+
       '<td class="epc" data-l="Reference">'+esc(r.ref)+'</td>'+
       '<td data-l="Planned for">'+when+' <small class="muted">'+(due===null? ''
            : due>1? '\u00b7 in '+due+' days' : due===1? '\u00b7 tomorrow' : due===0? '\u00b7 today'
            : '\u00b7 '+Math.abs(due)+' day'+(Math.abs(due)===1?'':'s')+' overdue')+'</small></td>'+
       '<td class="num" data-l="Rooms">'+ids.length+'</td>'+
       '<td data-l="Given out">'+(!ids.length? '<span class="muted">\u2014</span>'
             : given===ids.length? '<span class="chip ok">all</span>'

  });
  return h+'</tbody></table></div></section>';

function roundWorklist(r){
  var p=roundProgress(r), planned=(r.status==="planned");

  var ed=can("audit");

    '<section class="panel"><div class="panel-h">'+
    '<h2>'+esc(roundTitle(r))+'</h2>'+
    '<span class="sub"><span class="epc">'+esc(r.ref)+'</span> \u00b7 '+esc(reasonLabel(r.reason))+

    (planned? '<span class="chip mute">Planned</span>' : '<span class="chip ok">Running</span>')+

    (ed&&!planned? '<button class="btn sm danger" data-abandon="'+esc(r.id)+'">Abandon</button>' : '')+

     around the one fact anybody acts on. */

     '<div><span style="font-size:30px;font-weight:700;letter-spacing:-.02em">'+p.done+'</span>'+
       '<span class="muted" style="font-size:16px"> of '+p.total+' room'+(p.total===1?"":"s")+' walked</span></div>'+
     '<div><span style="font-size:30px;font-weight:700;letter-spacing:-.02em'+(p.exceptions?';color:var(--crit)':'')+'">'+p.exceptions+'</span>'+
       '<span class="muted" style="font-size:16px"> thing'+(p.exceptions===1?"":"s")+' to put right</span></div>'+
     (p.skipped? '<div class="muted" style="font-size:13px">'+p.skipped+' skipped with a reason</div>' : '')+
     '</div>';

  /* While it is only a plan, the name, the reason and the dates stay ordinary
     editable fields. Before this there was no way to correct a mistyped name at
     all: the one button on the page was the one that committed the whole
     exercise, which is a poor thing to force on somebody who wanted to fix a
     date. */
  if(planned && ed){
    h+='<form id="planEditForm" class="panel-b" style="border-bottom:1px solid var(--line)">'+
      '<input type="hidden" name="recId" value="'+esc(r.id)+'">'+
      '<div class="grid-form">'+
        '<label class="fld w-lg"><span>Name</span><input type="text" name="title" value="'+esc(r.title||"")+'" autocomplete="off"></label>'+
        '<label class="fld w-md"><span>Why it is being run</span><select name="reason">'+
          REASONS.map(function(x){return '<option value="'+x[0]+'"'+(r.reason===x[0]?" selected":"")+'>'+esc(x[1])+'</option>';}).join("")+
        '</select></label>'+
        '<label class="fld w-sm"><span>Planned start</span><input type="date" name="from" value="'+esc(r.plannedFrom||"")+'"></label>'+
        '<label class="fld w-sm"><span>Planned finish</span><input type="date" name="to" value="'+esc(r.plannedTo||"")+'"></label>'+
      '</div>'+
      '<div class="btn-row" style="margin-top:10px"><button class="btn" type="submit">Save changes</button>'+
        '<span class="muted" style="font-size:12.5px">Rooms and who walks them save on their own, the moment you change them.</span></div>'+
    '</form>';
  }

  if(!floors.length){
    h+='<div class="empty">No rooms in this audit yet. Add one below.</div>';
  } else {
    /* Widths on the narrow columns so the slack lands in the Floor column
       instead of opening a gulf in the middle of the row. Without them the
       browser spreads five columns across the whole window and the eye has to
       travel four hundred pixels to join a floor to its progress. */
    h+='<div class="tw cardtbl"><table><thead><tr><th>Floor</th>'+
       '<th class="num" style="width:74px">Rooms</th>'+
       '<th style="width:250px">Given to</th>'+
       '<th style="width:210px">Walked</th>'+
       '<th class="num" style="width:82px">To fix</th>'+
       '<th style="width:170px"></th></tr></thead><tbody>';

    floors.forEach(function(f){
      var fp=floorProgress(r,f.ids), who=assignedTo(r,f.ids);

      h+='<tr>'+
        '<td><b>'+esc(f.key)+'</b></td>'+
        '<td class="num" data-l="Rooms">'+f.ids.length+'</td>'+
        '<td data-l="Given to">'+(ed
          ? '<select class="floorassign" style="max-width:240px" data-floor="'+esc(f.key)+'">'+
              (who==="*mixed*"? '<option value="" data-mixed="1" selected>\u2014 several people \u2014</option>' : '')+

          : (who&&who!=="*mixed*"? esc(personName(who)) : '<span class="muted">\u2014</span>'))+'</td>'+
        '<td style="min-width:150px" data-l="Walked">'+(fp.done||fp.skipped
          ? roundBar({done:fp.done,skipped:fp.skipped,total:fp.total,left:fp.left})+
            '<small class="muted">'+(fp.left? fp.done+' of '+fp.total : 'done')+'</small>'
          : '<span class="muted">not started</span>')+'</td>'+
        '<td class="num" data-l="To fix">'+(fp.exc? '<span class="chip crit">'+fp.exc+'</span>' : '0')+'</td>'+
        '<td class="btn-row"><button class="btn sm" data-floorexp="'+esc(f.key)+'">'+(opened?'Hide rooms':'Rooms')+'</button></td>'+

           '<td class="num"><small class="muted">'+list("assets").filter(function(a){return a.home===id&&a.epc&&!isRetired(a);}).length+' tagged</small></td>'+
           '<td data-l="Given to">'+(ed? '<select class="areaassign" style="max-width:240px" data-area="'+esc(id)+'">'+auditPeopleOpts((r.assign||{})[id]||"")+'</select>'
                     : esc(personName((r.assign||{})[id]||"")))+'</td>'+
           '<td data-l="Walked">'+(sc? '<span class="chip ok">'+((sc.counts.inplace||0)+(sc.counts.eyeballed||0))+' of '+(sc.expected||0)+' found</span> <small class="muted">'+esc(sc.operator)+'</small>'
                     : sk? '<span class="chip mute">skipped</span>'
                     : '<span class="muted">not started</span>')+'</td>'+
           '<td class="num" data-l="To fix">'+(sc? (ex? '<span class="chip crit">'+ex+'</span>':'0') : '<span class="muted">\u2014</span>')+'</td>'+
           '<td class="btn-row" style="justify-content:flex-end;gap:6px">'+
             (ed&&!planned? '<button class="btn sm'+(sc?'':' pri')+'" data-scanarea="'+esc(id)+'">'+(sc?'Re-scan':'Scan')+'</button>' : '')+
             (ed&&!planned&&!sc? (sk? '<button class="btn sm" data-unskip="'+esc(id)+'">Un-skip</button>'
                                    : '<button class="btn sm" data-skiparea="'+esc(id)+'">Skip</button>') : '')+
             (ed&&planned? '<button class="btn sm" data-droparea="'+esc(id)+'">Remove</button>' : '')+
             (sc? '<button class="btn sm" data-report="'+esc(sc.id)+'">Report</button>' : '')+
           '</td></tr>';
      });
    });
    h+='</tbody></table></div>';
  }

  /* Missed a room: type, press, in. No dialog, no reason, no signature. */
  if(ed){
    var inScope={}; roundAreas(r).forEach(function(id){ inScope[id]=1; });
    var avail=list("locations").filter(function(l){ return !inScope[l.id]; });
    h+='<div class="panel-b" style="border-top:1px solid var(--line);background:var(--bg-soft,#fafbfb)">'+
       '<div class="btn-row" style="gap:10px;align-items:center;flex-wrap:wrap">'+
         '<b style="font-size:14px">Missed a room?</b>'+
         '<input type="text" id="addRoomIn" list="addRoomList" placeholder="Type its name or code" '+
           'autocomplete="off" style="flex:1 1 240px;max-width:340px">'+
         '<datalist id="addRoomList">'+avail.map(function(l){
             return '<option value="'+esc(l.code)+' \u2014 '+esc(l.name)+'"></option>'; }).join("")+'</datalist>'+
         '<button class="btn pri" id="addRoomBtn">Add it</button>'+
         '<span class="muted" style="font-size:12.5px">Goes straight in \u2014 we note who added it and when.</span>'+
       '</div></div>';
  }

  h+='<div class="panel-b btn-row" style="border-top:1px solid var(--line)">'+
     (ed&&planned
       ? '<button class="btn" data-allrounds="1">Done for now</button>'+
         '<button class="btn pri" data-startround="'+esc(r.id)+'">Start audit</button>'
       /* Deliberately a plain button. Closing an audit is the one action on
          this page that is hard to walk back, and it sat above a list of
          findings nobody had read yet \u2014 the brightest thing on screen
          should not be the one you cannot undo. */
       : ed? '<button class="btn" data-closeround="'+esc(r.id)+'"'+(canClose?'':' disabled')+'>Close the audit and generate the report</button>' : '')+
     '<span class="muted" style="font-size:12.5px">'+
       (planned? 'Everything here is already saved. It waits under Planned until you start it \u2014 today, next week, whenever the team is ready.'
        : canClose? 'Every room is accounted for.'
        : p.total? p.left+' room'+(p.left===1?'':'s')+' still to walk or skip.'
                 : 'This audit has no rooms in it.')+
     '</span></div></section>';
  /* Below the worklist: "how far along are we" is the floor's question and
     comes first; "what did we find" is the meeting's question. */
  return h + (planned? '' : roundFindingsPanel(r));
}

/* ---- the consolidated report ---- */
/* The register as finance files it: class-wise gross block, accumulated
   depreciation and net block, with the unaccounted figure CARO asks about
   stated on the face of it rather than buried. */
function farPrintable(){
  var asOn=asOnDate(), rows={}, tot={n:0,cost:0,accum:0,nbv:0}, risk=0, riskN=0, unpriced=0;
  list("assets").forEach(function(a){
    if(isRetired(a)) return;
    var d=depSchedule(a,asOn);
    if(!d.ok){ unpriced++; return; }
    var c=assetClass(a), k=c?c.id:"_";
    var r=rows[k]||(rows[k]={name:c?c.name:"Unclassified",life:c?c.life:0,
                             method:c?c.method:"—",n:0,cost:0,accum:0,nbv:0});
    r.n++; r.cost+=d.cost; r.accum+=d.accum; r.nbv+=d.nbv;
    tot.n++; tot.cost+=d.cost; tot.accum+=d.accum; tot.nbv+=d.nbv;
    var la=lastAuditAt(a.home);
    if(la && (la.rows||[]).some(function(x){return x.b==="missing"&&x.assetId===a.id;})){ riskN++; risk+=d.nbv; }
  });
  var keys=Object.keys(rows).sort(function(x,y){return rows[y].nbv-rows[x].nbv;});
  var h=printHead("Fixed asset register","Fixed asset register",
        "As on "+fmtDay(asOn.toISOString().slice(0,10))+" · Schedule II, Companies Act 2013 — pro-rata from date put to use","");
  h+='<div class="psec"><div class="tw"><table><thead><tr><th>Asset class</th><th class="num">Life</th>'+
     '<th>Method</th><th class="num">Count</th><th class="num">Gross block</th>'+
     '<th class="num">Accum. dep.</th><th class="num">Net block</th></tr></thead><tbody>';
  if(!keys.length) h+='<tr><td colspan="7">No asset carries a cost, date put to use and class yet.</td></tr>';
  keys.forEach(function(k){ var r=rows[k];
    h+='<tr><td>'+esc(r.name)+'</td><td class="num">'+r.life+'y</td><td>'+esc(r.method)+'</td>'+
       '<td class="num">'+r.n+'</td><td class="num">'+esc(inr(r.cost))+'</td>'+
       '<td class="num">'+esc(inr(r.accum))+'</td><td class="num"><b>'+esc(inr(r.nbv))+'</b></td></tr>'; });
  if(keys.length) h+='<tr><td><b>Total</b></td><td></td><td></td><td class="num"><b>'+tot.n+'</b></td>'+
    '<td class="num"><b>'+esc(inr(tot.cost))+'</b></td><td class="num"><b>'+esc(inr(tot.accum))+'</b></td>'+
    '<td class="num"><b>'+esc(inr(tot.nbv))+'</b></td></tr>';
  h+='</tbody></table></div>';
  h+='<span class="eyebrow">Physical verification</span>'+
     '<p>'+(risk
       ? esc(inr(risk))+' of net block is carried for '+riskN+' asset'+(riskN===1?'':'s')+
         ' that the last audit of '+(riskN===1?'its':'their')+' area could not find. CARO 3(i)(b) asks '+
         'whether material discrepancies were noticed and properly dealt with in the books of account; '+
         'this is that figure.'
       : 'No asset in these totals was unaccounted for at the last audit of its area.')+'</p>'+
     (unpriced? '<p>'+unpriced+' asset'+(unpriced===1?' has':'s have')+' no cost, date put to use or class '+
       'recorded, and '+(unpriced===1?'is':'are')+' therefore excluded from these totals.</p>' : '')+
     '</div>';
  h+=printSign([["Prepared by","Accounts"],["Verified by","Internal audit"],["Approved by","Finance head"]]);
  return h+printFoot("Fixed asset register as on "+fmtDay(asOn.toISOString().slice(0,10)));
}

/* ============ TAG REPLACEMENT ============
   Replacing a tag is the most forgeable action in an RFID register. Move the
   mapping and the asset "appears" wherever the new tag goes, with the
   register agreeing. Everything else can be reconstructed from a sweep; this
   cannot. So a replacement is not an edit — it is a named act with a reason,
   a signature, and a dead tag that stays on the record.

   Three things the plain edit path was missing:
     why   — a reason from a fixed list, plus remarks
     who   — the signed-in person re-enters their PIN, so the record names
             the person at the keyboard and not whoever last signed in
     where the old tag went — retired by EPC, so if it is ever read again it
             is named as a replaced tag and not an anonymous unknown one
*/
var RETAG_REASONS=[
  ["damaged","Tag damaged or unreadable"],
  ["lost","Tag missing — fell off or removed"],
  ["wrong","Wrong mapping being corrected"],
  ["service","Asset repaired, repainted or refurbished"],
  ["destroyed","Tag destroyed in service"],
  ["relabel","Planned re-labelling of the area"]
];
function retagReasonLabel(c){
  for(var i=0;i<RETAG_REASONS.length;i++) if(RETAG_REASONS[i][0]===c) return RETAG_REASONS[i][1];
  return c||"—";
}
function retags(){ return list("retags").sort(function(a,b){return String(b.at).localeCompare(String(a.at));}); }
/* A tag that was replaced is dead, not unknown. */
function deadEpc(epc){
  var e=normEpc(epc), hit=null;
  list("retags").forEach(function(r){ if(normEpc(r.oldEpc)===e) if(!hit||String(r.at)>String(hit.at)) hit=r; });
  return hit;
}
var RETAG={assetId:"",newEpc:"",home:"",custodianId:"",team:""};
function retagDialog(a,newEpc,ctx){
  RETAG={assetId:a.id,newEpc:newEpc,home:ctx.home||"",custodianId:ctx.custodianId||"",team:ctx.team||""};
  var m=me();
  var noPin=!(m&&m.pin);
  MODAL_WIDE=false;
  modal('<div class="panel-h"><h2>Replace the tag on '+esc(a.code)+'</h2>'+
    '<span class="sub">'+esc(a.name||"")+'</span>'+
    '<button class="btn sm" data-close>Close</button></div><div class="panel-b stack">'+
    '<div class="note" style="border-left-color:var(--crit)"><b>This asset already carries a tag.</b> '+
      'Replacing it moves the identity of the asset onto a different tag, so the reason and your signature '+
      'are recorded against the register. The old tag is retired, not deleted — if it is read in a later '+
      'sweep it will be named as a replaced tag.</div>'+
    '<div class="tw"><table><tbody>'+
      '<tr><th style="width:34%">Asset</th><td><b>'+esc(a.code)+'</b> — '+esc(a.name||"")+'</td></tr>'+
      '<tr><th>Tag being retired</th><td class="epc">'+esc(a.epc)+'</td></tr>'+
      '<tr><th>New tag</th><td class="epc"><b>'+esc(newEpc)+'</b></td></tr>'+
      '<tr><th>Tagged before</th><td>'+(a.taggedBy? esc(a.taggedBy)+' on '+esc(fmtDate(a.taggedAt)) : '<span class="muted">not recorded</span>')+'</td></tr>'+
    '</tbody></table></div>'+
    '<form class="grid-form" id="retagForm">'+
      '<label class="fld w-lg"><span>Why is it being replaced</span><select name="reason" required>'+
        '<option value="">— pick a reason —</option>'+
        RETAG_REASONS.map(function(r){return '<option value="'+r[0]+'">'+esc(r[1])+'</option>';}).join("")+
      '</select></label>'+
      '<label class="fld w-lg"><span>Remarks</span><input type="text" name="remarks" placeholder="what happened, in a few words"></label>'+
      (noPin
        ? '<div class="note" style="border-left-color:var(--warn);flex:1 1 100%"><b>You have no PIN set.</b> '+
          'A replacement has to be signed, and the signature is your PIN. Set one against your name in '+
          'Setup &rarr; People, then come back. An unsigned replacement is worse than none.</div>'
        : '<label class="fld w-sm"><span>Sign with your PIN</span>'+
          '<input type="password" name="pin" inputmode="numeric" autocomplete="off" placeholder="••••" required></label>')+
      (noPin? '' : '<button class="btn pri" type="submit">Sign and replace</button>')+
    '</form>'+
    '<div class="muted">Signed as <b>'+esc(m?m.name:"—")+'</b>'+(m&&m.empCode? ' ('+esc(m.empCode)+')':'')+
      ' · '+esc(m?(ROLES[m.role]||{}).label||m.role:"")+'</div>'+
    '</div>');
}
function doRetag(d){
  var a0=asset(RETAG.assetId); if(!a0){ toast("Asset not found"); return; }
  var m=me(); if(!m){ toast("Sign in first"); return; }
  if(!d.reason){ toast("Pick a reason"); return; }
  /* The signature. Checked against the signed-in person's own PIN, so the
     record names whoever is actually standing at the device. */
  if(!m.pin){ toast("Set a PIN against your name before replacing a tag"); return; }
  if(String(d.pin||"")!==String(m.pin)){ toast("That PIN does not match — nothing was changed"); return; }

  var oldEpc=a0.epc, st=stamp(), at=nowISO();
  var a=clone(a0);
  a.epc=RETAG.newEpc;
  if(RETAG.home) a.home=RETAG.home;
  if(RETAG.custodianId!=null && RETAG.custodianId!==""){ var cu=person(RETAG.custodianId);
    a.custodianId=RETAG.custodianId; a.custodian=cu?cu.name:""; }
  if(RETAG.team) a.taggedTeam=RETAG.team;
  a.taggedAt=at; a.taggedBy=st.byName; a.taggedById=st.by;
  a.retagCount=(a.retagCount||0)+1;
  a.lastRetagAt=at;
  save("assets",a);

  save("retags",{id:uid("RT"), assetId:a.id, assetCode:a.code, assetName:a.name||"",
    oldEpc:oldEpc, newEpc:RETAG.newEpc, reason:d.reason, remarks:(d.remarks||"").trim(),
    by:st.byName, byId:st.by, byCode:st.byCode, byRole:st.byRole,
    at:at, signed:true, areaId:a.home||""});

  closeModal();
  toast(a.code+" — tag replaced and signed");
  render(); renderTabs();
}

/* ============ PRINT ============
   The screen keeps its scroll boxes and its sticky chrome; the document gets
   its own root so neither reaches the paper. Everything printable is built by
   the same functions that build the screen, with forPrint flipped, so the
   two can never drift apart. */
function printHead(kind,title,sub,ref){
  var c=cfg();
  return '<div class="ph"><div><div class="org">'+esc(c.org||"Site")+'</div>'+
    '<div class="kind">'+esc(kind)+'</div></div>'+
    '<div class="rt">'+(ref? '<div><b>'+esc(ref)+'</b></div>':'')+
      '<div>Printed '+esc(fmtDate(nowISO()))+'</div>'+
      '<div>By '+esc(me()?me().name:"—")+'</div></div></div>'+
    '<h1 class="pt">'+esc(title)+'</h1>'+
    (sub? '<p class="psub">'+esc(sub)+'</p>' : '');
}
function printSign(rows){
  var h='<div class="psign"><span class="eyebrow">Certified by</span><div class="row">';
  rows.forEach(function(x){
    h+='<div class="sig"><div class="rule"></div><div class="cap"><b>'+esc(x[0])+'</b>'+
       esc(x[1])+'<br>Date: _______________</div></div>';
  });
  return h+'</div></div>';
}
function printFoot(note){
  return '<div class="pfoot">'+esc(note)+
    ' · Generated from the RFID asset audit register on '+esc(fmtDate(nowISO()))+
    '. Figures are as recorded at the time of printing.</div>';
}
var PRINTING=false;
function printDoc(html){
  var root=document.getElementById("printroot");
  if(!root){ root=document.createElement("div"); root.id="printroot"; document.body.appendChild(root); }
  root.innerHTML=html;
  document.body.classList.add("printing");
  PRINTING=true;
  var done=function(){
    if(!PRINTING) return;
    PRINTING=false;
    document.body.classList.remove("printing");
    root.innerHTML="";
    window.removeEventListener("afterprint",done);
  };
  window.addEventListener("afterprint",done);
  setTimeout(function(){ try{ window.print(); }catch(e){} },80);
  /* Some browsers never fire afterprint. Without this the console would stay
     blank behind the dialog, which looks like a crash. */
  setTimeout(done,60000);
}

function roundReport(r,forPrint){
  var p=roundProgress(r), tasks=roundTasks(r);
  var openT=tasks.filter(function(t){return t.status!=="closed";});
  var byDept={};
  p.areas.forEach(function(id){
    var l=loc(id); if(!l) return;
    var k=l.team||"__none";
    var d=byDept[k]||(byDept[k]={name:l.team?teamName(l.team):"No team", areas:0, done:0, exc:0, expected:0, found:0});
    d.areas++;
    var sc=roundScan(r,id);
    if(sc){ d.done++; d.exc+=sc.counts.misplaced+sc.counts.missing+sc.counts.unknown;
            d.expected+=sc.expected||0; d.found+=sc.counts.inplace; }
  });
  var exRows=[];
  p.areas.forEach(function(id){
    var sc=roundScan(r,id); if(!sc) return;
    (sc.rows||[]).forEach(function(row){
      if(row.b==="inplace") return;
      var a=row.assetId? asset(row.assetId):null;
      exRows.push({area:locName(id), b:row.b, code:a?a.code:"", name:a?a.name:"(not in the register)",
                   epc:row.epc, nbv:row.nbv||0});
    });
  });

  var h = forPrint
    ? printHead("Physical verification of fixed assets", roundTitle(r),
        reasonLabel(r.reason)+
        (p.days.length? " \u00b7 counted "+(p.days.length===1? fmtDay(p.days[0])
            : fmtDay(p.days[0])+" to "+fmtDay(p.days[p.days.length-1])) : "")+
        " \u00b7 register as on "+fmtDay(asOnDate().toISOString().slice(0,10)),
        r.ref)+'<div class="psec">'
    : '<div class="panel-h"><h2>'+esc(roundTitle(r))+'</h2>'+
      '<span class="sub"><span class="epc">'+esc(r.ref)+'</span> \u00b7 '+esc(reasonLabel(r.reason))+'</span>'+
      '<button class="btn sm" data-printround="'+esc(r.id)+'">Print</button>'+
      '<button class="btn sm" data-close>Close</button></div>'+
      '<div class="panel-b stack" style="max-height:72vh;overflow:auto">';

  h+='<div class="tw"><table><tbody>'+
     '<tr><th>Audit</th><td><b>'+esc(roundTitle(r))+'</b></td></tr>'+
     '<tr><th>Reference</th><td class="epc">'+esc(r.ref)+'</td></tr>'+
     '<tr><th>Reason</th><td>'+esc(reasonLabel(r.reason))+'</td></tr>'+
     '<tr><th>Opened by</th><td>'+esc(r.openedBy)+(r.openedByCode? ' <span class="epc">'+esc(r.openedByCode)+'</span>':'')+' on '+fmtDate(r.openedAt)+'</td></tr>'+
     '<tr><th>Scanning ran</th><td>'+(p.days.length? p.days.length+' day'+(p.days.length===1?'':'s')+' · '+p.days.map(fmtDate).join(', ') : 'no scans recorded')+'</td></tr>'+
     (r.closedAt? '<tr><th>Closed by</th><td>'+esc(r.closedBy)+' on '+fmtDate(r.closedAt)+'</td></tr>':'')+
     '<tr><th>Scope</th><td>'+p.total+' area'+(p.total===1?'':'s')+
        (r.scopeType==="depts"? ' across '+(r.scope||[]).length+' department'+((r.scope||[]).length===1?'':'s') : ' picked by hand')+'</td></tr>'+
     '<tr><th>Areas scanned</th><td>'+p.done+' of '+p.total+(p.skipped? ' · '+p.skipped+' skipped with a recorded reason':'')+'</td></tr>'+
     '<tr><th>Assets on the register</th><td>'+p.pop.onRegister+' in these areas'+
        (p.pop.retired? ' <span class="muted">(plus '+p.pop.retired+' already off the books)</span>':'')+'</td></tr>'+
     '<tr><th>Physically verified</th><td><b>'+p.verifiedN+' of '+p.pop.onRegister+
        ' ('+p.registerCoverage+'% of the register)</b>'+
        (p.eyeballed? ' <span class="muted">\u2014 includes '+p.eyeballed+' confirmed by eye where the tag could not be read</span>':'')+
        '</td></tr>'+
     '<tr><th>Not verifiable by reader</th><td>'+
        (p.pop.untagged||p.pop.mobile||p.pop.offsite
          ? [ (p.pop.untagged? p.pop.untagged+' carry no tag':''),
              (p.pop.mobile? p.pop.mobile+' move between areas by design':''),
              (p.pop.offsite? p.pop.offsite+' away from the plant':'')
            ].filter(Boolean).join(' \u00b7 ')
          : '<span class="muted">none \u2014 every asset on the register carries a readable tag</span>')+
        '</td></tr>'+
     '<tr><th>Reader coverage</th><td>'+p.found+' of '+p.expected+' tagged and expected ('+(p.expected?p.coverage:0)+'%)</td></tr>'+
     '<tr><th>Value verified</th><td>'+money(p.verified)+'</td></tr>'+
     '<tr><th>Value at risk</th><td>'+(p.atRisk? '<b style="color:var(--crit)">'+money(p.atRisk)+'</b>' : money(0))+'</td></tr>'+
     '<tr><th>Jobs raised</th><td>'+tasks.length+' · '+openT.length+' still open at close</td></tr>'+
     '</tbody></table></div>';

  h+='<div><span class="eyebrow">By department</span><div class="tw" style="margin-top:6px"><table><thead><tr>'+
     '<th>Department</th><th class="num">Areas</th><th class="num">Scanned</th><th class="num">Coverage</th><th class="num">Exceptions</th>'+
     '</tr></thead><tbody>';
  Object.keys(byDept).forEach(function(k){ var d=byDept[k];
    h+='<tr><td><b>'+esc(d.name)+'</b></td><td class="num">'+d.areas+'</td><td class="num">'+d.done+'</td>'+
       '<td class="num">'+(d.expected? Math.round(d.found/d.expected*100)+'%':'—')+'</td>'+
       '<td class="num">'+(d.exc? '<span class="chip crit">'+d.exc+'</span>':'0')+'</td></tr>'; });
  h+='</tbody></table></div></div>';

  var skipIds=Object.keys(r.skips||{});
  if(skipIds.length){
    h+='<div><span class="eyebrow">Areas excluded, and why</span><div class="tw" style="margin-top:6px"><table><thead><tr>'+
       '<th>Area</th><th>Reason</th><th>Recorded by</th></tr></thead><tbody>';
    skipIds.forEach(function(id){ var sk=r.skips[id];
      h+='<tr><td><b>'+esc(locName(id))+'</b> <span class="epc">'+esc(locCode(id))+'</span></td>'+
         '<td>'+esc(sk.reason)+'</td><td><small class="muted">'+esc(sk.by)+' · '+fmtDate(sk.at)+'</small></td></tr>'; });
    h+='</tbody></table></div></div>';
  }

  h+='<div><span class="eyebrow">Every exception in this audit ('+exRows.length+')</span>';
  if(!exRows.length) h+='<div class="empty">Nothing out of place. Every tagged asset was read in its own area.</div>';
  else{
    h+='<div class="tw" style="margin-top:6px"><table><thead><tr><th>Area</th><th>Finding</th><th>Asset</th><th>Tag</th><th class="num">Book value</th></tr></thead><tbody>';
    exRows.forEach(function(x){
      h+='<tr><td>'+esc(x.area)+'</td><td>'+alertChip(x.b==="missing"?"missing":x.b==="misplaced"?"misplaced":"unknown")+'</td>'+
         '<td><b>'+esc(x.name)+'</b>'+(x.code? ' <span class="epc">'+esc(x.code)+'</span>':'')+'</td>'+
         '<td class="epc">'+esc(x.epc)+'</td><td class="num">'+(x.nbv? money(x.nbv):'—')+'</td></tr>'; });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  if(forPrint){
    h+='<div class="apbox"><span class="eyebrow">Sign-off recorded in the system</span><div>'+
       (r.signedOffAt
         ? 'Signed off by <b>'+esc(r.signedOffBy)+'</b> on '+esc(fmtDate(r.signedOffAt))+'.'
         : r.status==="closed"
           ? 'Closed on '+esc(fmtDate(r.closedAt))+', not yet signed off in the system.'
           : 'This audit is still open. Figures below are provisional.')+
       '</div></div>';
    h+=printSign([["Verified by","Audit team"],
                  ["Reviewed by","Department head"],
                  ["Approved by","Finance"]]);
    h+=printFoot("Reference "+(r.ref||"—")+" · "+roundTitle(r));
    return h+'</div>';
  }

  h+='<div class="apbox'+(r.signedOffAt?' ok':'')+'"><div class="ap-h"><span class="eyebrow">Sign-off</span></div>'+
     (r.signedOffAt
       ? '<div>Signed off by <b>'+esc(r.signedOffBy)+'</b> on '+fmtDate(r.signedOffAt)+'.</div>'
       : '<div class="stack" style="gap:8px"><div class="muted">A closed audit still needs a second pair of eyes before it goes to finance. '+
         'Only an approver can sign, and not the person who opened it.</div>'+
         (r.status==="closed"? '<div class="btn-row"><button class="btn pri" data-signround="'+esc(r.id)+'">Sign off this audit</button></div>' : '')+
         '</div>')+
     '</div>';

  return h+'</div>';
}

/* ---- actions ---- */
function startByAnchor(code){
  var want=epcHex? epcHex(code) : String(code||"").toUpperCase().trim();
  var l=list("locations").filter(function(x){ return x.anchor && (epcHex?epcHex(x.anchor):x.anchor)===want; })[0];
  if(!l){ toast("No area is registered to that tag"); return; }
  var r=selectedRound();
  if(!r){ toast("Open an audit first"); return; }
  if(roundAreas(r).indexOf(l.id)<0){ toast(locName(l.id)+" is not in "+r.ref); return; }
  if(!can("audit")){ toast("Your role cannot run an audit"); return; }
  startAudit(l.id, meName());
}

function newRound(d){
  if(!can("audit")){ toast("Your role cannot open an audit"); return; }
  var st=stamp();
  if(!st.by){ toast("Sign in first"); return; }
  if(rounds().filter(function(x){return x.status==="open"&&x.title===d.title&&d.title;}).length){
    toast("An open audit already has that name"); return; }
  if(!d.scope.length){ toast("Pick at least one "+(d.scopeType==="depts"?"department":"area")); return; }
  var r={ id:uid("RND"), ref:nextRef(), title:(d.title||"").trim(), reason:d.reason, scopeType:d.scopeType, scope:d.scope,
          plannedFrom:d.from||"", plannedTo:d.to||"", status:"planned", skips:{},
          extra:[], assign:{}, scopeAdds:[],
          openedBy:st.byName, openedById:st.by, openedByCode:st.byCode, openedAt:nowISO(),
          closedAt:"", closedBy:"", closedById:"", signedOffAt:"", signedOffBy:"", signedOffById:"" };
  save("rounds",r);
  var n=roundAreas(r).length;
  RND.sel=r.id;
  toast(r.ref+" planned \u00b7 "+n+" room"+(n===1?"":"s"));
  AUD.shell=false; renderTabs(); render();
}

/* Created, not started. A plant plans next month's count this month, and until
   somebody presses Start there are no sweeps against it, so the scope, the
   dates and who walks what can all still change freely. */
function startRound(id){
  var r=round(id); if(!r||r.status!=="planned") return;
  if(!can("audit")){ toast("Your role cannot start an audit"); return; }
  var st=stamp(); if(!st.by){ toast("Sign in first"); return; }
  if(!roundAreas(r).length){ toast("Put at least one room in before starting"); return; }
  var n=clone(r);
  n.status="open"; n.startedAt=nowISO(); n.startedBy=st.byName; n.startedById=st.by;
  save("rounds",n);
  toast(r.ref+" started"); AUD.shell=false; renderTabs(); render();
}

/* Adding a room to a running audit is a normal, frequent act \u2014 with a
   hundred rooms some get missed every time \u2014 so it asks for nothing. Who
   added it and when is recorded anyway. Skipping a room is the opposite and
   still demands a reason: that is the direction in which a count gets quietly
   narrowed, and the only one an auditor cares about. */
function addAreaToRound(locId){
  var r=selectedRound(); if(!r) return;
  if(!can("audit")){ toast("Your role cannot change an audit"); return; }
  if(roundAreas(r).indexOf(locId)>=0){ toast(locName(locId)+" is already in"); return; }
  var st=stamp(), n=clone(r);
  n.extra=(n.extra||[]).concat([locId]);
  n.scopeAdds=(n.scopeAdds||[]).concat([{locId:locId, by:st.byName, byId:st.by, at:nowISO(),
                                         afterStart:(r.status==="open")}]);
  save("rounds",n); AUD.shell=false; render();
  toast(locName(locId)+" added");
}
function removePlannedArea(locId){
  var r=selectedRound(); if(!r||r.status!=="planned") return;
  var n=clone(r);
  n.extra=(n.extra||[]).filter(function(x){return x!==locId;});
  n.scope=(n.scope||[]).filter(function(x){return x!==locId;});
  n.scopeAdds=(n.scopeAdds||[]).filter(function(x){return x.locId!==locId;});
  if(n.assign) delete n.assign[locId];
  save("rounds",n); AUD.shell=false; render();
}
function assignAreas(ids,personId,quiet){
  var r=selectedRound(); if(!r) return false;
  if(!can("audit")){ toast("Your role cannot hand out work"); return false; }
  var n=clone(r); n.assign=n.assign||{};
  ids.forEach(function(id){ if(personId) n.assign[id]=personId; else delete n.assign[id]; });
  save("rounds",n);
  /* Changing a dropdown used to rebuild the whole view. On a desk that is a
     flicker; on a phone the page jumps back to the top and whoever was half
     way down a list of floors has lost their place. The record is saved either
     way \u2014 quiet mode just leaves the page where the person put it and
     touches only the few controls whose displayed value is now wrong. */
  if(!quiet){ AUD.shell=false; render(); }
  return true;
}

/* A floor shows one name only while every room under it has that name. Move a
   single room and the floor above has to stop claiming otherwise. */
function syncFloorSelect(r,fl){
  var who=assignedTo(r,fl.ids);
  var sels=document.querySelectorAll("select.floorassign");
  for(var i=0;i<sels.length;i++){
    if(sels[i].dataset.floor!==fl.key) continue;
    var sel=sels[i], mixed=sel.querySelector('option[data-mixed]');
    if(who==="*mixed*"){
      if(!mixed){
        mixed=document.createElement("option");
        mixed.value=""; mixed.setAttribute("data-mixed","1");
        mixed.textContent="\u2014 several people \u2014";
        sel.insertBefore(mixed, sel.firstChild);
      }
      mixed.selected=true;
    } else {
      if(mixed) mixed.parentNode.removeChild(mixed);
      sel.value=who||"";
    }
    return;
  }
}
function skipArea(locId){
  var r=selectedRound(); if(!r) return;
  var why=prompt("Why is "+locName(locId)+" not being scanned?\n\nThis appears in the audit report, so make it the reason an auditor would accept — locked, under maintenance, plant shut.");
  if(why===null) return;
  why=String(why).trim();
  if(!why){ toast("A reason is required to skip an area"); return; }
  var st=stamp(), n=clone(r);
  n.skips=n.skips||{}; n.skips[locId]={reason:why, by:st.byName, byId:st.by, at:nowISO()};
  save("rounds",n); AUD.shell=false; render();
}
function unskipArea(locId){
  var r=selectedRound(); if(!r) return;
  var n=clone(r); n.skips=n.skips||{}; delete n.skips[locId];
  save("rounds",n); AUD.shell=false; render();
}
function closeRound(id){
  var r=round(id); if(!r) return;
  var p=roundProgress(r);
  if(p.left>0){ toast(p.left+" area"+(p.left===1?"":"s")+" still to resolve"); return; }
  var st=stamp();
  var n=clone(r); n.status="closed"; n.closedAt=nowISO(); n.closedBy=st.byName; n.closedById=st.by;
  save("rounds",n);
  toast(r.ref+" closed");
  RND.sel=""; AUD.shell=false; render();
  wideModal('<div class="panel">'+roundReport(round(id))+'</div>');
}
function abandonRound(id){
  var r=round(id); if(!r) return;
  if(!confirm("Abandon "+r.ref+"?\n\nThe sweeps already done are kept and stay in the register. The audit itself is marked abandoned and cannot be reopened.")) return;
  var st=stamp(), n=clone(r);
  n.status="abandoned"; n.closedAt=nowISO(); n.closedBy=st.byName; n.closedById=st.by;
  save("rounds",n); toast(r.ref+" abandoned"); RND.sel=""; AUD.shell=false; render();
}
function signRound(id){
  var r=round(id); if(!r) return;
  var st=stamp();
  if(!st.by){ toast("Sign in before signing off"); return; }
  if(!can("writeoff.approve")){ toast("Only an approver can sign off an audit"); return; }
  if(r.openedById && r.openedById===st.by){ toast("The person who opened the audit cannot sign it off"); return; }
  var n=clone(r); n.signedOffAt=nowISO(); n.signedOffBy=st.byName; n.signedOffById=st.by;
  save("rounds",n); closeModal(); toast(r.ref+" signed off by "+st.byName); render();
}

function renderAudit(){
  if(!AUD.shell){ $("#main").innerHTML=auditShell(); AUD.shell=true; wireAudit(); }
  paintAudit();
}
/* A banner, not a redirect: the sweep is still running and its readings are
   still on the device, so stepping out to look at the other audits must be
   obviously reversible. */
function peekBar(){
  if(!AUD.active || !AUD.peek) return "";
  var n=Object.keys(AUD.reads).length;
  return '<div class="tallybar warn" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">'+
    '<b>Still scanning '+esc(locName(AUD.locationId))+'</b>'+
    '<span class="muted">'+n+' tag'+(n===1?'':'s')+' read so far, held on this device</span>'+
    '<span style="flex:1 1 auto"></span>'+
    '<button class="btn sm pri" id="backToSweep">Carry on scanning</button></div>';
}
function auditShell(){
  if(!AUD.active || AUD.peek){
    var _rec=peekBar()||sweepRecoveryBar();
    var _sel=selectedRound();
    if(_sel) return '<div class="view">'+_rec+roundWorklist(_sel)+'</div>';
    if(_rec) return '<div class="view">'+_rec+roundListPanel()+roundHistory()+auditHistoryBlock()+'</div>';
    /* The list is the home of this tab. Starting an audit is one thing you
       can do from it, not the only thing it shows. */
    var _any=rounds().length;
    /* A role that cannot run an audit is shown the record of them, not the
       form to open one. */
    var _start=!can("audit") ? ''
      : (_any? '<details class="addf addf-lg"><summary>'+
                 (liveRounds().length? 'Plan another audit' : 'Plan an audit')+
               '</summary>'+roundStartPanel()+'</details>'
             : roundStartPanel());
    return '<div class="view">'+roundListPanel()+_start+
      roundHistory()+auditHistoryBlock()+'</div>';
  }
  if(false){
    var ls=list("locations");
    return '<div class="view">'+
      stepper(1)+
      '<section class="panel"><div class="panel-h"><h2>Which area are you in?</h2>'+
      '<span class="sub">everything you scan will be checked against this area\'s list</span></div><div class="panel-b stack">'+
      '<div class="signedby"><span class="eyebrow">This audit will be signed by</span>'+
        '<b>'+esc(meName())+'</b><small>'+esc(roleLabel((me()||{}).role))+
        ((me()||{}).empCode?" \u00b7 "+esc(me().empCode):"")+'</small></div>'+
      (ls.length? '<div class="areapick">'+ls.map(function(l){
          var la=lastAuditAt(l.id), n=list("assets").filter(function(a){return a.home===l.id&&a.epc&&!isRetired(a);}).length;
          return '<button class="acard" data-startloc="'+esc(l.id)+'"><b>'+esc(l.name)+'</b>'+
            '<span class="ac-code">'+esc(l.code)+'</span>'+
            '<span class="ac-meta">'+n+' tagged asset'+(n===1?"":"s")+'</span>'+
            '<span class="ac-meta">'+(la? 'last audited '+ago(la.endedAt)+' ago' : '<span class="chip mute">never audited</span>')+'</span></button>';
        }).join("")+'</div>'
        : '<div class="empty">No areas yet. Add them under Assets first.</div>')+
      (mod("anchors")? '<details class="adv"><summary>Scan an area tag instead</summary><div class="adv-b">'+
        '<div class="muted">If a tag is fixed at the entrance of the area, scan it and the audit starts on the right area automatically — no picking from a list.</div>'+
        '<div class="scanbox"><input type="text" id="anchorIn" placeholder="Scan the tag at the door" autocomplete="off" spellcheck="false">'+
        '<div class="hint">Set these up under Tagging → Area tags.</div></div>'+
        '<select id="startLoc" hidden>'+locOpts(ls[0]?ls[0].id:"")+'</select>'+
        '<button class="btn" id="startBtn" hidden>Start</button>'+
      '</div></details>' : '<select id="startLoc" hidden>'+locOpts(ls[0]?ls[0].id:"")+'</select><button class="btn" id="startBtn" hidden>Start</button>')+
      '</div></section>'+auditHistoryBlock()+'</div>';
  }
  return '<div class="view">'+stepper(2)+'<div class="audit-grid">'+
    '<section class="panel" id="consolePanel"><div class="panel-h"><h2>Scanning '+esc(locName(AUD.locationId))+'</h2>'+
      '<span class="sub">'+esc(locCode(AUD.locationId))+(AUD.roundRef? ' \u00b7 part of '+esc(AUD.roundRef):'')+'</span>'+
      /* A sweep takes over the Audit tab, which left no way back to the other
         audits except cancelling the sweep or guessing that another tab and
         back would do it. This steps out and leaves the sweep running \u2014 the
         readings are on the device either way. */
      '<button class="btn sm" id="leaveSweep">\u2190 All audits</button>'+
      '<button class="btn sm danger" id="abortBtn">Cancel</button></div>'+
      '<div class="panel-b stack">'+
      '<div class="scanbox armed" id="scanBox"><input type="text" id="scanIn" placeholder="Pull the trigger" autocomplete="off" spellcheck="false">'+
        '<div class="hint" id="scanHint"></div></div>'+
      '<div class="btn-row">'+
        (demoMode()? '<button class="btn" id="simNormal">Simulate a sweep</button>' : '')+
        (mod("photos")? '<button class="btn sm" id="areaSnap">\ud83d\udcf7 Area photo</button>' : '')+
        '<button class="btn sm" id="clearReads">Start over</button>'+
        (demoMode()? '<span class="muted" style="font-size:11.5px">No reader to hand? Simulate one.</span>' : '')+
      '</div>'+
      '<div class="reads" id="readsList"></div>'+
      '<div class="btn-row"><button class="btn pri" id="commitBtn">Finish and save audit</button>'+
      '<span class="muted" id="commitNote"></span></div>'+
      (mod("advanced")? '<details class="adv"><summary>Scanner options</summary><div class="adv-b">'+
        '<div class="stack" style="gap:5px">'+
          '<div class="slider-row"><span class="eyebrow">Signal filter</span>'+
          '<input type="range" id="floor" min="-90" max="-40" step="1" value="'+cfg().floor+'">'+
          '<span class="mono" id="floorVal" style="font-size:12px;min-width:58px;text-align:right"></span></div>'+
          '<div class="muted" style="font-size:11.5px">RFID readers hear tags through walls. Raise this to ignore faint tags so equipment in the next bay is not counted as being in this one. Ignored tags stay on the list, greyed out.</div>'+
        '</div>'+
        '<div class="btn-row">'+
          (demoMode()? '<button class="btn sm" id="simStray">Simulate wall bleed-through</button>' : '')+
          '<button class="btn sm" id="pasteBtn">Paste a list of tags</button>'+
          '<label class="btn sm" style="cursor:pointer">Load tags from CSV<input type="file" id="csvReads" accept=".csv,.txt" hidden></label>'+
        '</div>'+
      '</div></details>' : '<input type="range" id="floor" min="-90" max="-40" step="1" value="'+cfg().floor+'" hidden><span id="floorVal" hidden></span>')+
      '</div></section>'+
    '<section class="stack" id="resultsPanel"></section>'+
    '</div></div>';
}
function stepper(n){
  var s=[[1,"Choose the area"],[2,"Scan"],[3,"Review and finish"]];
  return '<div class="steps">'+s.map(function(x){
    var cls=x[0]===n?"on":(x[0]<n?"done":"");
    return '<div class="step '+cls+'"><span class="sn">'+x[0]+'</span><span class="sl">'+esc(x[1])+'</span></div>';
  }).join("")+'</div>';
}
function auditHistoryBlock(){
  var audits=list("audits").sort(function(a,b){return (b.endedAt||"").localeCompare(a.endedAt||"");}).slice(0,6);
  if(!audits.length) return "";
  var h='<section class="panel"><div class="panel-h"><h2>Recent area scans</h2><span class="sub">single sweeps, including any taken before audits were introduced</span></div><div class="tw"><table>'+
    '<thead><tr><th>Finished</th><th>Area</th><th>In place</th><th>Misplaced</th><th>Missing</th><th>Unknown</th><th></th></tr></thead><tbody>';
  audits.forEach(function(a){
    h+='<tr><td class="num">'+fmtDate(a.endedAt)+'</td><td>'+esc(locName(a.locationId))+'</td>'+
       '<td class="num">'+a.counts.inplace+'</td><td class="num">'+a.counts.misplaced+'</td><td class="num">'+a.counts.missing+'</td><td class="num">'+a.counts.unknown+'</td>'+
       '<td><button class="btn sm" data-report="'+esc(a.id)+'">Report</button></td></tr>';
  });
  return h+'</tbody></table></div></section>';
}

var CONDS=[["good","Good — in working order"],["minor","Minor damage — still usable"],
  ["repair","Needs repair — not usable"],["beyond","Beyond repair — propose write-off"]];
function condLabel(k){ var c=CONDS.filter(function(x){return x[0]===k;})[0]; return c?c[1]:""; }
function condChip(k){
  if(!k) return "";
  var cls = k==="good"?"ok" : k==="minor"?"warn" : "crit";
  return '<span class="chip '+cls+'">'+esc(condLabel(k).split(" \u2014 ")[0])+'</span>';
}
function condNote(epc){
  if(!mod("photos")) return "";
  var c=AUD.cond&&AUD.cond[epc];
  if(!c) return "";
  return " \u00b7 "+condLabel(c.cond).split(" \u2014 ")[0].toLowerCase()+(c.note?" ("+c.note+")":"");
}
function snapBtn(epc,name,what){
  if(!mod("photos")) return "";
  var has=AUD.photos&&AUD.photos[epc];
  return '<button class="btn sm'+(has?" pri":"")+'" data-exsnap="'+esc(epc)+'" data-exname="'+esc(name||"")+'" '+
    'title="Photograph '+esc(what||"this item")+' and record its condition">'+(has?"\ud83d\udcf7\u2713":"\ud83d\udcf7")+'</button>';
}
/* Exception evidence: one photo and a condition, for the handful of items
   that need it — never for the hundreds a sweep reads in seconds. */
function exceptionEvidence(epc,name){
  var existing=AUD.photos[epc], cur=(AUD.cond&&AUD.cond[epc])||{cond:"",note:""};
  var show=function(pid){
    modal('<div class="panel-h"><h2>Evidence \u2014 '+esc(name||epc)+'</h2>'+
      '<span class="sub">'+esc(locName(AUD.locationId))+'</span>'+
      '<button class="btn sm" data-close>Close</button></div><div class="panel-b stack">'+
      (pid? '<img src="'+photo(pid).data+'" alt="Evidence photo" style="width:100%;max-height:44vh;object-fit:contain;border-radius:6px;border:1px solid var(--line)">'
          : '<div class="muted">No photo attached yet.</div>')+
      '<div class="btn-row"><button class="btn" id="exShoot">\ud83d\udcf7 '+(pid?"Replace photo":"Take photo")+'</button>'+
      (pid?'<button class="btn danger sm" id="exDrop">Remove</button>':'')+'</div>'+
      '<label class="fld"><span>Condition</span><select id="exCond"><option value="">Not recorded</option>'+
        CONDS.map(function(c){return '<option value="'+c[0]+'"'+(cur.cond===c[0]?" selected":"")+'>'+esc(c[1])+'</option>';}).join("")+
      '</select></label>'+
      '<label class="fld"><span>Note</span><input type="text" id="exNote" value="'+esc(cur.note||"")+'" placeholder="What the auditor saw"></label>'+
      '<div class="muted" style="font-size:12px">Physical verification is about existence, location <b>and</b> condition. '+
      'This is the record an auditor asks for when a discrepancy is reported.</div>'+
      '<div class="btn-row"><button class="btn pri" id="exSave">Save evidence</button>'+
      '<button class="btn" data-close>Cancel</button></div></div>');
    $("#exShoot").addEventListener("click",function(){
      pickPhoto(function(d){
        var id=savePhoto(d,"audit",(name||epc)+" \u2014 "+locName(AUD.locationId),AUD.operator);
        AUD.photos[epc]=id; sweepSave(); closeModal(); exceptionEvidence(epc,name);
      });
    });
    if($("#exDrop")) $("#exDrop").addEventListener("click",function(){
      remove("photos",AUD.photos[epc]); delete AUD.photos[epc]; sweepSave(); closeModal(); exceptionEvidence(epc,name);
    });
    $("#exSave").addEventListener("click",function(){
      var cv=$("#exCond").value, nv=$("#exNote").value.trim();
      if(cv||nv) AUD.cond[epc]={cond:cv,note:nv}; else delete AUD.cond[epc];
      sweepSave();
      closeModal(); paintAudit(); toast("Evidence saved");
    });
  };
  if(existing) show(existing);
  else pickPhoto(function(d){
    AUD.photos[epc]=savePhoto(d,"audit",(name||epc)+" \u2014 "+locName(AUD.locationId),AUD.operator);
    show(AUD.photos[epc]);
  });
}

/* A handheld streams tens of reads a second. Repainting the whole results
   panel and re-serialising the sweep on each one is what made a trigger pull
   cost a fifth of a second at plant scale. Reads are cheap; the paint and the
   save are coalesced to the end of the burst, so a hundred reads cost one of
   each. A short save delay is the only exposure, and the alternative was
   losing the sweep altogether. */
var PAINT_T=null, SAVE_T=null;
function schedulePaint(){
  if(PAINT_T) return;
  PAINT_T=setTimeout(function(){ PAINT_T=null;
    if(AUD.active && VIEW==="audit" && AUD.shell){ paintAudit(); paintReadout(); }
  },120);
}
function scheduleSweepSave(){
  if(SAVE_T) return;
  SAVE_T=setTimeout(function(){ SAVE_T=null; sweepSave(); },400);
}
function flushSweep(){
  if(SAVE_T){ clearTimeout(SAVE_T); SAVE_T=null; }
  if(PAINT_T){ clearTimeout(PAINT_T); PAINT_T=null; }
  if(AUD.active) sweepSave();
}
function paintAudit(){
  /* While peeking at the other audits the scan DOM is not on the page. */
  if(!AUD.active || AUD.peek) return;
  /* Tags can arrive from a host app before the scan DOM has been built — a
     handheld that starts a sweep through the host API and reads a tag in the
     same breath gets here first. Painting into elements that do not exist threw,
     and the throw travelled back out through bridgeFeed, so the reader saw its
     feed() call fail even though the reads had already been taken. Build the
     screen instead, once, and let the render paint it. */
  if(!$("#floorVal")||!$("#commitNote")||!$("#readsList")){
    if(!paintAudit._building){
      paintAudit._building=true;
      try{ render(); } finally { paintAudit._building=false; }
    }
    return;
  }
  var b=buckets(), exp=expectedCount();
  var filtered=Object.keys(AUD.reads).filter(function(e){return !rssiClass(AUD.reads[e].rssi);}).length;
  $("#floorVal").textContent=cfg().floor+" dBm";
  $("#scanHint").innerHTML = AUD.wedge
    ? 'Ready — scan anywhere on this screen. <b>'+Object.keys(AUD.reads).length+'</b> tag'+(Object.keys(AUD.reads).length===1?'':'s')+' read'+
      (filtered? ', '+filtered+' ignored as too faint' : '')+'.'
    : 'Paused. Click the box to carry on.';
  $("#commitNote").textContent = (b.inplace.length+b.misplaced.length)+" found · "+b.missing.length+" not found · "+b.unknown.length+" not in the register"+
    (b.away.length? " · "+b.away.length+" mobile (no action)" : "")+
    (b.eyeballed.length? " · "+b.eyeballed.length+" seen by eye" : "")+
    (b.offsite.length? " · "+b.offsite.length+" away from plant" : "");

  var rl=$("#readsList"), keys=Object.keys(AUD.reads).sort(function(a,c){return AUD.reads[c].lastAt-AUD.reads[a].lastAt;});
  if(!keys.length) rl.innerHTML='<div class="empty">No reads yet. Pull the trigger on the reader'+(demoMode()?', or run a simulated sweep':'')+'.</div>';
  else rl.innerHTML=keys.map(function(epc){
    var r=AUD.reads[epc], pass=rssiClass(r.rssi), c=classify(epc);
    var dot = !pass?"mute":(c.b==="inplace"?"ok":c.b==="misplaced"?"warn":"unk");
    var nm = c.asset? esc(c.asset.name)+" · "+esc(c.asset.code) : "unregistered tag";
    if(c.asset&&c.b==="misplaced") nm+=" · belongs in "+esc(locName(c.asset.home));
    if(c.asset&&isRetired(c.asset)) nm+=" · "+esc(statusLabel(c.asset.status)).toLowerCase()+" on paper";
    if(!pass) nm+=" · below floor";
    var pid=AUD.photos[epc];
    return '<div class="read'+(pass?"":" filtered")+(epc===AUD.lastNew?" new":"")+'"><span class="dot '+dot+'"></span>'+
      '<span><span class="id">'+esc(epc)+'</span><span class="nm">'+nm+'</span></span>'+
      '<span class="rssi">'+r.rssi+' dBm</span>'+
      '<span class="ct">'+(pid?'\ud83d\udcf7 ':'')+'x'+r.count+'</span></div>';
  }).join("");

  var cov=exp? Math.round(b.inplace.length/exp*100):0;
  var tot=b.inplace.length+b.misplaced.length+b.missing.length+b.unknown.length||1;
  var h='<div class="panel"><div class="panel-b stack" style="gap:9px">'+
    '<div class="row-between"><h2 style="font-size:14.5px">What the scan found</h2><span class="mono" style="font-size:12px">'+b.inplace.length+' of '+exp+' expected assets found — '+cov+'%</span></div>'+
    '<div class="bar">'+seg(b.inplace.length,tot,"ok")+seg(b.misplaced.length,tot,"warn")+seg(b.missing.length,tot,"crit")+seg(b.unknown.length,tot,"unk")+'</div>'+
    '<div class="muted" style="font-size:11.5px">Updates live as tags arrive. Finishing saves the audit and turns every problem into a job for the right team.</div>'+
    (function(){
      if(!mod("depreciation")) return '';
      var v=b.missing.reduce(function(n,x){return n+nbvOf(x.asset);},0);
      var g=b.misplaced.reduce(function(n,x){return n+nbvOf(x.asset);},0);
      if(!v&&!g) return '';
      return '<div class="atrisk"><b>'+inrShort(v)+'</b> of net block not found here'+
        (g? ', <b>'+inrShort(g)+'</b> found out of place':'')+
        '<small>carrying value under Schedule II \u2014 this is the figure finance has to account for</small></div>';
    })()+
    (retiredRead(b).length? '<div class="note" style="border-left-color:var(--warn)"><b>'+retiredRead(b).length+' retired asset'+(retiredRead(b).length===1?"":"s")+' read here.</b> Scrapped or written off in the register but physically present — worth a look before the write-off is signed off.</div>' : '')+
    '</div></div>';
  h+=bucket("b-ok","In place",b.inplace.length,"here, and this is where they belong",b.inplace.map(function(x){
      return brow(x.asset.name, x.asset.code+" · "+x.epc, '<span class="chip ok">ok</span>'); }));
  h+=bucket("b-warn","Misplaced",b.misplaced.length,"here, but they belong somewhere else",b.misplaced.map(function(x){
      return brow(x.asset.name, x.asset.code+" · allotted to "+locName(x.asset.home)+condNote(x.epc),
        snapBtn(x.epc,x.asset.name)+'<button class="btn sm" data-relocate="'+esc(x.asset.id)+'">Re-allot here</button>'); }));
  h+=bucket("b-crit","Missing",b.missing.length,"belong here, but were not found",b.missing.map(function(x){
      var seen=x.asset.lastSeenLoc?("last seen "+locName(x.asset.lastSeenLoc)+", "+ago(x.asset.lastSeenAt)+" ago"):"never read";
      var nv=mod("depreciation")?nbvOf(x.asset):0;
      return brow(x.asset.name, x.asset.code+" · "+seen+condNote(x.asset.epc),
        snapBtn(x.asset.epc,x.asset.name,"where it should be")+
        '<button class="btn sm" data-eyeball="'+esc(x.asset.id)+'" '+
          'title="The asset is here but the reader cannot see its tag">I can see it</button>'+
        (nv?'<span class="chip crit">'+inrShort(nv)+'</span>':'<span class="chip crit">not found</span>')); }));
  if(b.eyeballed.length) h+=bucket("b-eye","Seen by eye, tag unreadable",b.eyeballed.length,
    "physically verified — the tag needs replacing",b.eyeballed.map(function(x){
      return brow(x.asset.name, x.asset.code+" · confirmed present by "+esc((x.found||{}).by||"—")+
        ((x.found||{}).note? " · "+esc(x.found.note) : ""),
        '<button class="btn sm" data-uneyeball="'+esc(x.asset.id)+'">Undo</button>'+
        '<span class="chip warn">re-tag</span>'); }));
  if(b.away.length) h+=bucket("b-mute","Moves between areas",b.away.length,
    "flagged as mobile — no action needed",b.away.map(function(x){
      var where=x.asset.home===AUD.locationId
        ? "not here today"
        : "homed in "+locName(x.asset.home)+", found here";
      return brow(x.asset.name, x.asset.code+" · "+where,
        '<span class="chip mute">mobile</span>'); }));
  if(b.offsite.length) h+=bucket("b-mute","Away from the plant",b.offsite.length,
    "out for repair, on loan or in transit \u2014 not expected here",b.offsite.map(function(x){
      var a=x.asset, od=offsiteOverdue(a);
      return brow(a.name, a.code+" \u00b7 "+statusLabel(a.status)+
        (a.statusNote? " \u00b7 "+a.statusNote : "")+
        (a.dueBack? " \u00b7 due back "+fmtDay(a.dueBack) : " \u00b7 no return date set"),
        od? '<span class="chip crit">overdue back</span>' : '<span class="chip mute">away</span>'); }));
  if(b.retired.length) h+=bucket("b-mute","Replaced tags still in the area",b.retired.length,
    "came off an asset and were never destroyed",b.retired.map(function(x){
      var d=x.dead||{};
      return brow(d.assetCode? (d.assetCode+" — old tag") : "Replaced tag",
        shortEpc(x.epc)+" · replaced "+fmtDate(d.at)+" by "+(d.by||"—")+
        " · "+retagReasonLabel(d.reason),
        '<span class="chip mute">destroy it</span>'); }));
  h+=bucket("b-unk","Unknown tags",b.unknown.length,"found here, but not in your register",b.unknown.map(function(x){
      return brow(x.epc, "no asset holds this tag"+condNote(x.epc),
        snapBtn(x.epc,"Unregistered tag")+'<button class="btn sm" data-enroll="'+esc(x.epc)+'">Enrol</button>'); }));
  $("#resultsPanel").innerHTML=h;
}
function bucket(cls,title,n,desc,rows){
  return '<details class="bucket '+cls+'"'+(n?" open":"")+'><summary><span class="c">'+n+'</span>'+esc(title)+
    '<span class="d">'+esc(desc)+'</span></summary>'+
    (rows.length? '<div class="blist">'+rows.join("")+'</div>' : '<div class="empty" style="padding:14px">None.</div>')+'</details>';
}
