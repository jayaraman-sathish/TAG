document.addEventListener("keydown",function(e){
  if(e.key!=="Enter") return;
  if(e.target.id==="pinIn"){ e.preventDefault(); var gb=$("#pinGo"); if(gb) gb.click(); return; }
  if(e.target.id==="runEpc"){ e.preventDefault(); var v=e.target.value; e.target.value=""; runAssign(v); }
  if(e.target.id==="verEpc"){ e.preventDefault(); var ve=e.target.value; e.target.value=""; verifyRead(ve); }
  if(e.target.id==="verFixCode"){ e.preventDefault();
    var fa=assetByCode(e.target.value); e.target.value="";
    if(!fa){ toast("No asset in the register has that code"); return; }
    verifyMove(fa.id); }
  if(e.target.id==="tagFind"){ e.preventDefault();
    var raw=String(e.target.value||"").trim();
    if(!raw) return;
    /* One field, three possible things arriving at it. A tag read while the
       asset label was meant to be scanned is the commonest mis-scan on a
       handheld that does both, so it is caught by shape rather than left to
       fail as "no asset has that code". */
    var hexish=/^[0-9A-Fa-f]{16,}$/.test(raw.replace(/[^0-9A-Za-z]/g,""));
    var byEpc=assetByEpc(normEpc(raw));
    if(hexish && !assetByCode(raw)){
      if(byEpc){ tagPick(byEpc.id); toast("That tag is already on "+byEpc.code); return; }
      if(TAGM_PICK.id){ var tf=$("#tagEpc"); if(tf){ tf.value=raw; tf.focus(); }
        toast("That looks like a tag \u2014 moved it to the tag field"); e.target.value=""; return; }
      toast("That looks like a tag, not an asset label. Scan the asset first."); e.target.value=""; return;
    }
    var ta=assetByCode(raw);
    if(ta){ e.target.value=""; tagPick(ta.id); return; }
    /* Not an exact code: treat it as a search rather than a dead end. */
    TAGM_PICK.q=raw; TAGM_PICK.hits=tagMatches(raw,8);
    if(!TAGM_PICK.hits.length){ toast("Nothing in the register matches \u201c"+raw+"\u201d"); return; }
    if(TAGM_PICK.hits.length===1){ e.target.value=""; tagPick(TAGM_PICK.hits[0].id); return; }
    render(); setTimeout(function(){ var el=$("#tagFind"); if(el){ el.focus(); el.select(); } },20); }
  if(e.target.id==="runFind"){ e.preventDefault();
    var ra=assetByCode(e.target.value); e.target.value="";
    if(!ra){ toast("No asset in the register has that code"); return; }
    var at=TAGM.queue.indexOf(ra.id);
    if(at<0){ TAGM.queue.splice(TAGM.idx,0,ra.id); at=TAGM.idx; }
    TAGM.idx=at; render();
    setTimeout(function(){ var el=$("#runEpc"); if(el) el.focus(); },20); }
});

function tagPick(id){
  var a=asset(id); if(!a) return;
  TAGM_PICK.id=id; TAGM_PICK.q=""; TAGM_PICK.hits=[];
  render();
  setTimeout(function(){
    var hm=$("#tagHome"); if(hm&&a.home) hm.value=a.home;
    var te=$("#tagEpc"); if(te&&!te.disabled) te.focus();
  },20);
  toast(a.code+" \u2014 "+a.name);
}

/* Typing searches as you go; a scan arrives too fast for this to fire more
   than once and ends in Enter, which the handler above takes. */
var tagFindT=0;
document.addEventListener("input",function(e){
  if(!e.target||e.target.id!=="tagFind") return;
  var v=String(e.target.value||"");
  clearTimeout(tagFindT);
  tagFindT=setTimeout(function(){
    var hits=tagMatches(v,8);
    /* Re-rendering on every keystroke would steal the caret. Only the list
       is replaced. */
    TAGM_PICK.q=v; TAGM_PICK.hits=hits;
    var host=$("#tagHits");
    if(host) host.innerHTML=tagHitsList();
  },180);
});

/* ---- Reader check ---------------------------------------------------------
   Proving a reader is wired up correctly should not require starting a
   statutory audit. Arm this, pull the trigger, and whatever arrives is listed
   \u2014 by whichever of the four routes it came. Nothing it sees is recorded
   against an audit or an asset. */
var RCHK={on:false, tags:{}, first:0, last:0, src:""};
function rchkAdd(epc,rssi,src){
  epc=normEpc(epc); if(!epc||epc.length<4) return false;
  var now=Date.now();
  if(!RCHK.first) RCHK.first=now;
  RCHK.last=now; if(src) RCHK.src=src;
  var t=RCHK.tags[epc];
  if(!t){ t=RCHK.tags[epc]={epc:epc,n:0,rssi:null,at:now}; }
  t.n++; if(rssi!=null) t.rssi=Number(rssi); t.at=now;
  paintRchk(); return true;
}
function rchkReset(){ RCHK.tags={}; RCHK.first=0; RCHK.last=0; RCHK.src=""; paintRchk(); }
function paintRchk(){
  var el=document.getElementById("rchkBody"); if(!el) return;
  var tags=Object.keys(RCHK.tags).map(function(k){return RCHK.tags[k];})
    .sort(function(a,b){return b.at-a.at;});
  var secs=RCHK.first? Math.max(1,(RCHK.last-RCHK.first)/1000) : 0;
  var reads=tags.reduce(function(n,t){return n+t.n;},0);
  var known=tags.filter(function(t){return !!assetByEpc(t.epc);}).length;
  var h='';
  if(!RCHK.on && !tags.length){
    h='<div class="empty">Not listening. Press Start, then pull the trigger on the reader.</div>';
  } else if(!tags.length){
    h='<div class="empty">Listening\u2026 nothing has arrived yet. If nothing comes, the reader is not reaching this page \u2014 check the DataWedge profile below.</div>';
  } else {
    h='<div class="valrow">'+
      valCell("Different tags",String(tags.length),reads+" read"+(reads===1?"":"s")+" in total")+
      valCell("Rate",(secs? (reads/secs).toFixed(1):"\u2014")+" /sec",secs? Math.round(secs)+"s of listening":"")+
      valCell("In your register",known+" of "+tags.length,(tags.length-known)+" not on the register")+
      (RCHK.src? valCell("Arrived via",RCHK.src,"") : "")+
      '</div>'+
      '<div class="tw cardtbl"><table><thead><tr><th>Tag</th><th>Asset</th>'+
      '<th class="num">Reads</th><th class="num">Signal</th></tr></thead><tbody>'+
      tags.slice(0,40).map(function(t){
        var a=assetByEpc(t.epc);
        return '<tr><td><span class="epc">'+esc(t.epc)+'</span></td>'+
          '<td data-l="Asset">'+(a? '<b>'+esc(a.name)+'</b> <span class="epc">'+esc(a.code)+'</span>'
                                  : '<span class="muted">not in the register</span>')+'</td>'+
          '<td class="num" data-l="Reads">'+t.n+'</td>'+
          '<td class="num" data-l="Signal">'+(t.rssi==null? '<span class="muted">\u2014</span>' : t.rssi+' dBm')+'</td></tr>';
      }).join("")+'</tbody></table></div>'+
      (tags.length>40? '<div class="muted">Showing the 40 most recent.</div>' : '');
  }
  el.innerHTML=h;
  var b=document.getElementById("rchkBtn");
  if(b){ b.textContent=RCHK.on? "Stop listening" : "Start listening";
         b.className="btn "+(RCHK.on?"danger":"pri"); }
}

/* keyboard-wedge fallback: capture fast keystrokes anywhere on the audit screen */
var wedgeBuf="", wedgeT=0;
document.addEventListener("keydown",function(e){
  var probing=RCHK.on;
  if(!probing && (VIEW!=="audit"||!AUD.active)) return;
  var ae=document.activeElement;
  if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT")) return;
  var now=Date.now();
  /* DataWedge keystroke output needs a 50 ms gap between characters, well
     inside this window; a human typing is not. */
  if(now-wedgeT>120) wedgeBuf="";
  wedgeT=now;
  if(e.key==="Enter"){
    /* Belt and braces: whatever has focus, the wedge's Enter is a terminator,
       not a button press. */
    if(probing) e.preventDefault();
    if(wedgeBuf.length>3){
      if(probing) rchkAdd(wedgeBuf,null,"keyboard wedge");
      else { addRead(wedgeBuf,null); paintAudit(); paintReadout(); }
    }
    wedgeBuf=""; return;
  }
  if(e.key.length===1) wedgeBuf+=e.key;
});

/* tag screen: keep the scan field focused */
document.addEventListener("focusout",function(){
  if(VIEW!=="tagging") return;
  setTimeout(function(){
    var ae=document.activeElement;
    if(!$("#overlay").innerHTML && (!ae||ae===document.body)){ var el=$("#verEpc")||$("#runEpc")||$("#tagEpc"); if(el) el.focus(); }
  },60);
});

/* A tablet that sleeps or a tab that closes must not lose the tail of a
   burst that the save was still waiting on. */
window.addEventListener("pagehide",function(){ try{ flushSweep(); }catch(e){} });
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){ try{ flushSweep(); }catch(e){} } });

boot();
})();
