:root{
  /* surfaces — cool grey-blue ground, white panels */
  --ground:#F2F4F6; --surface:#FFFFFF; --surface-2:#F6F8F9; --surface-3:#EDF1F3;
  --line:#DFE4E8; --line-2:#C8D0D7;
  --ink:#16212B; --ink-2:#44525E; --ink-3:#5D6B77;

  /* chrome is LIGHT in this theme, not a dark fascia */
  --chrome:#FFFFFF; --chrome-2:#FBFCFC; --chrome-rule:#DFE4E8;
  --chrome-ink:#16212B; --chrome-ink-2:#5D6B77;

  --accent:#0D6173; --accent-2:#094C5B; --accent-soft:#E3F0F2;
  --signal:#9A6200; --signal-soft:#FBF1DC;
  --ok:#1B7A45; --ok-soft:#E2F2E8;
  --warn:#9A6200; --warn-soft:#FBF1DC;
  --crit:#B52A2A; --crit-soft:#F9E3E1;
  --unk:#4A4F96; --unk-soft:#E8E9F5;

  --brand-o:#F5913A; --brand-p:#F05F6E; --stamp:#C62D3A;

  --shadow:0 1px 2px rgba(22,33,43,.06);
  --radius:6px;

  --display:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}

    --ink:#E2E8EC; --ink-2:#AAB6BF; --ink-3:#93A1AB;
    --chrome:#171E23; --chrome-2:#141A1F; --chrome-rule:#28323A;
    --chrome-ink:#E2E8EC; --chrome-ink-2:#93A1AB;
    --accent:#56B6C6; --accent-2:#7ACCD9; --accent-soft:#163238;

    --ok:#5CCB8A; --ok-soft:#163023;

}

*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.012em;}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
button{font:inherit; color:inherit;}
input,select,textarea{font:inherit; color:inherit;}
a{color:var(--accent); text-underline-offset:2px;}

/* ---------- chrome ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--surface); border-bottom:1px solid var(--line);}
.topbar-in{max-width:1220px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.mark{display:flex; align-items:baseline; gap:9px; margin-right:auto;}
.mark .glyph{width:22px;height:22px;flex:0 0 22px;align-self:center;}
.mark b{font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:-.02em;}
.mark span{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);}

.readout{display:flex; align-items:stretch; gap:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface-2);}
.readout div{padding:5px 11px; display:flex; flex-direction:column; gap:1px; border-right:1px solid var(--line);}
.readout div:last-child{border-right:0}
.readout dt{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin:0;}
.readout dd.warn{color:var(--warn)}
.readout dd{font-family:var(--mono); font-size:12.5px; font-weight:500; margin:0; font-variant-numeric:tabular-nums;}
.live{color:var(--accent);}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);vertical-align:middle;margin-right:5px;}
/* A lost reader must not look like a live one. */
.pulse.off{background:var(--crit);animation:none;}
.readout dd.live.warn, .readout dd.warn{color:var(--crit);}
.pulse.on{background:var(--ok); animation:bl 1.4s ease-in-out infinite;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse.on{animation:none}}

/* The tab bar sticks directly under the header. Its offset used to be the
   literal 45px the header happened to be when this was written; the header is
   taller than that whenever its tiles wrap, which is most screens, so the tabs
   slid underneath it and navigation vanished as soon as you scrolled. The
   offset is now measured from the header itself (see syncStickyOffsets) and
   re-measured whenever it changes shape. The 45px stays only as the value used
   before the first measurement. */
nav.tabs{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--topbar-h, 45px)); z-index:39;}
.tabs-in{max-width:1220px; margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto;}
.tab{background:none; border:0; border-bottom:2px solid transparent; padding:10px 13px; cursor:pointer; font-family:var(--display); font-weight:500; font-size:13.5px; color:var(--ink-2); white-space:nowrap; display:flex; align-items:center; gap:7px;}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600;}
.tab .n{font-family:var(--mono); font-size:10.5px; background:var(--surface-3); color:var(--ink-2); padding:1px 5px; border-radius:99px;}
.tab .n.hot{background:var(--crit-soft); color:var(--crit);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;}

main{max-width:1220px; margin:0 auto; padding-block:22px 64px; padding-left:16px; padding-right:16px;}
.view{display:flex; flex-direction:column; gap:20px;}

/* ---------- primitives ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
.panel-h{display:flex; align-items:center; gap:12px; padding:12px 15px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.panel-h h2{font-size:14.5px;}
.panel-h .sub{font-size:12.5px; color:var(--ink-3); margin-right:auto;}
.panel-b{padding:15px;}
.eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3);}

.btn{background:var(--surface); border:1px solid var(--line-2); border-radius:5px; padding:6px 12px; font-family:var(--display); font-size:13px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.btn:hover{border-color:var(--ink-3); background:var(--surface-2);}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff;}
:root[data-theme="dark"] .btn.pri, :root:not([data-theme="light"]) .btn.pri{color:#06191B;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.pri{color:#fff;}}
.btn.pri:hover{background:var(--accent-2); border-color:var(--accent-2);}
.btn.sm{padding:3px 8px; font-size:12px;}
.btn:disabled{opacity:.42; cursor:not-allowed;}
.btn.danger{color:var(--crit); border-color:var(--crit);}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

label.fld{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-2); min-width:0;}
label.fld > span{font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);}
input[type=text],input[type=email],select,textarea{background:var(--surface); border:1px solid var(--line-2); border-radius:5px; padding:6px 9px; font-size:13.5px; width:100%; min-width:0;}
textarea{font-family:var(--mono); font-size:12.5px; resize:vertical;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent);}
.grid-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end;}

table{width:100%; border-collapse:collapse; font-size:13px;}
.tw{overflow-x:auto;}

/* ---- Tables that become cards on a phone --------------------------------
   A six-column row inside a horizontally scrolling box is readable on a desk
   and useless in a hand: you scroll sideways to find out which room a number
   belonged to, and lose the row doing it. A table marked .cardtbl keeps its
   columns on a wide screen and becomes one card per row on a narrow one, each
   cell labelled from its own data-l so the heading travels with the value
   instead of sitting off-screen at the top.

   This is the same markup either way. Nothing is hidden on mobile and nothing
   is duplicated for it — a second markup path is a second thing to forget to
   update, and the thing forgotten is always the small screen. */
@media (max-width:680px){
  .cardtbl > table{ min-width:0; }
  .cardtbl thead{ display:none; }
  .cardtbl > table, .cardtbl tbody, .cardtbl tr, .cardtbl td{ display:block; width:auto; }
  .cardtbl tbody tr{
    border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin:0 0 10px;
    background:var(--surface);
  }
  .cardtbl tbody tr:hover{ background:var(--surface); }
  .cardtbl tbody tr.subrow{ margin-left:14px; border-left:3px solid var(--line-2); }
  .cardtbl td{
    border:0; padding:5px 0; display:flex; gap:12px; align-items:baseline;
    justify-content:space-between; text-align:right;
  }
  /* The first cell is the thing the row is about, so it reads as a heading
     rather than as another labelled field. */
  .cardtbl td:first-child{
    display:block; text-align:left; font-size:15px; padding:0 0 7px;
    border-bottom:1px solid var(--line); margin-bottom:5px;
  }
  .cardtbl td:first-child:before{ content:none; }
  .cardtbl td[data-l]:before{
    content:attr(data-l); flex:0 0 auto; text-align:left;
    font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-3); white-space:nowrap;
  }
  /* An empty cell would otherwise leave a stranded label. */
  .cardtbl td:empty{ display:none; }
  /* These override inline styles written for the wide layout \u2014 a right-aligned
     button row and a 28px indent are right in a table column and wrong in a
     card, where they read as a stranded button and a centred heading. */
  .cardtbl td.btn-row{ justify-content:flex-start !important; flex-wrap:wrap; gap:8px !important; padding-top:9px; }
  .cardtbl tbody tr.subrow td:first-child{ padding-left:0 !important; }
  .cardtbl td[style*="min-width"]{ min-width:0 !important; }
  .cardtbl td select{ max-width:62%; }
  .cardtbl .rbar{ width:120px; }
  /* Thumbs, not cursors. */
  .cardtbl .btn, .cardtbl .btn.sm{ min-height:40px; padding:0 14px; font-size:13.5px; }
}
@media (max-width:680px){
  /* Same reasoning wherever a control is tapped rather than clicked. */
  .panel-h .btn, .panel-b .btn{ min-height:40px; }
  .panel-h{ flex-wrap:wrap; }
}
th{text-align:left; font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2);}
td{padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.epc{font-family:var(--mono); font-size:11.5px; letter-spacing:.02em; color:var(--ink-2);}

.chip{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:3px; white-space:nowrap;}
.chip.ok{background:var(--ok-soft); color:var(--ok);}
.chip.warn{background:var(--warn-soft); color:var(--warn);}
.chip.crit{background:var(--crit-soft); color:var(--crit);}
.chip.unk{background:var(--unk-soft); color:var(--unk);}
.chip.mute{background:var(--surface-3); color:var(--ink-3);}
.chip.acc{background:var(--accent-soft); color:var(--accent);}

.empty{padding:26px 16px; text-align:center; color:var(--ink-3); font-size:13.5px;}

.camb{background:none;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:11px;line-height:1;padding:3px 5px;opacity:.55;}
.camb:hover{opacity:1;border-color:var(--accent)}
.camb.has{opacity:1;border-color:var(--ok);background:var(--ok-soft)}
.pstrip{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.pthumb{padding:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;background:var(--surface-2);flex:0 0 auto}
.pthumb:hover{border-color:var(--accent)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pshow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.atrisk{background:var(--crit-soft);border:1px solid var(--crit);border-radius:var(--radius);padding:9px 12px;font-size:13px;color:var(--crit);}
.atrisk b{font-family:var(--display);font-weight:700;font-size:15px}
.atrisk small{display:block;color:var(--ink-2);font-size:11px;margin-top:2px}
.valrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.valrow>*{min-width:0}
.vcell{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;background:var(--surface-2)}
.vk{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.vv{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.vf{font-size:11px;color:var(--ink-3);margin-top:1px}

/* ---------- data grid ---------- */
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:11px 15px; border-bottom:1px solid var(--line); background:var(--surface-2);}
.toolbar .search{flex:1 1 230px; min-width:170px; max-width:420px;}
.toolbar select{width:auto; min-width:118px; max-width:190px;}
.toolbar .dfld{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);}
.toolbar .dfld input{width:auto; font-size:12.5px; padding:5px 7px;}
.bulkbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:9px 15px; background:var(--accent-soft); border-bottom:1px solid var(--accent);}
.bulkbar b{font-size:13px; color:var(--accent);}
.bulkbar select,.bulkbar input{width:auto; min-width:140px;}
table.grid th.sortable{cursor:pointer; user-select:none; white-space:nowrap;}
table.grid th.sortable:hover{color:var(--ink)}
table.grid th.sortable .sar{font-style:normal; font-size:8px; margin-left:5px; opacity:.3;}
table.grid th.sortable.on{color:var(--accent)}
table.grid th.sortable.on .sar{opacity:1}
table.grid td{vertical-align:middle}
table.grid th.cbx,table.grid td.cbx{width:32px; padding-left:13px; padding-right:0;}
table.grid tr.rowlate td.late{color:var(--crit); font-weight:600;}
table.grid tr.rowsel{background:var(--accent-soft)}
table.grid tr.rowsel:hover{background:var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent); width:15px; height:15px; cursor:pointer;}
.pager{display:flex; gap:11px; align-items:center; flex-wrap:wrap; padding:10px 15px; border-top:1px solid var(--line); background:var(--surface-2);}
.pager .pcount{font-family:var(--mono); font-size:11.5px; color:var(--ink-3);}
.pager .btn-row{margin-left:auto}
.pager .psize{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:6px;}
.pager .psize select{width:auto; padding:3px 6px; font-size:12px;}
@media (max-width:640px){.pager .btn-row{margin-left:0}.toolbar .search{max-width:none}}

/* ---------- home actions ---------- */
.actions{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:11px;}
.actions > *{min-width:0}
.action{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 15px 13px; cursor:pointer; display:flex; flex-direction:column; gap:6px; transition:border-color .12s, transform .12s;}
.action:hover{border-color:var(--accent); transform:translateY(-1px);}
.action svg{width:26px; height:26px; color:var(--accent); margin-bottom:2px;}
.action b{font-family:var(--display); font-size:15.5px; font-weight:600; letter-spacing:-.01em;}
.action p{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.45;}
.action .ahint{margin-top:auto; padding-top:8px; font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; color:var(--ink-3); text-transform:uppercase;}
@media (prefers-reduced-motion:reduce){.action:hover{transform:none}}

/* ---------- help ---------- */
.howto{display:flex; flex-direction:column; gap:13px;}
.hstep{display:flex; gap:12px; align-items:flex-start;}
.hstep .hn{flex:0 0 26px; height:26px; border-radius:50%; background:var(--accent); color:var(--surface); display:grid; place-items:center; font-family:var(--mono); font-size:12.5px; font-weight:600;}
:root[data-theme="dark"] .hstep .hn, :root:not([data-theme="light"]) .hstep .hn{color:#06191B;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .hstep .hn{color:#fff;}}
.hstep b{font-family:var(--display); font-size:14px; display:block; margin-bottom:2px;}
.hstep p{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.5;}

/* ---------- steps ---------- */
.steps{display:flex; align-items:center; gap:0; flex-wrap:wrap; margin-bottom:2px;}
.step{display:flex; align-items:center; gap:7px; padding:6px 13px 6px 10px; font-size:12.5px; color:var(--ink-3); background:var(--surface-2); border:1px solid var(--line); border-right:0;}
.step:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.step:last-child{border-radius:0 var(--radius) var(--radius) 0; border-right:1px solid var(--line)}
.step .sn{width:19px;height:19px;border-radius:50%;background:var(--line-2);color:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;flex:0 0 19px;}
.step.on{background:var(--accent-soft); color:var(--accent); font-weight:600; border-color:var(--accent);}
.step.on .sn{background:var(--accent); color:var(--surface);}
.step.done .sn{background:var(--ok); color:var(--surface);}
@media (max-width:520px){.step span.sl{display:none}.step{padding:6px 10px}}

.areapick{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px;}
.areapick > *{min-width:0}
.acard{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 13px; cursor:pointer; display:flex; flex-direction:column; gap:3px;}
.acard:hover{border-color:var(--accent)}
.acard b{font-family:var(--display); font-size:14px; font-weight:600;}
.acard .ac-code{font-family:var(--mono); font-size:10.5px; color:var(--ink-3);}
.acard .ac-meta{font-size:11.5px; color:var(--ink-2); margin-top:4px;}

details.adv{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface-2);}
details.adv > summary{padding:8px 12px; cursor:pointer; font-size:12.5px; font-family:var(--display); font-weight:500; list-style:none; display:flex; align-items:center; gap:7px;}
details.adv > summary::-webkit-details-marker{display:none}
details.adv > summary::before{content:"+"; font-family:var(--mono); color:var(--ink-3);}
details.adv[open] > summary::before{content:"−"}
details.adv .adv-b{padding:0 12px 12px; display:flex; flex-direction:column; gap:10px;}

/* ---------- dashboard ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px;}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; display:flex; flex-direction:column; gap:3px;}
.tile .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);}
.tile .v{font-family:var(--display); font-weight:700; font-size:30px; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
.tile .f{font-size:12px; color:var(--ink-3);}
.tile.alarm{border-color:var(--crit); }
.tile.alarm .v{color:var(--crit);}

.bar{height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; display:flex;}
.bar i{display:block; height:100%;}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)} .bar i.unk{background:var(--unk)}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); font-family:var(--mono);}
.legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:baseline;}

/* ---------- audit ---------- */
.audit-grid{display:grid; grid-template-columns:minmax(0,4fr) minmax(0,5fr); gap:16px; align-items:start;}
.audit-grid > *{min-width:0}
@media (max-width:900px){.audit-grid{grid-template-columns:minmax(0,1fr)}}

.scanbox{border:2px dashed var(--line-2); border-radius:var(--radius); padding:13px; background:var(--surface-2); transition:border-color .15s, background .15s;}
.scanbox.armed{border-color:var(--accent); border-style:solid; background:var(--accent-soft);}
.scanbox input{font-family:var(--mono); font-size:16px; letter-spacing:.06em; text-align:center; padding:9px; border-color:var(--line-2);}
.scanbox .hint{font-size:11.5px; color:var(--ink-2); text-align:center; margin-top:7px; font-family:var(--mono);}

.slider-row{display:flex; align-items:center; gap:10px;}
input[type=range]{flex:1; accent-color:var(--accent); min-width:80px;}

.reads{max-height:290px; overflow-y:auto; border:1px solid var(--line); border-radius:5px;}
.read{display:grid; grid-template-columns:9px 1fr auto auto; gap:9px; align-items:center; padding:5px 9px; border-bottom:1px solid var(--line); font-size:12px;}
.read:last-child{border-bottom:0}
.read .dot{width:7px;height:7px;border-radius:50%;}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.unk{background:var(--unk)} .dot.mute{background:var(--line-2)}
.read .id{font-family:var(--mono); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.read .nm{font-size:11px; color:var(--ink-3); display:block; font-family:var(--body);}
.read .rssi{font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.read .ct{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); background:var(--surface-3); padding:1px 5px; border-radius:99px;}
.read.filtered{opacity:.45}
.read.new{animation:sl .35s ease;}
@keyframes sl{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.read.new{animation:none}}

/* approval box */
.apbox{border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:var(--radius); padding:12px 13px; background:var(--surface-2);}
.apbox.ok{border-left-color:var(--ok)} .apbox.bad{border-left-color:var(--crit)}
.ap-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}

pre.code{background:var(--surface-3);border:1px solid var(--line);border-radius:5px;padding:11px 13px;
  font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow-x:auto;margin:0;white-space:pre;}

/* a figure you can open */
.tile.act,.led.act{cursor:pointer; text-align:left; font:inherit; color:inherit; position:relative;}
.tile.act:hover,.led.act:hover{border-color:var(--accent); background:var(--surface-2);}
.tile.act .drill,.led.act .drill{position:absolute; top:9px; right:11px; font-family:var(--mono);
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); opacity:0; transition:opacity .12s;}
.tile.act:hover .drill,.led.act:hover .drill,.tile.act:focus-visible .drill,.led.act:focus-visible .drill{opacity:1;}
@media (prefers-reduced-motion:reduce){.tile.act .drill,.led.act .drill{transition:none}}

/* an exclusive choice, not a switch */
.modrow .pick{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--line-2);position:relative;}
.modrow .pick.on{border-color:var(--accent)}
.modrow .pick.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}

/* identity */
.signedby{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);background:var(--surface-2);padding:9px 13px;max-width:320px;}
.signedby b{font-family:var(--display);font-size:15px;font-weight:600;}
tr.dim{opacity:.55}
.signedby.sm{padding:6px 10px;max-width:none}
.signedby.sm b{font-size:13.5px}
.signedby small{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);}
.userchip{display:flex; align-items:center; gap:9px;}
.userchip .uav{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--surface);
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.02em;flex:0 0 30px;}
.userchip .un b{display:block;font-family:var(--display);font-size:12.5px;font-weight:600;line-height:1.2;}
.userchip .un small{display:block;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);}
@media (max-width:760px){.userchip .un{display:none}}

.signin{max-width:620px;margin:0 auto;}
.whogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;}
.whogrid>*{min-width:0}
.whocard{display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;}
.whocard:hover{border-color:var(--accent);background:var(--accent-soft)}
.whocard .av{width:36px;height:36px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;flex:0 0 36px;}
.whocard .wn{flex:1;min-width:0}
.whocard .wn b{display:block;font-family:var(--display);font-size:14px;font-weight:600;}
.whocard .wn small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px;}
.pinbox{display:flex;flex-direction:column;gap:11px;border:1px solid var(--accent);border-radius:var(--radius);
  background:var(--accent-soft);padding:15px;}
.pinbox .who b{font-family:var(--display);font-size:16px;display:block}
.pinbox .who small{font-size:12px;color:var(--ink-2)}

/* module switches */
.modlist{display:flex; flex-direction:column; gap:8px;}
.modrow{display:flex; align-items:center; gap:12px; text-align:left; width:100%; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:11px 13px;}
.modrow:hover{border-color:var(--ink-3)}
.modrow.on{border-color:var(--accent); background:var(--accent-soft);}
.modrow .sw{flex:0 0 38px; height:21px; border-radius:99px; background:var(--line-2); position:relative; transition:background .15s;}
.modrow.on .sw{background:var(--accent)}
.modrow .sw i{position:absolute; top:3px; left:3px; width:15px; height:15px; border-radius:50%;
  background:var(--surface); transition:transform .15s;}
.modrow.on .sw i{transform:translateX(17px)}
.modrow .mt{flex:1; min-width:0}

/* reconciliation ledger */

.tallybar{border-radius:var(--radius); padding:10px 13px; font-size:12.5px; border:1px solid;}

.board{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; align-items:start;}

.col{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}

.tc-name{font-family:var(--display); font-weight:600; font-size:13px; line-height:1.25;}

.tc-who{font-size:11px; color:var(--ink-2);}

.worknow{border:1px solid var(--accent); border-left-width:3px; border-radius:var(--radius); background:var(--accent-soft); padding:12px 14px;}
.wn-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;}

.wn-meta{font-size:12px; color:var(--ink-2); margin-top:3px;}

.rep-grid{display:grid; grid-template-columns:minmax(0,280px) minmax(0,1fr); gap:16px; align-items:start;}
.rep-grid > *{min-width:0}
@media (max-width:860px){.rep-grid{grid-template-columns:minmax(0,1fr)}}
.replist{max-height:70vh; overflow-y:auto;}

.repitem .t{font-family:var(--display); font-weight:600; font-size:13.5px;}
.repitem .s{font-family:var(--mono); font-size:11px; color:var(--ink-3); display:block; margin-top:2px; overflow-wrap:anywhere;}
.repitem .t{overflow-wrap:anywhere}
.delta{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
.dcard{border:1px solid var(--line); border-left-width:3px; border-radius:var(--radius); padding:10px 12px; background:var(--surface);}
.dcard .dn{font-family:var(--display); font-weight:700; font-size:22px; line-height:1.1; font-variant-numeric:tabular-nums;}
.dcard .dk{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);}
.dcard .dd{font-size:11.5px; color:var(--ink-3); margin-top:2px;}
.dcard.g-ok{border-left-color:var(--ok)} .dcard.g-ok .dn{color:var(--ok)}
.dcard.g-crit{border-left-color:var(--crit)} .dcard.g-crit .dn{color:var(--crit)}
.dcard.g-warn{border-left-color:var(--warn)} .dcard.g-warn .dn{color:var(--warn)}
.dcard.g-unk{border-left-color:var(--unk)} .dcard.g-unk .dn{color:var(--unk)}
.trail{border-left:2px solid var(--line); margin-left:6px; padding-left:14px; display:flex; flex-direction:column; gap:11px;}
.tnode{position:relative;}
.tnode::before{content:""; position:absolute; left:-20px; top:5px; width:9px; height:9px; border-radius:50%; background:var(--line-2); border:2px solid var(--surface);}
.tnode.n-ok::before{background:var(--ok)} .tnode.n-warn::before{background:var(--warn)} .tnode.n-crit::before{background:var(--crit)}
.tnode .tt{font-size:12.5px; font-weight:600;}
.tnode .ts{font-family:var(--mono); font-size:11px; color:var(--ink-3);}

.bucket{border:1px solid var(--line); border-left-width:3px; border-radius:var(--radius); background:var(--surface); overflow:hidden;}
.bucket.b-ok{border-left-color:var(--ok)} .bucket.b-warn{border-left-color:var(--warn)}
.bucket.b-crit{border-left-color:var(--crit)} .bucket.b-unk{border-left-color:var(--unk)}
.bucket > summary{padding:9px 13px; cursor:pointer; display:flex; align-items:center; gap:10px; list-style:none; font-family:var(--display); font-weight:600; font-size:13.5px;}
.bucket > summary::-webkit-details-marker{display:none}
.bucket > summary .c{font-family:var(--mono); font-weight:600; font-size:15px; min-width:26px; font-variant-numeric:tabular-nums;}
.bucket > summary .d{font-size:11.5px; color:var(--ink-3); font-family:var(--body); font-weight:400; margin-left:auto; text-align:right;}
.bucket.b-ok > summary{background:var(--ok-soft)} .bucket.b-warn > summary{background:var(--warn-soft)}
.bucket.b-crit > summary{background:var(--crit-soft)} .bucket.b-unk > summary{background:var(--unk-soft)}
.bucket.b-ok > summary .c{color:var(--ok)} .bucket.b-warn > summary .c{color:var(--warn)}
.bucket.b-crit > summary .c{color:var(--crit)} .bucket.b-unk > summary .c{color:var(--unk)}
.blist{max-height:210px; overflow-y:auto;}
.brow{display:flex; gap:10px; align-items:center; padding:6px 13px; border-bottom:1px solid var(--line); font-size:12.5px;}
.brow:last-child{border-bottom:0}
.brow .g{flex:1; min-width:0}
.brow .g b{font-weight:600; font-size:12.5px;}
.brow .g small{display:block; color:var(--ink-3); font-size:11px;}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(8,14,15,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:60;}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); max-width:620px; width:100%; max-height:85vh; overflow:auto;}
.modal>.panel-h{position:sticky; top:0; z-index:2; background:var(--surface); border-bottom:1px solid var(--line);}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--ground); padding:9px 16px; border-radius:99px; font-size:13px; z-index:70; box-shadow:var(--shadow);}
.note{background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:5px; padding:10px 13px; font-size:12.5px; color:var(--ink-2);}
.note b{color:var(--ink)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.stack{display:flex; flex-direction:column; gap:12px;}
.row-between{display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:space-between;}
.muted{color:var(--ink-3); font-size:12.5px;}

/* ==========================================================================
   INSTRUMENT
   This console is equipment software. It is read at arm's length, in bad
   light, by somebody holding a reader in the other hand. So: flat surfaces,
   hairline rules instead of card borders, figures in monospace so columns
   line up, and one signal colour — amber — which means only ever "a person
   has to do something about this". Nothing else may use it.
   ========================================================================== */
.topbar{ background:var(--chrome); border-bottom:1px solid var(--chrome-rule); }
.topbar-in{ padding:9px 16px; }
.mark b{ color:var(--chrome-ink); }
.mark span{ color:var(--chrome-ink-2); }
.mark .glyph{ color:var(--signal); }
.readout{ background:transparent; border:1px solid var(--chrome-rule); border-radius:0; }
.readout div{ border-right:1px solid var(--chrome-rule); }
.readout dt{ color:var(--chrome-ink-2); }
.readout dd{ color:var(--chrome-ink); }
.readout dd.warn{ color:var(--signal); }
.userchip .un b{ color:var(--chrome-ink); }
.userchip .un small{ color:var(--chrome-ink-2); }
.userchip .uav{ background:var(--chrome-2); color:var(--chrome-ink); border:1px solid var(--chrome-rule); }
.topbar .btn{ background:transparent; border-color:var(--chrome-rule); color:var(--chrome-ink); }
.topbar .btn:hover{ background:var(--chrome-2); }

nav.tabs{ background:var(--chrome-2); border-bottom:1px solid var(--line-2); }
.tab{ color:var(--chrome-ink-2); border-bottom-width:3px; padding:9px 14px; }
.tab:hover{ color:var(--chrome-ink); background:transparent; }
.tab[aria-selected="true"]{ color:var(--chrome-ink); border-bottom-color:var(--signal); }
.tab .n{ background:var(--chrome-rule); color:var(--chrome-ink); border-radius:2px; }
.tab .n.hot{ background:var(--signal); color:#17110A; }

.panel{ border-radius:0; box-shadow:none; }
.panel-h{ background:var(--surface-2); border-bottom:1px solid var(--line-2); padding:9px 14px; }
.panel-h h2{ font-family:var(--mono); font-size:11px; font-weight:500;
             letter-spacing:.13em; text-transform:uppercase; color:var(--ink-2); }
.panel-h .sub{ font-size:12px; }

.tiles{ gap:0; border:1px solid var(--line); background:var(--surface); }
.tile{ border:0; border-right:1px solid var(--line); border-radius:0; padding:12px 15px; }
.tile:last-child{ border-right:0; }
.tile .v{ font-family:var(--mono); font-weight:500; font-size:25px; letter-spacing:-.01em; }
.tile .f{ font-size:11.5px; }
.tile.alarm{ border-color:var(--line); box-shadow:inset 3px 0 0 var(--signal); }
.tile.alarm .v{ color:var(--signal); }
.tile.act .drill{ border-radius:0; }

.actions{ gap:0; border:1px solid var(--line); background:var(--surface); }
.panel-b > .actions{ border:0; }
.action{ border:0; border-right:1px solid var(--line); border-radius:0;
         padding:13px 15px 12px; gap:5px; transition:background .12s; }
.action:last-child{ border-right:0; }
.action:hover{ background:var(--surface-2); transform:none; border-color:var(--line); }
.action .ah{ display:flex; align-items:center; gap:9px; }
.action svg{ width:17px; height:17px; color:var(--ink-3); margin:0; flex:0 0 auto; }
.action:hover svg{ color:var(--accent); }
.action b{ font-size:14.5px; }
.action p{ font-size:12px; }
.action .ahint{ padding-top:7px; }

table{ font-size:12.5px; }
td{ padding:6px 10px; }
th{ padding:6px 10px; background:var(--surface-2); border-bottom:1px solid var(--line-2); }
td, th, .tile .v, .readout dd, .epc{ font-variant-numeric:tabular-nums; }
table.grid tr.rowlate td:first-child{ box-shadow:inset 3px 0 0 var(--signal); }

.chip, .chip.ok, .chip.warn, .chip.crit, .chip.unk, .chip.mute, .chip.acc{
  background:transparent; border-radius:0; padding:2px 0; font-weight:500; gap:6px; }
.chip::before{ content:""; width:7px; height:7px; flex:0 0 7px; background:currentColor; }
.chip.mute{ color:var(--ink-3); }
.chip.mute::before{ background:var(--line-2); }
.chip.acc{ color:var(--accent); }
.chip.warn{ color:var(--signal); }

.btn{ border-radius:2px; }
.btn.pri{ background:var(--accent); border-color:var(--accent); }
input[type=text],input[type=email],input[type=date],input[type=number],select,textarea{ border-radius:2px; }
.toolbar .search, .toolbar select, .toolbar .dfld input{ border-radius:2px; }

.bucket.b-eye > summary .c{ background:var(--warn-soft); color:var(--warn); }
.tcard{ border-radius:2px; }
.tcard.od{ box-shadow:inset 3px 0 0 var(--signal); }
.whocard{ border-radius:2px; }
.acard{ border-radius:2px; }
.scanbox{ border-radius:2px; }
.scanbox.armed{ box-shadow:inset 0 0 0 2px var(--accent); }
.modal{ border-radius:2px; }
.scrim.wide .modal{ max-width:min(1060px,95vw); }
.dcard{ border-radius:2px; }

.reads{ font-variant-numeric:tabular-nums; }
.read .id{ font-family:var(--mono); }
.read.new{ background:var(--signal-soft); }

/* ---- proportion: the part that separates designed from generated -------- */
.grid-form{ display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
/* These widths are for fields laid out in a ROW. Left unscoped they also
   applied inside .stack, which is a flex COLUMN — so every field grew
   vertically to fill the dialog and left a 250px hole under each one. */
.grid-form > label.fld{ flex:1 1 180px; }
.grid-form > label.fld.w-xs{ flex:0 1 112px; }
.grid-form > label.fld.w-sm{ flex:0 1 150px; }
.grid-form > label.fld.w-md{ flex:1 1 190px; }
.grid-form > label.fld.w-lg{ flex:1.6 1 240px; }
.stack > label.fld{ flex:0 0 auto; }
.grid-form > .btn{ flex:0 0 auto; margin-left:auto; }

td.num, th.num{ text-align:right; width:1%; white-space:nowrap; }
td.num{ font-family:var(--mono); }
td.num .chip{ justify-content:flex-end; }

details.addf{ border-bottom:1px solid var(--line); background:var(--surface-2); }
details.addf > summary{ list-style:none; cursor:pointer; padding:8px 14px;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-2); display:flex; align-items:center; gap:8px; }
details.addf > summary::-webkit-details-marker{ display:none; }
details.addf > summary::before{ content:"+"; font-size:15px; line-height:1; color:var(--accent); }
details.addf[open] > summary::before{ content:"\2212"; }
details.addf > summary:hover{ color:var(--ink); }
details.addf .panel-b{ border-top:1px solid var(--line); background:var(--surface); }

/* A scrollable table inside a flex column is shrinkable, so flex squashes it
   and silently clips rows — the table reports its full height while showing
   three of eleven. Tables keep their own height; the column scrolls instead. */
.stack > .tw{ flex:0 0 auto; }
td.epc, th.num, td.num{ white-space:nowrap; }
.tw > table{ min-width:min(100%, 880px); }

/* ---- tagging: three ways to tag, and one supply ledger ------------------ */
.modebar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.modegrp{ display:flex; gap:0; border:1px solid var(--line-2); border-radius:2px; overflow:hidden; }
.modegrp .btn{ border:0; border-right:1px solid var(--line-2); border-radius:0; }
.modegrp .btn:last-child{ border-right:0; }
.modecount{ margin-left:auto; font-size:12.5px; }
.modesupply{ display:flex; padding-left:14px; border-left:1px solid var(--line-2); }
.modesupply .btn{ background:transparent; border-color:var(--line); color:var(--ink-2); }
.modesupply .btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; }
@media (max-width:640px){ .modecount{ margin-left:0; order:3; } .modesupply{ border-left:0; padding-left:0; } }

/* ---- the audit scope picker -------------------------------------------- */



/* A job with history, evidence and a trail does not fit a 620px window. */
.modal{ position:relative; }
.maxbtn{ position:absolute; top:9px; right:76px; z-index:3; background:none; border:1px solid var(--line);
  border-radius:2px; width:28px; height:26px; line-height:1; cursor:pointer; color:var(--ink-2);
  font-size:14px; display:grid; place-items:center; }
.maxbtn:hover{ background:var(--surface-2); color:var(--ink); }
.scrim.full{ padding:0; }
.scrim.full .modal{ max-width:none; width:100vw; height:100dvh; max-height:none; border-radius:0; border:0; }
.scrim.full .modal > .panel-b, .scrim.full .modal .panel-b{ max-height:none; }
@media (max-width:560px){ .maxbtn{ display:none; } }

.linkish{ background:none; border:0; padding:0; white-space:nowrap; font-family:var(--mono); font-size:12px;
  color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
.linkish:hover{ color:var(--accent-2); }

/* ---- audit list ---- */
.rbar{ display:flex; height:6px; background:var(--surface-3); border-radius:1px; overflow:hidden; margin-bottom:4px; }
.rbar i{ display:block; height:100%; }
.rbar i.ok{ background:var(--accent); }

/* The reference app's 14px cell padding suits its four-column tables. The job
   and register grids carry eleven columns, and at that width the roomy
   padding pushes every other cell onto a second line. Dense grids keep the
   theme's type and colour but take their own spacing, and scroll sideways
   rather than wrapping into a stack. */
table.grid th, table.grid td{ padding:7px 10px; }
table.grid{ font-size:12.6px; }
.tw > table.grid{ min-width:1120px; }
table.grid td.epc, table.grid td .epc{ font-size:11.6px; }
.rbar i.sk{ background:var(--line-2); }
details.addf.addf-lg{ border:1px solid var(--line); background:var(--surface-2); }

details.addf.addf-lg[open]{ background:transparent; border-color:transparent; }
details.addf.addf-lg[open] > summary{ background:var(--surface-2); border:1px solid var(--line); }
details.addf.addf-lg .panel{ border-top:0; }

.pickgrid[hidden]{ display:none; }   /* display:grid outranks the browser's [hidden] rule */
.pickgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:0;
  border:1px solid var(--line); background:var(--surface); max-height:320px; overflow:auto; }
.pickbox{ display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:center;
  padding:10px 13px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); cursor:pointer; }
.pickbox:hover{ background:var(--surface-2); }
.pickbox input{ grid-row:1/4; width:15px; height:15px; }
.pickbox .pb-n{ font-family:var(--display); font-weight:600; font-size:13.5px; }
.pickbox .pb-c{ font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
.pickbox .pb-m{ font-size:11.5px; color:var(--ink-3); }
.pickbox:has(input:checked){ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
.pick-row{ display:flex; gap:0; border:1px solid var(--line-2); border-radius:2px;
  overflow:hidden; width:max-content; }
.pick-row .btn{ border:0; border-right:1px solid var(--line-2); border-radius:0; background:transparent; }
.pick-row .btn:last-child{ border-right:0; }
.pick-row .btn.on{ background:var(--accent); color:#fff; }


/* ---- components retuned to match the reference app ---------------------- */
body{ font-size:13.5px; }

/* the bar is white here; the instrument fascia goes away */
.topbar{ background:var(--chrome); border-bottom:1px solid var(--chrome-rule); }
.topbar-in{ padding:10px 16px; min-height:56px; }
.mark b{ color:var(--ink); font-family:var(--display); }
.mark span{ color:var(--ink-3); }
.mark .glyph{ color:var(--brand-o); }
.readout{ background:var(--surface-2); border:1px solid var(--line); border-radius:4px; }
.readout div{ border-right:1px solid var(--line); }
.readout dt{ color:var(--ink-3); }
.readout dd{ color:var(--ink); }
.readout dd.warn{ color:var(--signal); }
.userchip .un b{ color:var(--ink); }
.userchip .un small{ color:var(--ink-3); }
.userchip .uav{ background:var(--accent-soft); color:var(--accent); border:1px solid var(--line); }
.topbar .btn{ background:var(--surface); border-color:var(--line-2); color:var(--ink); }
.topbar .btn:hover{ background:var(--surface-2); border-color:var(--accent); color:var(--accent); }

nav.tabs{ background:var(--chrome-2); border-bottom:1px solid var(--line); }
.tab{ color:var(--ink-2); border-bottom-width:2px; padding:10px 14px; font-family:var(--body); font-weight:500; }
.tab:hover{ color:var(--accent); background:var(--hover,var(--surface-2)); }
.tab[aria-selected="true"]{ color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

   PRINT
   A statutory fixed-asset audit is signed on paper. The screen is a working
   tool; this is the document that leaves the building, so it is laid out for
   A4, carries its own letterhead and footer on every page, and ends in ruled
   signature lines. Printing writes into #printroot and nothing else is on
   the page, which keeps the console's scroll boxes and sticky chrome out of
   the output.
   ========================================================================== */
#printroot{ display:none; }
body.printing{ overflow:visible; }

@media print{
  @page{ size:A4 portrait; margin:14mm 12mm 16mm; }

  /* Only the document prints. */
  body.printing > *{ display:none !important; }
  body.printing > #printroot{ display:block !important; }

  html, body{ background:#fff !important; color:#000 !important;
              height:auto !important; overflow:visible !important; }
  body{ font:11pt/1.45 var(--body,sans-serif); }

  /* Paper has no hover, no dark mode and no accent fills. */
  *{ box-shadow:none !important; text-shadow:none !important;
     -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #printroot .btn, #printroot button, #printroot .pager,
  #printroot .toolbar, #printroot [data-close], #printroot .drill,
  #printroot details > summary::before{ display:none !important; }
  #printroot details{ display:block; }
  #printroot details > *{ display:revert; }

  #printroot .tw{ overflow:visible !important; max-height:none !important; }
  #printroot table{ width:100%; border-collapse:collapse; font-size:9.6pt; }
  #printroot th, #printroot td{ border:.4pt solid #999; padding:3.2pt 5pt;
                                text-align:left; vertical-align:top;
                                background:#fff !important; color:#000 !important; }
  #printroot thead th{ background:#ececec !important; font-weight:700;
                       text-transform:none; letter-spacing:0; font-size:9.2pt; }
  #printroot td.num, #printroot th.num{ text-align:right; white-space:nowrap; }
  #printroot thead{ display:table-header-group; }   /* repeat headers across pages */
  #printroot tr, #printroot img{ break-inside:avoid; }

  /* Findings must stay legible in black and white, so each carries a word. */
  #printroot .chip{ background:none !important; border:.4pt solid #000 !important;
                    color:#000 !important; border-radius:0; padding:0 3pt;
                    font-size:8.6pt; font-weight:600; }
  #printroot .chip::before{ display:none !important; }

  #printroot .ph{ display:flex; justify-content:space-between; align-items:flex-end;
                  border-bottom:1.4pt solid #000; padding-bottom:5pt; margin-bottom:11pt; }
  #printroot .ph .org{ font-size:14pt; font-weight:700; letter-spacing:-.01em; }

  #printroot .eyebrow{ display:block; font-size:9pt; font-weight:700;
                       text-transform:uppercase; letter-spacing:.08em;
                       margin:13pt 0 4pt; color:#000 !important;
                       break-after:avoid; }
  #printroot .psec{ break-inside:auto; }
  #printroot .empty, #printroot .muted{ color:#333 !important; background:none !important;
                                        border:0 !important; padding:0; font-size:9.6pt; }

  /* Signatures: three names, ruled, on one page with their heading. */
  #printroot .psign{ break-inside:avoid; margin-top:18pt; }
  #printroot .psign .row{ display:flex; gap:14pt; margin-top:16pt; }
  #printroot .psign .sig{ flex:1; }

  #printroot .apbox{ border:.6pt solid #000; padding:7pt; background:#fff !important; }

     weight in red loses it. Emphasis has to survive as type, not colour. */

/* Roughly how much of this browser's store the register occupies. The limit
   is about 5 MB in every browser that matters here. */
function storageUse(){
  var bytes=0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(String(k).indexOf("tagtrail_")!==0) continue;

/* ============ CHANGE LOG ============
   A fixed asset register gets audited. The auditor's first question is never
   "what does it say now" but "who changed it, when, and what did it say
   before". None of this is a feature the plant asked for — it exists so that
   a cost, a class, a tag mapping or a write-off can still be defended a year
   later, when the person who made the change has moved on.

   Logged: the fields that change what the register reports, or what the
   company depreciates. Not logged: scans, reads, photos, device settings —
   high volume, no audit interest, and they would bury the entries that
   matter. A PIN change is recorded as having happened; the value never is.

   It hangs off save() and remove() because those are the only two ways a
   record is ever written. Nothing else needs to remember to log. */
var LOGGED={
  assets:   ["code","name","category","home","classId","cost","inUseDate","epc","status","dueBack","mobile","life","method","residualPct","custodian"],
  classes:  ["code","name","life","method","residualPct","itRate","deptTeamId"],
  /* These are the field names the records actually carry. Three of them were
     wrong, and a wrong name here is worse than a missing one: logDiff finds
     undefined on both sides, decides nothing changed, and the change is made
     with no trace. Employee code, team, area, owner email and the door tag
     were all editable-and-untracked. */
  people:   ["name","empCode","role","teamId","pin","active"],
  locations:["code","name","area","team","owner","email","anchor"],
  rounds:   ["title","status","reason","scope","closedAt","signedBy","signedAt"],
  audits:   ["status"],
  teams:    ["code","name","lead","email"]
};
var LOG_CAP=2000;
/* Two traps this avoids.
   1. Much of the app edits a record in place and saves the same object, so
      comparing against S[col][id] would compare an object with itself and
      see no change. SHADOW holds a clone of each record as last written, so
      the diff is against what was really stored.
   2. Boot seeds, migrates and back-fills through save(). Logging during that
      would bury every real edit under hundreds of machine writes, so the log
      stays off until the app has finished starting. */
var SHADOW={}, LOG_OFF=true;
function shadowPut(col,obj){ if(!SHADOW[col]) SHADOW[col]={}; SHADOW[col][obj.id]=clone(obj); }
function shadowSync(){
  SHADOW={};
  Object.keys(LOGGED).forEach(function(c){ list(c).forEach(function(o){ shadowPut(c,o); }); });
}
function logLabel(col,o){
  if(!o) return "";
  if(col==="assets"||col==="classes"||col==="locations") return String(o.code||"")+(o.name?" — "+o.name:"");
  if(col==="rounds") return o.title||o.reason||o.id;
  return o.name||o.code||o.id;
}
function logDiff(col,prev,next){
  var fields=LOGGED[col]; if(!fields) return null;
  var ch=[];
  fields.forEach(function(f){
    var a=prev?prev[f]:undefined, b=next?next[f]:undefined;
    if(f==="scope"){ a=a?JSON.stringify(a):""; b=b?JSON.stringify(b):""; }
    var as=(a==null||a===false)?"":String(a), bs=(b==null||b===false)?"":String(b);
    if(as===bs) return;
    if(f==="pin"){ ch.push({f:f,from:as?"set":"none",to:bs?"set":"none"}); return; }
    ch.push({f:f,from:as,to:bs});
  });
  return ch.length?ch:null;
}
function logWrite(col,recId,label,action,changes){
  if(!S.log) S.log={};
  var m=null; try{ m=me(); }catch(e){}
  var e2={id:uid("G"), at:nowISO(), by:m?m.id:"", byName:m?m.name:"system",
          byRole:m?m.role:"", col:col, recId:recId, label:label,
          action:action, changes:changes||[]};
  S.log[e2.id]=e2;
  var keys=Object.keys(S.log);
  if(keys.length>LOG_CAP){
    keys.map(function(k){return S.log[k];})
        .sort(function(a,b){return String(a.at).localeCompare(String(b.at));})
        .slice(0,keys.length-LOG_CAP)
        .forEach(function(x){ delete S.log[x.id]; });
  }
  if(!DB){ if(LS) lsSave("log"); return; }
  var body=clone(e2);
  CHAIN=CHAIN.then(function(){ return DB.collection("log").doc(e2.id).set(body); }).catch(function(){});
}

function save(col,obj){
  /* A collection added in a later version will not exist in a store written
     by an earlier one. Without this, the first write to it throws. */
  if(!S[col]) S[col]={};
  if(col==="assets") epcIndexDrop();
  if(!LOG_OFF && LOGGED[col] && obj && obj.id){
    var prev=SHADOW[col]?SHADOW[col][obj.id]:undefined;
    if(prev===undefined){ logWrite(col,obj.id,logLabel(col,obj),"created",logDiff(col,null,obj)||[]); }
    else { var ch=logDiff(col,prev,obj); if(ch) logWrite(col,obj.id,logLabel(col,obj),"changed",ch); }
    shadowPut(col,obj);
  }
  S[col][obj.id]=obj;
  if(!DB){ if(LS) lsSave(col); return Promise.resolve(true); }
  var body=clone(obj);
  /* A caller that must know whether the write landed - committing a sweep,
     above all - cannot ask CHAIN: the queue catches its own failures so that
     one bad write does not stop the next, which makes every write look like a
     success from outside. This settles true or false for this one write, and
     changes nothing about how the queue behaves. */
  var settle, outcome = new Promise(function(r){ settle=r; });
  CHAIN=CHAIN.then(function(){ return DB.collection(col).doc(obj.id).set(body); })
             .then(function(){ settle(true); if(DB&&DB.isServer) serverWriteOk(); })
             .catch(function(e){
               settle(false);
               /* Against the server a refusal is usually the register doing its
                  job — a stale write, a constraint, a permission — and it says
                  why. Swallowing it would leave the screen showing a change
                  that was never saved, which on a statutory register is the
                  worst outcome available. */
               if(DB && DB.isServer){ serverWriteFailed(e, col, obj.id); return; }
               var code=e&&e.code;
               if(code==="invalid_argument"||code==="revoked"||code==="not_granted"){ READONLY=true; paintReadout(); }
               if(!SAVEWARNED){ SAVEWARNED=true;
                 toast("Could not write to the shared store — changes stay in this browser only"); }
             });
  return outcome;
}
function remove(col,id){
  if(col==="assets") epcIndexDrop();
  if(!LOG_OFF && LOGGED[col]){ var p=S[col]?S[col][id]:null; if(p) logWrite(col,id,logLabel(col,p),"removed",[]); }
  if(SHADOW[col]) delete SHADOW[col][id];
  delete S[col][id];
  if(!DB){ if(LS) lsSave(col); return; }
  CHAIN=CHAIN.then(function(){ return DB.collection(col).doc(id).delete(); })
             .catch(function(e){
               /* A delete the register refuses — an area still holding assets,
                  a class still in use — has already been removed from the
                  screen's copy, so the two now disagree. Say so and reload. */
               if(DB && DB.isServer){
                 serverWriteFailed(e);
                 setTimeout(function(){ location.reload(); }, 1500);
               }
             });
  return CHAIN;
}
function saveMany(col,list){ list.forEach(function(o){ save(col,o); }); }

function list(col){ var o=S[col]; if(!o){ o=S[col]={}; } return Object.keys(o).map(function(k){return o[k];}); }

/* This was a linear scan that also allocated a fresh array of every asset,
   and it is called from classify() for every tag read, then again for every
   read while painting. At twenty thousand assets one trigger pull blocked the
   tab for about five seconds. An index keyed on EPC turns it into a lookup.
   It is rebuilt whenever the asset collection changes, which save()/remove()
   signal, so it cannot drift from the register. */
var EPCIX=null;
function epcIndex(){
  if(EPCIX) return EPCIX;
  EPCIX={};
  var o=S.assets||{}, k;
  for(k in o){ if(Object.prototype.hasOwnProperty.call(o,k)){
    var a=o[k]; if(a && a.epc) EPCIX[String(a.epc).toUpperCase()]=a;
  } }
  return EPCIX;
}
/* buckets() and expectedCount() both walked the whole register on every
   single read, because paintAudit() runs per read. At twenty thousand assets
   that is forty thousand iterations per trigger pull. Only the assets homed
   in the area being swept can matter, so they are indexed by home too. */
var HOMEIX=null;
function homeIndex(){
  if(HOMEIX) return HOMEIX;
  HOMEIX={};
  var o=S.assets||{}, k;
  for(k in o){ if(Object.prototype.hasOwnProperty.call(o,k)){
    var a=o[k]; if(!a) continue;
    var h=a.home||"";
    (HOMEIX[h]||(HOMEIX[h]=[])).push(a);
  } }
  return HOMEIX;
}
function assetsHomedIn(locId){ return homeIndex()[locId||""]||[]; }
function epcIndexDrop(){ EPCIX=null; HOMEIX=null; }
function assetByEpc(epc){
  if(!epc) return null;
  var hit=epcIndex()[String(epc).toUpperCase()];
  /* A stale entry can only mean the index missed a write; fall back rather
     than hand back the wrong asset. */
  if(hit && hit.epc && String(hit.epc).toUpperCase()===String(epc).toUpperCase()) return hit;
  if(hit){ epcIndexDrop(); hit=epcIndex()[String(epc).toUpperCase()]; if(hit) return hit; }
  return null;
}

function signIn(id,pin){

     theatre: anyone can open the page and edit the check out of it.

     The call is fired without waiting so the existing callers — all of which
     expect a plain true or false — keep working. A refusal signs the person
     straight back out and says why, rather than leaving them on a screen
