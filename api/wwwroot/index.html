function addRead(epc,rssi){
  epc=String(epc).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(epc.length<4) return false;
  var anchorL=null;
  list("locations").forEach(function(l){ if(l.anchor&&l.anchor.toUpperCase()===epc) anchorL=l; });
  if(anchorL){
    if(!AUD.active){
      if(!can("audit")){ toast("Your role cannot run an audit"); return true; }
      startAudit(anchorL.id, meName()); toast("Anchored to "+anchorL.name); return true; }
    if(anchorL.id!==AUD.locationId){ toast("That is the anchor for "+anchorL.name+" — discard this session to move."); return true; }
    return true;
  }
  if(!AUD.active) return false;
  if(rssi==null) rssi=-Math.round(42+Math.random()*24);
  var r=AUD.reads[epc];
  if(r){ r.count++; r.lastAt=Date.now(); if(rssi>r.rssi) r.rssi=rssi; }
  else AUD.reads[epc]={count:1,rssi:rssi,firstAt:Date.now(),lastAt:Date.now()};
  AUD.lastNew=epc;
  scheduleSweepSave();   /* every read survives the next thing that goes wrong */
  return true;
}
function startAudit(locId,op){
  var st=stamp();
  AUD.active=true; AUD.locationId=locId;
  var _r=selectedRound(); AUD.roundId=_r?_r.id:""; AUD.roundRef=_r?_r.ref:"";
  AUD.operator=st.byName||op||""; AUD.operatorId=st.by; AUD.operatorCode=st.byCode;
  AUD.startedAt=nowISO(); AUD.reads={}; AUD.photos={}; AUD.cond={}; AUD.areaPhoto=""; AUD.wedge=true; AUD.shell=false; AUD.peek=false;
  AUD.handover=[]; AUD.found={};
  sweepSave();
  hostEvent("audit_started",{area:locName(locId),areaCode:locCode(locId),
    expected:expectedCount(),by:AUD.operator,byId:AUD.operatorId,profile:readerProfile()});
  renderTabs(); renderAudit(); setTimeout(function(){ var el=$("#scanIn"); if(el) el.focus(); },30);
}

function wireAudit(){
  /* An area tag at the door starts the sweep without anyone picking from a
     list — keep it working on the worklist screen. */
  var anchor=$("#anchorIn");
  if(anchor) anchor.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ e.preventDefault(); startByAnchor(this.value); this.value=""; } });
  var si=$("#scanIn");
  if(!si) return;   /* not scanning: nothing else on this screen to wire */
  si.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ e.preventDefault(); if(addRead(this.value,null)) schedulePaint(); this.value=""; }
  });
  si.addEventListener("blur",function(){ setTimeout(function(){ if(AUD.active&&AUD.wedge&&VIEW==="audit"&&!$("#overlay").innerHTML&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"&&document.activeElement.tagName!=="SELECT"){ si.focus(); } },80); });
  /* Optional controls disappear with their module, so bind defensively. */
  var on=function(id,ev,fn){ var el=$("#"+id); if(el) el.addEventListener(ev,fn); };
  on("abortBtn","click",function(){ if(confirm("Discard this scan session? Reads are not saved.")){
    hostEvent("audit_cancelled",{area:locName(AUD.locationId),areaCode:locCode(AUD.locationId)});
    sweepClear();
    AUD.active=false; AUD.reads={}; AUD.photos={}; AUD.cond={}; AUD.shell=false; renderTabs(); renderAudit(); } });
  on("clearReads","click",function(){ AUD.reads={}; paintAudit(); });
  on("floor","input",function(){ var c=clone(cfg()); c.id="config"; c.floor=parseInt(this.value,10); save("meta",c);
    hostEvent("settings",readerProfile()); paintAudit(); paintReadout(); });
  on("simNormal","click",function(){ simulate(false); });
  on("areaSnap","click",function(){
    pickPhoto(function(d){
      AUD.areaPhoto=savePhoto(d,"area",locName(AUD.locationId)+" \u2014 during audit",AUD.operator);
      paintAudit(); toast("Area photo attached to this audit");
    });
  });
  on("simStray","click",function(){ simulate(true); });
  on("pasteBtn","click",pasteBatch);
  on("csvReads","change",function(e){ readCsvFile(e.target.files[0],function(txt){ ingestReadsText(txt); }); this.value=""; });
  on("commitBtn","click",commitAudit);
  setTimeout(function(){ si.focus(); },30);
}

function simulate(stray){
  var here=list("assets").filter(function(a){return a.home===AUD.locationId && a.epc;});
  var others=list("assets").filter(function(a){return a.home!==AUD.locationId && a.epc;});
  var drop = here.length>3 ? Math.max(1,Math.round(here.length*0.15)) : 0;
  var shuffled=here.slice().sort(function(){return Math.random()-0.5;});
  shuffled.slice(drop).forEach(function(a){ addRead(a.epc, -Math.round(40+Math.random()*22)); });
  var mis=others.slice().sort(function(){return Math.random()-0.5;}).slice(0, 1+Math.round(Math.random()));
  mis.forEach(function(a){ addRead(a.epc, -Math.round(48+Math.random()*16)); });
  addRead(hexEpc(4000+Math.floor(Math.random()*900)), -Math.round(46+Math.random()*14));
  if(stray){
    others.slice().sort(function(){return Math.random()-0.5;}).slice(0,3).forEach(function(a){
      addRead(a.epc, -Math.round(72+Math.random()*10)); });
    toast("Three weak reads added — raise the RSSI floor to drop them");
  }
  paintAudit(); paintReadout();
}
function pasteBatch(){
  modal('<div class="panel-h"><h2>Paste a batch of reads</h2></div><div class="panel-b stack">'+
    '<div class="muted">One EPC per line. An optional RSSI after a comma is used when present: <span class="mono">E2801170ABCD…,-58</span></div>'+
    '<textarea id="pasteTa" rows="10" placeholder="E28011700000000000000001&#10;E28011700000000000000002,-64"></textarea>'+
    '<div class="btn-row"><button class="btn pri" id="pasteOk">Add reads</button><button class="btn" data-close>Cancel</button></div></div>');
  $("#pasteOk").addEventListener("click",function(){ ingestReadsText($("#pasteTa").value); closeModal(); });

function ingestReadsText(txt){
  var n=0;
  String(txt||"").split(/\r?\n/).forEach(function(line){
    line=line.trim(); if(!line) return;
    var parts=line.split(/[,;\t]/);
    var epc=parts[0].trim(); if(/^(epc|tag|tagid|id)$/i.test(epc)) return;
    var rssi=parts.length>1?parseFloat(parts[1]):null;
    if(addRead(epc, isNaN(rssi)?null:rssi)) n++;
  });
  paintAudit(); paintReadout(); toast(n+" reads added");
}
function readCsvFile(file,cb){ if(!file) return; var fr=new FileReader(); fr.onload=function(){ cb(String(fr.result)); }; fr.readAsText(file); }

function commitAudit(){
  var b=buckets(), exp=expectedCount(), id=uid("AUD"), t=nowISO();
  if(!b.inplace.length&&!b.misplaced.length&&!b.unknown.length&&!b.missing.length){ toast("Nothing to commit"); return; }
  /* A reader whose battery died at minute two produces a sweep that reads
     almost nothing and then raises a locate job for the whole area, with a
     value-at-risk figure to match, permanently and unvoidably. If coverage
     is implausibly low, say so before it becomes a statutory record. */
  flushSweep();
  var _expN=expectedCount(), _gotN=b.inplace.length+b.eyeballed.length;
  var _readN=Object.keys(AUD.reads).length;
  /* The old threshold only looked at areas of five or more, so a three-asset
     room could be committed having read nothing at all \u2014 which is what a
     reader that never paired looks like. It books the whole room as missing,
     raises a job for each, and prints a rupee figure that is simply false.
     Zero reads is the loudest version of this and gets its own question. */
  if(_readN===0){
    if(!confirm("The reader did not read a single tag in "+locName(AUD.locationId)+".\n\n"+
       "That is almost always the reader, not the room \u2014 not paired, not triggered, or out of range. "+
       "Saving this will record "+b.missing.length+" asset"+(b.missing.length===1?"":"s")+
       " as not found and raise a job for each one.\n\n"+
       "Save it anyway as the verification of record?")) return;
  }
  else if(_expN>=3 && _gotN < Math.ceil(_expN*0.5)){
    if(!confirm("Only "+_gotN+" of "+_expN+" expected assets were found in "+locName(AUD.locationId)+".\n\n"+
       "That will record "+b.missing.length+" as not found and raise a job for each one. If the reader lost "+
       "power or connection part way, carry on scanning instead \u2014 the reads are saved on this device.\n\n"+
       "Save this sweep as the verification of record?")) return;
  }
  var rows=[];
  var ph=function(e){ return AUD.photos[e]||""; };
  var cd=function(e){ var c=AUD.cond&&AUD.cond[e]; return c?c.cond:""; };
  var cn=function(e){ var c=AUD.cond&&AUD.cond[e]; return c?c.note:""; };
  b.inplace.forEach(function(x){ rows.push({b:"inplace",assetId:x.asset.id,epc:x.epc,rssi:x.rssi,photo:ph(x.epc),nbv:nbvOf(x.asset)}); });
  b.misplaced.forEach(function(x){ rows.push({b:"misplaced",assetId:x.asset.id,epc:x.epc,rssi:x.rssi,home:x.asset.home,photo:ph(x.epc),cond:cd(x.epc),condNote:cn(x.epc),nbv:nbvOf(x.asset)}); });
  b.missing.forEach(function(x){ rows.push({b:"missing",assetId:x.asset.id,epc:x.epc,photo:ph(x.epc),cond:cd(x.epc),condNote:cn(x.epc),nbv:nbvOf(x.asset)}); });
  b.unknown.forEach(function(x){ rows.push({b:"unknown",epc:x.epc,rssi:x.rssi,photo:ph(x.epc),cond:cd(x.epc),condNote:cn(x.epc)}); });
  b.away.forEach(function(x){ rows.push({b:"away",assetId:x.asset.id,epc:x.epc,home:x.asset.home}); });
  b.retired.forEach(function(x){ rows.push({b:"retired",epc:x.epc,rssi:x.rssi,
    retagId:x.dead?x.dead.id:"", assetId:x.dead?x.dead.assetId:""}); });
  b.offsite.forEach(function(x){ rows.push({b:"offsite",assetId:x.asset.id,epc:x.epc,
    status:x.asset.status, dueBack:x.asset.dueBack||"", nbv:nbvOf(x.asset)}); });
  b.eyeballed.forEach(function(x){ rows.push({b:"eyeballed",assetId:x.asset.id,epc:x.epc,
    foundBy:(x.found||{}).by||"", foundNote:(x.found||{}).note||"", nbv:nbvOf(x.asset)}); });
  /* photos taken during the sweep also attach to the asset record */
  Object.keys(AUD.photos).forEach(function(e){
    var as=assetByEpc(e); if(!as) return;
    var n=clone(as); n.photoIds=(n.photoIds||[]).concat([AUD.photos[e]]).slice(-4); save("assets",n);
  });
  var audit={id:id,roundId:AUD.roundId||"",roundRef:AUD.roundRef||"",locationId:AUD.locationId,operator:AUD.operator,operatorId:AUD.operatorId||"",operatorCode:AUD.operatorCode||"",startedAt:AUD.startedAt,endedAt:t,
    counts:{inplace:b.inplace.length,misplaced:b.misplaced.length,missing:b.missing.length,unknown:b.unknown.length,away:b.away.length,retired:b.retired.length,eyeballed:b.eyeballed.length,offsite:b.offsite.length},
    expected:exp, floor:cfg().floor, areaPhoto:AUD.areaPhoto||"",
    /* Who walked the area, not just who pressed the button. */
    handover:(AUD.handover||[]).slice(),
    valueMissing:b.missing.reduce(function(n,x){return n+nbvOf(x.asset);},0),
    valueChecked:b.inplace.reduce(function(n,x){return n+nbvOf(x.asset);},0)+
                 b.eyeballed.reduce(function(n,x){return n+nbvOf(x.asset);},0),
    rows:rows};
  var _sweepWrite=save("audits",audit);

  b.inplace.concat(b.misplaced).forEach(function(x){
    var a=asset(x.asset.id); if(!a) return;
    var n=clone(a); n.lastSeenLoc=AUD.locationId; n.lastSeenAt=t; save("assets",n);
  });
  var verified=verifyTasks(audit,b);
  var made=0;
  b.misplaced.forEach(function(x){ if(newTask("return",x.asset.id,x.epc,x.asset.home,AUD.locationId,id,t,ph(x.epc),cd(x.epc),cn(x.epc))) made++; });
  b.missing.forEach(function(x){ if(newTask("locate",x.asset.id,x.asset.epc,AUD.locationId,"",id,t,ph(x.asset.epc),cd(x.asset.epc),cn(x.asset.epc))) made++; });
  /* Seen by eye: the asset is not lost, so what is raised is the tag work. */
  b.eyeballed.forEach(function(x){ if(newTask("retag",x.asset.id,x.asset.epc,AUD.locationId,"",id,t,ph(x.asset.epc),cd(x.asset.epc),cn(x.asset.epc))) made++; });
  b.unknown.forEach(function(x){ if(newTask("identify","",x.epc,"",AUD.locationId,id,t,ph(x.epc),cd(x.epc),cn(x.epc))) made++; });

  hostEvent("audit_finished",{auditId:id,area:locName(audit.locationId),areaCode:locCode(audit.locationId),
    counts:audit.counts,expected:exp,raised:made,closed:verified});
  var _r=AUD.roundId? round(AUD.roundId) : null;
  /* The on-device copy of this sweep stays until the server says it has it.
     It used to go immediately, while the write was still in flight: a commit
     that failed - no signal at that spot, the API restarting, the laptop
     asleep - left the operator with an error message and nothing to retry
     from. The count was simply gone, and a count is an hour of somebody
     walking a warehouse. */
  sweepHoldUntilSaved(_sweepWrite, audit);
  AUD.active=false; AUD.reads={}; AUD.photos={}; AUD.cond={}; AUD.areaPhoto=""; AUD.shell=false; AUD.peek=false;
  AUD.roundId=""; AUD.roundRef="";
  renderTabs();
  var raised=made+" task"+(made===1?"":"s")+" raised"+(verified?", "+verified+" closed by this audit":"");
  /* Inside an audit the next thing anyone wants is the next area, not a
     report on the one just finished. Outside one, the report is the end. */
  if(_r && _r.status==="open"){
    var p2=roundProgress(_r);
    toast(locName(audit.locationId)+" done \u00b7 "+p2.done+" of "+p2.total+" areas \u00b7 "+raised);
    go("audit");
  } else {
    toast("Audit saved \u2014 "+raised);
    REP.sel=id; REP.area="all";
    go("reports");
  }
}

var REP={sel:"",area:"all",round:"all",q:"",from:"",to:"",exOnly:false};

function auditsSorted(){ return list("audits").sort(function(a,b){return (b.endedAt||"").localeCompare(a.endedAt||"");}); }
function prevAudit(a){
  return list("audits").filter(function(x){ return x.locationId===a.locationId && (x.endedAt||"")<(a.endedAt||""); })
    .sort(function(p,q){return (q.endedAt||"").localeCompare(p.endedAt||"");})[0]||null;
}
function lastAuditAt(locId){
  return list("audits").filter(function(x){return x.locationId===locId;})
    .sort(function(p,q){return (q.endedAt||"").localeCompare(p.endedAt||"");})[0]||null;
}
function rowKeys(au,b){
  var m={}; (au.rows||[]).forEach(function(r){ if(r.b===b) m[r.assetId||("epc:"+r.epc)]=r; }); return m;
}
function missingStreak(locId,assetId,uptoISO){
  var auds=list("audits").filter(function(x){return x.locationId===locId && (x.endedAt||"")<=(uptoISO||"");})
    .sort(function(p,q){return (q.endedAt||"").localeCompare(p.endedAt||"");});
  var n=0;
  for(var i=0;i<auds.length;i++){
    var hit=(auds[i].rows||[]).some(function(r){return r.b==="missing"&&r.assetId===assetId;});
    if(hit) n++; else break;
  }
  return n;
}
function deltaOf(a){
  var p=prevAudit(a); if(!p) return null;
  var cM=rowKeys(a,"missing"), pM=rowKeys(p,"missing");
  var cX=rowKeys(a,"misplaced"), pX=rowKeys(p,"misplaced");
  var cU=rowKeys(a,"unknown"), pU=rowKeys(p,"unknown");
  var cI=rowKeys(a,"inplace");
  var d={prev:p,newMissing:[],stillMissing:[],recovered:[],newMisplaced:[],clearedMisplaced:[],newUnknown:[],clearedUnknown:[]};
  Object.keys(cM).forEach(function(k){ (pM[k]? d.stillMissing : d.newMissing).push(cM[k]); });
  Object.keys(pM).forEach(function(k){ if(cI[k]) d.recovered.push(pM[k]); });
  Object.keys(cX).forEach(function(k){ if(!pX[k]) d.newMisplaced.push(cX[k]); });
  Object.keys(pX).forEach(function(k){ if(!cX[k]) d.clearedMisplaced.push(pX[k]); });
  Object.keys(cU).forEach(function(k){ if(!pU[k]) d.newUnknown.push(cU[k]); });
  Object.keys(pU).forEach(function(k){ if(!cU[k]) d.clearedUnknown.push(pU[k]); });
  return d;
}
/* The exceptions in a report are not a list to act on by hand: committing

function auditHay(a){

function filteredAudits(){
  var from=dayStart(REP.from), to=dayEnd(REP.to);
  return list("audits").filter(function(a){
    if(REP.area!=="all"&&a.locationId!==REP.area) return false;
    if(from&&(a.endedAt||"")<from) return false;
    if(to&&(a.endedAt||"")>to) return false;
    var ex=a.counts.misplaced+a.counts.missing+a.counts.unknown;
    if(REP.exOnly&&!ex) return false;
    if(REP.q&&!matches(REP.q,auditHay(a))) return false;
    if(REP.round!=="all"&&(a.roundId||"")!==REP.round) return false;
    return true;
  });

function viewReports(){
  var rows=filteredAudits();
  var g=GRID.reports;
  var get=function(a){
    if(g.sort==="area") return locName(a.locationId);
    if(g.sort==="coverage") return a.expected? a.counts.inplace/a.expected : 0;
    if(g.sort==="exceptions") return a.counts.misplaced+a.counts.missing+a.counts.unknown;
    if(g.sort==="expected") return a.expected;
    return a[g.sort];
  };
  var sorted=sortRows(rows,g.sort,g.dir,get), page=pageOf("reports",sorted);
  if(!REP.sel||!S.audits[REP.sel]) REP.sel=sorted.length?sorted[0].id:"";

  var totExp=0, totIn=0, totEx=0;
  rows.forEach(function(a){ totExp+=a.expected; totIn+=a.counts.inplace;
    totEx+=a.counts.misplaced+a.counts.missing+a.counts.unknown; });
  var cov=totExp? Math.round(totIn/totExp*100) : 0;

  var h='<div class="view">';

  h+='<section class="panel"><div class="panel-h"><h2>Latest scan by area</h2>'+
     '<span class="sub">where each area stood the last time it was swept</span></div>'+
     '<div class="panel-b"><div class="tiles">';
  list("locations").forEach(function(l){
    var la=lastAuditAt(l.id);
    if(!la){ h+='<div class="tile"><div class="k">'+esc(l.code)+'</div><div class="v" style="font-size:19px;color:var(--ink-3)">Never</div><div class="f">'+esc(l.name)+'</div></div>'; return; }
    var ex=la.counts.misplaced+la.counts.missing+la.counts.unknown;
    h+='<button class="tile" style="text-align:left;cursor:pointer" data-pickrep="'+esc(la.id)+'">'+
       '<div class="k">'+esc(l.code)+'</div>'+
       '<div class="v" style="'+(ex?'color:var(--crit)':'color:var(--ok)')+'">'+la.counts.inplace+'/'+la.expected+'</div>'+
       '<div class="f">'+esc(l.name)+' \u00b7 '+ago(la.endedAt)+' ago'+(ex?' \u00b7 '+ex+' open':' \u00b7 clean')+'</div></button>';
  });
  h+='</div></div></section>';

  var _rs=rounds().sort(function(x,y){return (y.openedAt||"").localeCompare(x.openedAt||"");});
  if(_rs.length){
    h+='<section class="panel"><div class="panel-h"><h2>Audit reports</h2>'+
      '<span class="sub">the exercise-level report \u2014 one per audit, across every area it covered</span></div>'+
      '<div class="tw"><table><thead><tr><th>Audit</th><th>Reason</th><th>Ran</th>'+
      '<th class="num">Areas</th><th class="num">Coverage</th><th class="num">Exceptions</th><th>Status</th><th></th>'+
      '</tr></thead><tbody>';
    _rs.slice(0,12).forEach(function(r){
      var pr=roundProgress(r);
      h+='<tr><td><b>'+esc(roundTitle(r))+'</b><br><span class="epc">'+esc(r.ref)+'</span></td>'+
         '<td>'+esc(reasonLabel(r.reason))+'</td>'+
         '<td><small class="muted">'+fmtDay(r.openedAt)+'</small></td>'+
         '<td class="num">'+pr.done+' of '+pr.total+'</td>'+
         '<td class="num">'+(pr.expected? pr.coverage+'%':'\u2014')+'</td>'+
         '<td class="num">'+(pr.exceptions? '<span class="chip crit">'+pr.exceptions+'</span>':'0')+'</td>'+
         '<td>'+(r.status==="open"? '<span class="chip warn">Running</span>'
                : r.status==="abandoned"? '<span class="chip mute">Abandoned</span>'
                : r.signedOffAt? '<span class="chip ok">Signed off</span>' : '<span class="chip acc">Closed</span>')+'</td>'+
         '<td><button class="btn sm" data-roundrep="'+esc(r.id)+'">Report</button></td></tr>';
    });
    h+='</tbody></table></div></section>';
  }

  h+='<section class="panel"><div class="panel-h"><h2>Find an area scan</h2>'+
    '<span class="sub">'+rows.length+' of '+list("audits").length+' scans'+
    (rows.length? ' \u00b7 '+cov+'% average coverage \u00b7 '+totEx+' exception'+(totEx===1?"":"s") : '')+'</span>'+
    '<button class="btn sm" data-export="auditsfiltered">Export these</button></div>';

  h+='<div class="toolbar">'+
    '<input type="text" id="repQ" class="search" placeholder="Search area, code, person or date\u2026" value="'+esc(REP.q)+'">'+
    (rounds().length? '<select id="repRound">'+roundOpts(REP.round)+'</select>' : '')+
    '<select id="repArea"><option value="all">All areas</option>'+
      list("locations").map(function(l){return '<option value="'+esc(l.id)+'"'+(REP.area===l.id?" selected":"")+'>'+esc(l.name)+'</option>';}).join("")+'</select>'+
    '<label class="dfld">From <input type="date" id="repFrom" value="'+esc(REP.from)+'"></label>'+
    '<label class="dfld">To <input type="date" id="repTo" value="'+esc(REP.to)+'"></label>'+
    '<button class="btn sm" data-preset="7">7d</button>'+
    '<button class="btn sm" data-preset="30">30d</button>'+
    '<button class="btn sm" data-preset="90">90d</button>'+
    '<button class="btn sm" data-preset="0">All</button>'+
    '<button class="btn sm'+(REP.exOnly?" pri":"")+'" id="repEx">With exceptions</button>'+
    (REP.q||REP.area!=="all"||REP.round!=="all"||REP.from||REP.to||REP.exOnly?'<button class="btn sm" id="repClear">Clear</button>':'')+
    '</div>';

  h+='<div class="tw"><table class="grid"><thead><tr>'+
    th("reports","endedAt","Finished")+th("reports","area","Area")+'<th>Audit</th>'+th("reports","operator","Scanned by")+
    th("reports","expected","Expected")+th("reports","coverage","Coverage")+
    '<th>Breakdown</th>'+th("reports","exceptions","Exceptions")+'<th></th></tr></thead><tbody>';
  if(!page.length) h+='<tr><td colspan="9"><div class="empty">No audits match. Widen the dates or clear the filters.</div></td></tr>';
  page.forEach(function(a){
    var c=a.counts, tot=c.inplace+c.misplaced+c.missing+c.unknown||1;
    var ex=c.misplaced+c.missing+c.unknown;
    var pc=a.expected? Math.round(c.inplace/a.expected*100):0;
    h+='<tr'+(REP.sel===a.id?' class="rowsel"':'')+'>'+
      '<td class="num">'+esc(fmtDate(a.endedAt))+'</td>'+
      '<td><b>'+esc(locName(a.locationId))+'</b><br><span class="epc">'+esc(locCode(a.locationId))+'</span></td>'+
      '<td>'+esc(a.operator||"\u2014")+'</td>'+
      '<td class="num">'+a.expected+'</td>'+
      '<td class="num"><b>'+pc+'%</b></td>'+
      '<td style="min-width:120px"><div class="bar">'+seg(c.inplace,tot,"ok")+seg(c.misplaced,tot,"warn")+seg(c.missing,tot,"crit")+seg(c.unknown,tot,"unk")+'</div></td>'+
      '<td class="num">'+(ex?'<span class="chip crit">'+ex+'</span>':'<span class="chip ok">clean</span>')+'</td>'+
      '<td><button class="btn sm" data-pickrep="'+esc(a.id)+'">Open</button></td></tr>';
  });
  h+='</tbody></table></div>'+pager("reports",sorted.length)+'</section>';

  h+='<div id="repDetail">'+(REP.sel? reportDetail(S.audits[REP.sel])
      : '<div class="panel"><div class="empty">Pick an audit above to read its report.</div></div>')+'</div>';
  if(mod("depreciation")) h+=farPanel();
  if(can("log.read")){ h+=retagPanel(); h+=logPanel(); }
  return h+'</div>';
}

/* The auditor's panel. Read-only by design: a log that can be edited is not
   a log. Entries age out at LOG_CAP, which is why the export matters — on a
   real deployment this collection lives on the server and never ages out. */
var LOGF={q:"",col:"all",who:"all"};
var LOG_COLNAMES={assets:"Asset",classes:"Asset class",people:"User",
                  locations:"Area",rounds:"Audit",audits:"Sweep",teams:"Department"};
function logRows(){
  var rows=list("log");
  if(LOGF.col!=="all") rows=rows.filter(function(r){return r.col===LOGF.col;});
  if(LOGF.who!=="all") rows=rows.filter(function(r){return r.by===LOGF.who;});
  var q=LOGF.q.trim().toLowerCase();
  if(q) rows=rows.filter(function(r){
    return (r.label+" "+r.byName+" "+r.action+" "+(LOG_COLNAMES[r.col]||r.col)+" "+
      r.changes.map(function(c){return c.f+" "+c.from+" "+c.to;}).join(" ")).toLowerCase().indexOf(q)>=0;
  });
  return rows.sort(function(a,b){return String(b.at).localeCompare(String(a.at));});
}
function logFieldName(f){
  var m={classId:"asset class",inUseDate:"date put to use",epc:"tag (EPC)",
         home:"home area",residualPct:"residual %",itRate:"IT block %",
         deptTeamId:"owning department",mobile:"moves between areas",dueBack:"expected back",
         signedBy:"signed off by",closedAt:"closed",team:"department",
         life:"useful life",method:"method",pin:"PIN",
         empCode:"employee code",teamId:"department",area:"area / floor",
         anchor:"area tag (EPC)",lead:"team lead",active:"active"};
  return m[f]||f;
}
function logVal(f,v){
  if(v==="") return '<span class="muted">blank</span>';
  if(f==="mobile") return v==="true"?"yes":"no";
  if(f==="cost") return esc(inr(Number(v)||0));
  if(f==="home"||f==="lastSeenLoc") return esc(locName(v));
  if(f==="classId"){ var c=S.classes[v]; return c?esc(c.code):esc(v); }
  if(f==="team"||f==="teamId"||f==="deptTeamId") return esc(teamName(v));
  if(f==="active") return v==="true"?"yes":"no";
  if(f==="epc"||f==="anchor") return '<span class="epc">'+esc(v)+'</span>';
  return esc(String(v));
}
function logPanel(){
  var all=list("log"), rows=logRows();
  var whos={}; all.forEach(function(r){ if(r.by) whos[r.by]=r.byName; });
  var cols={}; all.forEach(function(r){ cols[r.col]=true; });
  var h='<section class="panel"><div class="panel-h"><h2>Change log</h2>'+
    '<span class="sub">who changed what, and what it said before — '+all.length+
      ' entr'+(all.length===1?"y":"ies")+' held, newest '+LOG_CAP+' kept on this device</span>'+
    (all.length? '<button class="btn sm" data-export="log">Export log</button>' : '')+
    '</div>';
  if(!all.length){
    return h+'<div class="empty">Nothing has been changed yet. Every edit to an asset, a class, '+
      'a user, an area or an audit is recorded here from now on.</div></section>';
  }
  h+='<div class="panel-b"><div class="toolbar">'+
    '<input type="text" id="logQ" class="search" placeholder="Search asset, field, person or value…" value="'+esc(LOGF.q)+'">'+
    '<select id="logCol"><option value="all">Everything</option>'+
      Object.keys(cols).map(function(c){ return '<option value="'+esc(c)+'"'+(LOGF.col===c?" selected":"")+'>'+
        esc(LOG_COLNAMES[c]||c)+'</option>'; }).join("")+'</select>'+
    '<select id="logWho"><option value="all">Anyone</option>'+
      Object.keys(whos).map(function(w){ return '<option value="'+esc(w)+'"'+(LOGF.who===w?" selected":"")+'>'+
        esc(whos[w])+'</option>'; }).join("")+'</select>'+
    (LOGF.q||LOGF.col!=="all"||LOGF.who!=="all"? '<button class="btn sm" data-logclear>Clear</button>':'')+
    '</div></div>';
  var g=GRID.log, page=rows.slice((g.page-1)*g.size, g.page*g.size);
  h+='<div class="tw"><table class="grid"><thead><tr><th>When</th><th>Who</th><th>What</th>'+
     '<th>Record</th><th>Change</th></tr></thead><tbody>';
  if(!page.length) h+='<tr><td colspan="5"><span class="muted">Nothing matches those filters.</span></td></tr>';
  page.forEach(function(r){
    var what=r.action==="created"?'<span class="chip ok">Created</span>'
            :r.action==="removed"?'<span class="chip crit">Removed</span>'
            :'<span class="chip acc">Changed</span>';
    var det=r.changes.length
      ? r.changes.map(function(c){
          return '<div><span class="muted">'+esc(logFieldName(c.f))+'</span> '+
            (r.action==="created"? logVal(c.f,c.to)
             : logVal(c.f,c.from)+' <span class="muted">→</span> <b>'+logVal(c.f,c.to)+'</b>')+'</div>';
        }).join("")
      : '<span class="muted">—</span>';
    h+='<tr><td class="num">'+esc(fmtDate(r.at))+'</td>'+
       '<td><b>'+esc(r.byName||"—")+'</b>'+(r.byRole?'<br><span class="epc">'+esc(r.byRole)+'</span>':'')+'</td>'+
       '<td>'+what+'<br><span class="epc">'+esc(LOG_COLNAMES[r.col]||r.col)+'</span></td>'+
       '<td>'+esc(r.label||r.recId)+'</td>'+
       '<td>'+det+'</td></tr>';
  });
  return h+'</tbody></table></div>'+pager("log",rows.length)+'</section>';
}

/* Every tag replacement, which is the record an auditor asks for by name:
   which asset, off which tag, onto which tag, why, by whom, signed. */
function retagPanel(){
  var rs=retags();
  var h='<section class="panel"><div class="panel-h"><h2>Tag replacements</h2>'+
    '<span class="sub">'+(rs.length? rs.length+' replacement'+(rs.length===1?"":"s")+
      ' · each one signed by the person who made it' : 'no tag has been replaced')+'</span>'+
    (rs.length? '<button class="btn sm" data-export="retags">Export</button>' : '')+'</div>';
  if(!rs.length){
    return h+'<div class="empty">No tag has been replaced. When one is, it is recorded here with the '+
      'reason, the old and new tag, and the signature of the person who did it.</div></section>';
  }
  h+='<div class="tw"><table class="grid"><thead><tr><th>When</th><th>Who</th><th>Asset</th>'+
     '<th>Off this tag</th><th>Onto this tag</th><th>Why</th><th>Signed</th></tr></thead><tbody>';
  rs.forEach(function(r){
    h+='<tr><td class="num">'+esc(fmtDate(r.at))+'</td>'+
       '<td><b>'+esc(r.by||"—")+'</b>'+(r.byCode? '<br><span class="epc">'+esc(r.byCode)+'</span>':'')+'</td>'+
       '<td>'+(r.assetId&&asset(r.assetId)
          ? '<button class="btn sm linkish" data-trail="'+esc(r.assetId)+'" style="border:0;background:none;padding:0;font-weight:600">'+esc(r.assetCode)+'</button> '+esc(r.assetName)
          : '<b>'+esc(r.assetCode)+'</b> '+esc(r.assetName))+'</td>'+
       '<td class="epc">'+esc(r.oldEpc||"—")+'</td>'+
       '<td class="epc">'+esc(r.newEpc||"—")+'</td>'+
       '<td>'+esc(retagReasonLabel(r.reason))+(r.remarks? '<br><small class="muted">'+esc(r.remarks)+'</small>':'')+'</td>'+
       '<td>'+(r.signed? '<span class="chip ok">signed</span>' : '<span class="chip crit">unsigned</span>')+'</td></tr>';
  });
  return h+'</tbody></table></div></section>';
}

/* The same history, narrowed to one asset, read where the asset is edited.
   Named apart from assetTrail(), which is the sighting history — where the
   asset has been seen. Two different questions: this one is what the record
   said before somebody changed it. */
function assetChangeLog(id){
  var rt=list("retags").filter(function(r){return r.assetId===id;})
    .sort(function(a,b){return String(b.at).localeCompare(String(a.at));});
  var head="";
  if(rt.length){
    head='<div class="tw" style="margin-bottom:10px"><table class="grid"><thead><tr>'+
      '<th>Tag replaced</th><th>Off</th><th>Onto</th><th>Why</th><th>By</th><th></th></tr></thead><tbody>'+
      rt.map(function(r){ return '<tr><td class="num">'+esc(fmtDate(r.at))+'</td>'+
        '<td class="epc">'+esc(shortEpc(r.oldEpc))+'</td><td class="epc">'+esc(shortEpc(r.newEpc))+'</td>'+
        '<td>'+esc(retagReasonLabel(r.reason))+(r.remarks?'<br><small class="muted">'+esc(r.remarks)+'</small>':'')+'</td>'+
        '<td>'+esc(r.by||"—")+'</td>'+
        '<td>'+(r.signed?'<span class="chip ok">signed</span>':'<span class="chip crit">unsigned</span>')+'</td></tr>'; }).join("")+
      '</tbody></table></div>';
  }
  var rows=list("log").filter(function(r){return r.col==="assets"&&r.recId===id;})
    .sort(function(a,b){return String(b.at).localeCompare(String(a.at));}).slice(0,25);
  if(!rows.length) return head||'<div class="muted">No changes recorded for this asset yet.</div>';
  var h=head+'<div class="tw"><table class="grid"><thead><tr><th>When</th><th>Who</th><th>Change</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td class="num">'+esc(fmtDate(r.at))+'</td><td>'+esc(r.byName||"—")+'</td><td>'+
      (r.changes.length? r.changes.map(function(c){
        return '<div><span class="muted">'+esc(logFieldName(c.f))+'</span> '+
          (r.action==="created"? logVal(c.f,c.to)
           : logVal(c.f,c.from)+' <span class="muted">→</span> <b>'+logVal(c.f,c.to)+'</b>')+'</div>';
      }).join("") : esc(r.action))+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* One area, laid out for paper: the facts of the sweep, then every exception
   named. No charts — a printed bar tells a reader nothing they can act on. */
function areaReportBody(a){
  var c=a.counts, rr=a.roundId? round(a.roundId):null;
  var h='<div class="tw"><table><tbody>'+
    '<tr><th style="width:34%">Area</th><td>'+esc(locName(a.locationId))+' ('+esc(locCode(a.locationId))+')</td></tr>'+
    '<tr><th>Part of audit</th><td>'+(rr? esc(roundTitle(rr))+' — '+esc(rr.ref) : 'standalone scan')+'</td></tr>'+
    '<tr><th>Scanned by</th><td>'+esc(a.operator||"—")+(a.operatorCode? ' ('+esc(a.operatorCode)+')':'')+
      /* Two people counted this area; the paper must not name one. */
      ((a.handover||[]).length
        ? (a.handover||[]).map(function(hv){ return '<br>handed over from '+esc(hv.from)+' after '+
            hv.readsAtHandover+' read'+(hv.readsAtHandover===1?'':'s')+', '+esc(fmtDate(hv.at)); }).join("")
        : "")+'</td></tr>'+
    '<tr><th>Started</th><td>'+esc(fmtDate(a.startedAt))+'</td></tr>'+
    '<tr><th>Finished</th><td>'+esc(fmtDate(a.endedAt))+'</td></tr>'+
    '<tr><th>RSSI floor used</th><td>'+esc(String(a.floor))+' dBm</td></tr>'+
    '<tr><th>Allotted to this area</th><td>'+a.expected+' tagged assets</td></tr>'+
    '<tr><th>Found in place</th><td>'+c.inplace+'</td></tr>'+
    '<tr><th>Misplaced</th><td>'+c.misplaced+'</td></tr>'+
    '<tr><th>Not found</th><td>'+c.missing+'</td></tr>'+
    '<tr><th>Tags not in the register</th><td>'+c.unknown+'</td></tr>'+
    (c.away? '<tr><th>Mobile, no action</th><td>'+c.away+'</td></tr>':'')+
    (c.eyeballed? '<tr><th>Seen by eye, tag unreadable</th><td>'+c.eyeballed+'</td></tr>':'')+
    (c.offsite? '<tr><th>Away from the plant</th><td>'+c.offsite+' (repair, loan or transit)</td></tr>':'')+
    (mod("depreciation")&&a.valueMissing!=null
      ? '<tr><th>Net block not found</th><td>'+esc(inr(a.valueMissing||0))+'</td></tr>':'')+
    '</tbody></table></div>';
  var ex=(a.rows||[]).filter(function(r){return r.b!=="inplace"&&r.b!=="away"&&r.b!=="eyeballed"&&r.b!=="offsite";});
  var eyes=(a.rows||[]).filter(function(r){return r.b==="eyeballed";});
  h+='<span class="eyebrow">Exceptions ('+ex.length+')</span>';
  if(!ex.length) h+='<p class="muted">None. Every tagged asset allotted to this area was read in this area.</p>';
  else{
    h+='<div class="tw"><table><thead><tr><th>Finding</th><th>Asset</th><th>Code</th><th>Tag</th>'+
       (mod("depreciation")?'<th class="num">Book value</th>':'')+'</tr></thead><tbody>';
    ex.forEach(function(r){
      var as=r.assetId? asset(r.assetId):null;
      h+='<tr><td>'+alertChip(r.b)+'</td>'+
         '<td>'+esc(as?as.name:"(not in the register)")+'</td>'+
         '<td>'+esc(as?as.code:"—")+'</td>'+
         '<td>'+esc(r.epc||"—")+'</td>'+
         (mod("depreciation")?'<td class="num">'+(r.nbv? esc(inr(r.nbv)):"—")+'</td>':'')+'</tr>';
    });
    h+='</tbody></table></div>';
  }
  return h;
}

function reportDetail(a,forPrint){
  if(!a) return "";
  var c=a.counts, tot=c.inplace+c.misplaced+c.missing+c.unknown||1, d=deltaOf(a);
  if(forPrint){
    var rr=a.roundId? round(a.roundId) : null;

             "Scanned "+fmtDate(a.endedAt)+" by "+(a.operator||"—"), rr?rr.ref:"")+
      '<div class="psec">'+areaReportBody(a)+'</div>'+

      printFoot(locCode(a.locationId)+" · "+locName(a.locationId));

  var h='<div class="stack">';
  h+='<div class="panel"><div class="panel-h"><h2>'+esc(locName(a.locationId))+' — audit report</h2>'+

    '<button class="btn sm" data-printarea="'+esc(a.id)+'">Print</button>'+
    '<button class="btn sm" data-repcsv="'+esc(a.id)+'">Export report</button></div>'+
    '<div class="panel-b stack" style="gap:10px">'+
    '<div class="tw"><table><tbody>'+
      '<tr><th style="width:38%">Area</th><td>'+esc(locName(a.locationId))+' <span class="epc">'+esc(locCode(a.locationId))+'</span></td></tr>'+
      '<tr><th>Part of</th><td>'+(a.roundId&&round(a.roundId)
        ? '<b>'+esc(roundTitle(round(a.roundId)))+'</b> '+roundTag(a.roundId)
        : '<span class="muted">a standalone scan, not part of an audit</span>')+'</td></tr>'+
      '<tr><th>Scanned by</th><td>'+esc(a.operator||"\u2014")+
        (a.operatorCode?' <span class="epc">'+esc(a.operatorCode)+'</span>':'')+
        (a.operatorId?'':' <span class="chip mute">name not verified</span>')+
        ((a.handover||[]).length
          ? '<br>'+(a.handover||[]).map(function(hv){
              return '<small class="muted">handed over from '+esc(hv.from)+' after '+
                hv.readsAtHandover+' read'+(hv.readsAtHandover===1?'':'s')+' on '+esc(fmtDate(hv.at))+'</small>';
            }).join('<br>')
          : '')+'</td></tr>'+
      '<tr><th>Started</th><td class="epc">'+fmtDate(a.startedAt)+'</td></tr>'+
      '<tr><th>Finished</th><td class="epc">'+fmtDate(a.endedAt)+'</td></tr>'+
      '<tr><th>RSSI floor used</th><td class="epc">'+a.floor+' dBm</td></tr>'+

var TF={team:"all",area:"all",round:"all",overdue:false,q:"",type:"all",status:"all",view:"grid",scope:""};
var TSEL={};

/* ---- Whose jobs ----------------------------------------------------------
   Everybody was landing on every open job on the site. For an operator with
   three things to chase that is a list to scroll past rather than a list to
   work, and the person who most needs to see the whole site — whoever has to
   answer for what is still open — is not the person holding the reader.

   So the screen opens on a different slice depending on who signed in, and
   anyone can widen it. The scope is deliberately not remembered across a
   sign-out: the next person on the same handheld gets their own default, not
   the last one's.                                                           */
function taskScopeDefault(){
  var m=me(); if(!m) return "all";
  if(m.role==="operator") return "mine";
  if(m.role==="supervisor") return m.teamId? "team" : "mine";
  return "all";                       /* approver, administrator, auditor */
}
function taskScope(){
  var m=me();
  if(!TF.scope) TF.scope=taskScopeDefault();
  /* Somebody can be moved off a team while the screen is open. A team view
     with no team would silently show nothing at all, which reads as "no work"
     rather than as "no team". */
  if(TF.scope==="team" && !(m&&m.teamId)) TF.scope="all";
  if(TF.scope==="mine" && !m) TF.scope="all";
  return TF.scope;
}
function inTaskScope(t,sc,m){
  if(sc==="mine") return !!m && t.assignee===m.id;
  if(sc==="team") return !!m && !!m.teamId && t.teamId===m.teamId;
  return true;
}
/* The slice the whole screen works from — list, tiles and counts alike. Tiles
   that counted the site while the list showed six rows was the confusing part
   of looking at this screen, not the list itself. */
function scopedTasks(){
  var sc=taskScope(), m=me();
  return tasks().map(migrateTask).filter(function(t){ return inTaskScope(t,sc,m); });
}
var GRID={
  tasks:{sort:"dueAt",dir:"asc",page:1,size:25},
  reports:{sort:"endedAt",dir:"desc",page:1,size:25},
  assets:{sort:"code",dir:"asc",page:1,size:50},
  log:{sort:"at",dir:"desc",page:1,size:25}
};

/* ---- shared grid helpers: sort, page, search ---- */
function sortRows(rows,key,dir,get){
  var g=get||function(r){return r[key];};
  return rows.slice().sort(function(a,b){
    var x=g(a), y=g(b);
    if(typeof x==="number"&&typeof y==="number") return dir==="asc"?x-y:y-x;
    x=String(x==null?"":x).toLowerCase(); y=String(y==null?"":y).toLowerCase();
    if(x===y) return 0;
    return dir==="asc" ? (x<y?-1:1) : (x>y?-1:1);
  });
}
function th(gk,key,label,cls){
  var g=GRID[gk], on=g.sort===key;
  return '<th class="sortable'+(on?" on":"")+(cls?" "+cls:"")+'" data-sortby="'+gk+':'+key+'" '+
    'title="Sort by '+esc(label)+'">'+esc(label)+'<i class="sar">'+(on?(g.dir==="asc"?"▲":"▼"):"◆")+'</i></th>';
}
function pageOf(gk,rows){
  var g=GRID[gk], pages=Math.max(1,Math.ceil(rows.length/g.size));
  if(g.page>pages) g.page=pages; if(g.page<1) g.page=1;
  return rows.slice((g.page-1)*g.size, g.page*g.size);
}
function pager(gk,total){
  var g=GRID[gk], pages=Math.max(1,Math.ceil(total/g.size));
  var from=total? (g.page-1)*g.size+1 : 0, to=Math.min(total,g.page*g.size);
  var btn=function(p,label,dis){ return '<button class="btn sm" data-page="'+gk+':'+p+'"'+(dis?" disabled":"")+'>'+label+'</button>'; };
  var nums="", start=Math.max(1,g.page-2), end=Math.min(pages,start+4);
  start=Math.max(1,Math.min(start,end-4));
  for(var i=start;i<=end;i++) nums+='<button class="btn sm'+(i===g.page?" pri":"")+'" data-page="'+gk+':'+i+'">'+i+'</button>';
  return '<div class="pager"><span class="pcount">'+(total? from+'–'+to+' of '+total : 'nothing to show')+'</span>'+
    '<div class="btn-row">'+btn(g.page-1,"‹ Prev",g.page<=1)+nums+btn(g.page+1,"Next ›",g.page>=pages)+'</div>'+
    '<label class="psize">Rows <select data-psize="'+gk+'">'+
      [10,25,50,100,250].map(function(n){return '<option value="'+n+'"'+(g.size===n?" selected":"")+'>'+n+'</option>';}).join("")+
    '</select></label></div>';
}

function matches(q,text){

  var terms=q.toLowerCase().split(/\s+/).filter(Boolean);

  identify:[["enrolled","Identified and enrolled in the register"],["foreign_tag","Not ours — tag removed"],
          ["scrap_tag","Stray or dead tag — removed"]]
};
function resolOutcome(code){
  if(needsApproval(code)) return mod("approval")? "approval" : "closed";
  if(code==="not_traceable") return "escalate";
  if(code==="re_allotted"||code==="enrolled"||code==="foreign_tag"||code==="scrap_tag") return "closed";
  return "done";
}
function resolLabel(type,code){
  var l=(RESOL[type]||[]).filter(function(r){return r[0]===code;})[0];
  return l?l[1]:code;
}
function team(id){ return S.teams[id]||null; }
function teamName(id){ var t=team(id); return t?t.name:"Unassigned"; }
function tasks(){ return list("alerts"); }
function openTasks(){ return tasks().filter(function(t){return t.status!=="closed";}); }
function isOverdue(t){ return t.status!=="closed" && t.dueAt && new Date(t.dueAt).getTime()<Date.now(); }
function dueLabel(t){
  if(t.status==="closed") return "closed "+ago(t.closedAt)+" ago";
  if(!t.dueAt) return "no due date";
  var d=(new Date(t.dueAt).getTime()-Date.now())/86400000;
  if(d<0) return Math.max(1,Math.round(-d))+"d overdue";
  if(d<1) return "due today";
  return "due in "+Math.round(d)+"d";
}
function slaDays(type){ var c=cfg();
  return type==="locate"?(c.slaLocate||7):type==="return"?(c.slaReturn||3):(c.slaIdentify||5); }
function addHist(t,who,what){ t.history=(t.history||[]).concat([{at:nowISO(),who:who,what:what}]); }
function addHistAsset(a,what){ a.log=(a.log||[]).concat([{at:nowISO(),what:what}]); }

function migrateTask(t){
  if(t.type==="misplaced") t.type="return";
  else if(t.type==="missing") t.type="locate";
  else if(t.type==="unknown") t.type="identify";
  if(!t.raisedAt) t.raisedAt=t.at||nowISO();
  if(!t.dueAt) t.dueAt=new Date(new Date(t.raisedAt).getTime()+slaDays(t.type)*86400000).toISOString();
  if(!t.teamId){ var l=loc(t.type==="locate"?t.expectedLoc:t.foundLoc); t.teamId=(l&&l.team)||""; }
  if(t.status==="acknowledged") t.status="progress";
  if(t.status==="resolved") t.status="closed";
  if(!t.status) t.status="open";
  if(!t.history) t.history=[{at:t.raisedAt,who:"System",what:"Raised by audit"}];
  if(t.assignee==null) t.assignee="";
  if(!t.priority) t.priority="normal";
  if(t.resolution==null) t.resolution="";
  if(t.remarks==null) t.remarks="";
  return t;
}

function taskHay(t){
  var as=t.assetId?asset(t.assetId):null;
  return hay(t.id, TTYPE[t.type]?TTYPE[t.type].label:t.type, as?as.code:"", as?as.name:"", as?as.category:"",
    t.epc, locName(t.expectedLoc), locName(t.foundLoc), teamName(t.teamId), t.assignee, t.status,
    t.resolution||"", t.remarks||"", (t.approval&&t.approval.evRef)||"");
}
function filteredTasks(){
  var all=scopedTasks();
  return all.filter(function(t){
    if(TF.team!=="all"&&t.teamId!==TF.team) return false;
    if(TF.area!=="all"&&t.expectedLoc!==TF.area&&t.foundLoc!==TF.area) return false;
    if(TF.round!=="all"&&(t.roundId||"")!==TF.round) return false;
    if(TF.type!=="all"&&t.type!==TF.type) return false;
    if(TF.status!=="all"&&t.status!==TF.status) return false;
    if(TF.overdue&&!isOverdue(t)) return false;
    if(TF.q&&!matches(TF.q,taskHay(t))) return false;
    return true;
  });
}

function signed(n,sign){ n=Number(n||0); return n? sign+n : "0"; }
/* ---- reconciliation: opening + raised − closed = closing ---- */
var RECON="30";
function periodStart(){
  if(RECON==="all") return new Date(0).toISOString();
  var d=new Date();
  if(RECON==="mtd") return new Date(d.getFullYear(),d.getMonth(),1).toISOString();
  return new Date(Date.now()-parseInt(RECON,10)*86400000).toISOString();
}
function reconcile(from,to,filterFn){
  var all=tasks().map(migrateTask).filter(filterFn||function(){return true;});
  var opening=all.filter(function(t){ return t.raisedAt<from && (!t.closedAt||t.closedAt>=from); });
  var raised=all.filter(function(t){ return t.raisedAt>=from && t.raisedAt<=to; });
  var closed=all.filter(function(t){ return t.closedAt && t.closedAt>=from && t.closedAt<=to; });
  var closing=all.filter(function(t){ return t.raisedAt<=to && (!t.closedAt||t.closedAt>to); });
  return {opening:opening,raised:raised,closed:closed,closing:closing,
    computed:opening.length+raised.length-closed.length, actual:closing.length};
}
function reconPanel(){
  var from=periodStart(), to=nowISO();
  var r=reconcile(from,to);
  var ok=r.computed===r.actual;
  var byRes={};
  r.closed.forEach(function(t){ var k=t.resolution||"verified_by_audit"; byRes[k]=(byRes[k]||0)+1; });

  var h='<section class="panel"><div class="panel-h"><h2>Task reconciliation</h2>'+
    '<span class="sub">what was open, what came in, what went out, what is left</span>'+
    '<select id="reconSel" style="max-width:180px">'+
      [["30","Last 30 days"],["90","Last 90 days"],["mtd","This month"],["all","Since the beginning"]].map(function(o){
        return '<option value="'+o[0]+'"'+(RECON===o[0]?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+
    '</select><button class="btn sm" data-export="recon">Export CSV</button></div><div class="panel-b stack">';

  h+='<div class="ledger">'+
    ledRow("Open at start of period",r.opening.length,"",r.opening.length?"opening":"")+
    ledRow("Raised by audits in period",signed(r.raised.length,"+"),r.raised.length?"add":"",r.raised.length?"raised":"")+
    ledRow("Closed in period",signed(r.closed.length,"−"),r.closed.length?"sub":"",r.closed.length?"closed":"")+
    ledRow("Should be open now",r.computed,"total")+
    ledRow("Actually open now",r.actual,"total",r.actual?"closing":"")+
    '</div>';
  h+='<div class="tallybar '+(ok?"ok":"bad")+'">'+(ok
      ? '<b>Tallies.</b> The open list is exactly the opening balance plus what the audits raised, less what the teams closed. Nothing has appeared or vanished without a record.'
      : '<b>Does not tally — off by '+Math.abs(r.computed-r.actual)+'.</b> A task was created or closed outside the audit and resolution flow. Check the activity log on recent tasks.')+'</div>';

  if(r.closed.length){
    h+='<div><div class="eyebrow" style="margin-bottom:5px">How the '+r.closed.length+' closures were accounted for</div><div class="tw"><table><tbody>';
    Object.keys(byRes).sort(function(a,b){return byRes[b]-byRes[a];}).forEach(function(k){
      var lbl = k==="verified_by_audit" ? "Closed by audit verification — no resolution keyed" :
        (RESOL.locate.concat(RESOL["return"],RESOL.identify).filter(function(x){return x[0]===k;})[0]||[k,k])[1];
      var bad = (k==="scrapped"||k==="written_off");
      h+='<tr><td><button class="btn sm" data-led="res:'+esc(k)+'" style="border:0;background:none;padding:0;text-align:left">'+esc(lbl)+'</button></td>'+
         '<td class="num" style="width:60px">'+byRes[k]+'</td>'+
         '<td style="width:120px">'+(bad?'<span class="chip crit">off the books</span>':'<span class="chip ok">accounted for</span>')+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  h+='<div><div class="eyebrow" style="margin-bottom:5px">By team</div><div class="tw"><table>'+
    '<thead><tr><th>Team</th><th>Opening</th><th>Raised</th><th>Closed</th><th>Closing</th><th>Overdue</th><th>Avg days to close</th></tr></thead><tbody>';
  list("teams").forEach(function(tm){
    var rt=reconcile(from,to,function(t){return t.teamId===tm.id;});
    var av=avgCloseDays(rt.closed);
    h+='<tr><td><button class="btn sm" data-tile="team:'+esc(tm.id)+'" style="border:0;background:none;padding:0;text-align:left">'+
         '<b>'+esc(tm.name)+'</b></button><br><small class="muted">'+esc(tm.lead)+'</small></td>'+
       '<td class="num">'+rt.opening.length+'</td><td class="num">'+signed(rt.raised.length,"+")+'</td>'+
       '<td class="num">'+signed(rt.closed.length,"−")+'</td><td class="num"><b>'+rt.actual+'</b></td>'+
       '<td class="num">'+(rt.closing.filter(isOverdue).length? '<span class="chip crit">'+rt.closing.filter(isOverdue).length+'</span>':'0')+'</td>'+
       '<td class="num">'+(av==null?"—":av)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  var retired=list("assets").filter(isRetired);
  h+='<div class="note"><b>Register effect.</b> '+retired.length+' asset'+(retired.length===1?" has":"s have")+
     ' been taken off the books by a task outcome (scrapped or written off). '+
     (retired.length? 'They are excluded from every area\'s expected count, so they are never raised as missing again — that is what stops the same exception coming back every cycle.' :
      'Once a task closes as scrapped or written off, the asset drops out of the expected count and stops being raised as missing.')+'</div>';

  return h+'</div></section>';
}
function ledRow(k,v,cls,act){
  var body='<span>'+esc(k)+'</span><b>'+esc(v)+'</b>';
  if(!act) return '<div class="led '+(cls||"")+'">'+body+'</div>';
  return '<button class="led act '+(cls||"")+'" data-led="'+esc(act)+'" '+
    'title="List these">'+body+'<span class="drill">Show</span></button>';

function avgCloseDays(closed){
  var v=closed.filter(function(t){return t.raisedAt&&t.closedAt;});
  if(!v.length) return null;
  var s=v.reduce(function(a,t){ return a+(new Date(t.closedAt)-new Date(t.raisedAt))/86400000; },0);
  return Math.round(s/v.length*10)/10;
}
function whereLine(t){
  if(t.type==="locate") return "missing from "+locName(t.expectedLoc);

  return "found in "+locName(t.foundLoc);

function statusChip(t){
  if(t.status==="approval") return '<span class="chip warn">'+esc(((t.approval||{}).level===2)?"Finance sign-off":"Lead sign-off")+'</span>';
  if(t.status==="closed") return '<span class="chip ok">Closed</span>';
  if(t.status==="done") return '<span class="chip acc">Awaiting verification</span>';
  if(t.status==="progress") return '<span class="chip warn">In progress</span>';
  return '<span class="chip mute">Open</span>';
}

function decideApproval(t,ok,reason){
  var ap=t.approval||{}, st=stamp();
  if(!st.by){ toast("Sign in before approving"); return false; }
  if(!can("writeoff.approve")){ toast("Your role cannot approve a write-off"); return false; }
  if(ap.requestedById? (ap.requestedById===st.by)
     : (ap.requestedBy && ap.requestedBy.trim().toLowerCase()===st.byName.trim().toLowerCase())){
    toast("The person who requested it cannot approve it"); return false;
  }
  ap.approver=st.byName; ap.approverId=st.by; ap.approverCode=st.byCode;
  ap.decidedAt=nowISO(); ap.reason=reason||"";
  if(ok){
    ap.state="approved"; t.approval=ap;
    if(t.assetId){
      var a=clone(asset(t.assetId));
      if(a){ a.status=ap.kind; a.statusNote=evLabel(ap.evType)+" "+ap.evRef+" · approved by "+ap.approver;
             a.statusAt=nowISO(); a.bookValue=ap.value||a.bookValue||""; save("assets",a); }
    }
    t.status="closed"; t.closedAt=nowISO(); t.closedBy=ap.approver; t.closedById=ap.approverId||"";
    addHist(t,ap.approver,"Approved — "+statusLabel(ap.kind)+" against "+evLabel(ap.evType)+" "+ap.evRef);
    addHist(t,"System","Closed — asset taken off the books, removed from every expected count");
    toast("Approved and taken off the books");
  } else {
    ap.state="rejected"; t.approval=ap;
    t.status="open"; t.priority="high"; t.resolution="";
    addHist(t,ap.approver,"Rejected"+(reason?" — "+reason:"")+". Asset stays on the books.");
    toast("Rejected — the task is back with the team");
  }
  save("alerts",t); closeModal(); render(); renderTabs(); return true;
}

function applyResolution(t,code,remarks){
  /* task.work is what separates somebody who can record that a job is done
     from somebody who can only read the board. It was declared in the role
     table from the start; without this check the table was a description of
     intent rather than a rule. */
  if(!can("task.work")){ toast("Your role cannot resolve jobs"); return; }
  var out=resolOutcome(code), who=meName()||t.assignee||"Team";
  if(needsApproval(code)&&!mod("approval")&&t.assetId){
    var ra=clone(asset(t.assetId));
    if(ra){ ra.status=code; ra.statusNote=remarks||""; ra.statusAt=nowISO(); save("assets",ra); }
  }
  if(out==="approval"){
    var aa=t.assetId?asset(t.assetId):null;
    var an=aa?aa.name:"this tag";
    EVNBV=aa?String(nbvOf(aa)||""):"";
    evidenceForm("Write-off request",an,code,function(d){ t.remarks=remarks||t.remarks; requestOffBooks(t,d); });
    return;
  }
  t.resolution=code; t.remarks=remarks||t.remarks;
  if(code==="re_allotted"&&t.assetId&&t.foundLoc){
    var a=clone(asset(t.assetId)); if(a){ a.home=t.foundLoc; save("assets",a); }
  }
  if(code==="enrolled"){
    addHist(t,who,"Resolved — "+resolLabel(t.type,code));
    t.status="closed"; t.closedAt=nowISO(); t.closedBy=who;
    addHist(t,"System","Closed — tag enrolled in the register");
    save("alerts",t); toast("Enrol the tag to finish"); return;
  }
  if(out==="escalate"){
    t.status="open"; t.priority="high";
    addHist(t,who,"Escalated — "+resolLabel(t.type,code)+(remarks?": "+remarks:""));
    toast("Escalated to the team lead");
  } else if(out==="closed"){
    t.status="closed"; t.closedAt=nowISO(); t.closedBy=who;
    addHist(t,who,"Resolved — "+resolLabel(t.type,code)+(remarks?": "+remarks:""));
    addHist(t,"System","Closed — register updated, nothing left to verify");
    toast("Task closed");
  } else {
    t.status="done";
    addHist(t,who,"Resolved — "+resolLabel(t.type,code)+(remarks?": "+remarks:""));
    addHist(t,"System","Awaiting verification by the next audit of "+locName(t.expectedLoc||t.foundLoc));
    toast("Recorded — the next audit will verify it");
  }
  save("alerts",t);
}

function newTask(type,assetId,epc,expectedLoc,foundLoc,auditId,at,pid,cond,cnote){
  var dup=tasks().filter(function(x){
    return x.status!=="closed" && x.type===type &&
      (assetId? x.assetId===assetId : x.epc===epc) &&
      (type==="locate"? x.expectedLoc===expectedLoc : x.foundLoc===foundLoc);
  })[0];
  if(dup){
    migrateTask(dup); dup.priority="high";
    addHist(dup,"System","Raised again by the audit of "+locName(foundLoc||expectedLoc)+" — priority raised");
    save("alerts",dup); return false;
  }
  var ownerLoc=loc(type==="locate"?expectedLoc:foundLoc);
  var teamId=(ownerLoc&&ownerLoc.team)||"", who="", whoId="", why="";
  /* Misplaced and unknown always go to whoever is standing next to the tag.
     Only a missing asset is routed by policy, and each step falls through to
     the next so a gap in the data never leaves a job with nobody. */
  if(type==="locate" && assetId){
    var ra=asset(assetId), rt=missingRoute(), dept=deptTeamOf(ra);
    if(rt==="custodian"){
      var cu=custodianOf(ra);
      if(cu && cu.teamId){ teamId=cu.teamId; who=cu.name; whoId=cu.id; why=" — the recorded custodian"; }
      else if(cu && dept){ teamId=dept; who=cu.name; whoId=cu.id; why=" — custodian has no team, so the owning department holds it"; }
      else if(cu){ who=cu.name; whoId=cu.id; why=" — custodian has no team and the class has no department, so the area team holds it"; }
      else if(dept){ teamId=dept; why=" — nobody is recorded as holding it, so the owning department holds it"; }
      else why=" — no custodian and no owning department, so the area team holds it";
    } else if(rt==="dept"){
      if(dept){ teamId=dept; why=" — the department that owns this asset type"; }
      else why=" — this asset's class has no owning department, so the area team holds it";
    }
  }
  var _rr=AUD.roundId? round(AUD.roundId) : null;
  /* Routing finds the right team. A team is a queue, and a queue with nobody's
     name on it is how five "unassigned" jobs sit untouched for a week. If the
     team has a lead, they own it from minute one and can hand it on. */
  if(!whoId && teamId){
    var _tm=(S.teams&&S.teams[teamId])||null;
    if(_tm && _tm.lead){
      var _pl=list("people").filter(function(u){
        return u.active!==false && String(u.name).trim().toLowerCase()===String(_tm.lead).trim().toLowerCase(); })[0];
      who=_tm.lead; whoId=_pl?_pl.id:"";
      why=why+(why?"":" \u2014 ")+(why?", ":"")+"team lead holds it until someone picks it up";
    }
  }
  var t={id:uid("TSK"),type:type,assetId:assetId,epc:epc,expectedLoc:expectedLoc,foundLoc:foundLoc,
    roundId:_rr?_rr.id:"",
    auditId:auditId,raisedAt:at,dueAt:new Date(new Date(at).getTime()+slaDays(type)*86400000).toISOString(),
    teamId:teamId,assignee:who,assigneeId:whoId,priority:"normal",status:"open",
    resolution:"",remarks:cnote||"",closedAt:"",closedBy:"",verifiedBy:"",notifiedAt:"",
    photoIds:pid?[pid]:[], condition:cond||"",
    history:[{at:at,who:"System",what:"Raised by audit of "+locName(foundLoc||expectedLoc)+
      (cond?" \u2014 condition recorded: "+condLabel(cond):"")},
             {at:at,who:"System",what:"Assigned to "+(teamId? teamName(teamId) : "no team — needs an owner")+
      (who?" \u00b7 "+who:"")+why}]};
  save("alerts",t); return true;
}

/* close tasks that this audit proves are done */
function verifyTasks(audit,b){
  var readHere={}, n=0;
  b.inplace.concat(b.misplaced).forEach(function(x){ readHere[x.asset.id]=true; });
  tasks().forEach(function(raw){
    var t=migrateTask(raw); if(t.status==="closed") return;
    /* A write-off awaiting sign-off, on an asset a reader just found, is contested. */
    if(t.status==="approval"){
      if(t.assetId&&readHere[t.assetId]&&t.approval&&!t.approval.contested){
        t.approval.contested=true; t.priority="high";
        addHist(t,"System","Contested — the asset was read in "+locName(audit.locationId)+" while its write-off was awaiting sign-off");
        save("alerts",t);
      }
      return;
    }
    var done=false, note="";
    if(t.type==="locate" && t.expectedLoc===audit.locationId && readHere[t.assetId]){
      done=true; note="Closed — read in "+locName(audit.locationId)+" during this audit";
    } else if(t.type==="return" && t.assetId){
      var a=asset(t.assetId);
      if(a && a.home===audit.locationId && readHere[t.assetId]){
        done=true; note="Closed — back in "+locName(audit.locationId)+", confirmed by audit";
      } else if(t.foundLoc===audit.locationId && readHere[t.assetId]){
        t.priority="high"; addHist(t,"System","Still in "+locName(audit.locationId)+" at the next audit — priority raised");
        save("alerts",t);
      }
    } else if(t.type==="identify" && t.epc && assetByEpc(t.epc)){
      done=true; note="Closed — tag now registered";
    }
    if(done){
      t.status="closed"; t.closedAt=nowISO(); t.closedBy="System"; t.verifiedBy=audit.id;
      addHist(t,"System",note); save("alerts",t); n++;
    }
  });
  return n;
}

function notifyTask(id){
  var t=S.alerts[id]; if(!t) return;
  var txt=notifyText(t);
  modal('<div class="panel-h"><h2>Notification</h2><span class="sub">what goes to the team on assignment</span>'+
    '<button class="btn sm" data-close>Close</button></div><div class="panel-b stack">'+
    '<textarea rows="17" id="notifyTa"></textarea>'+
    '<div class="muted">In the delivered system this goes out by email and in-app push the moment the task is raised, and again when it goes overdue. Here it is composed so the wording and the routing can be reviewed.</div>'+
    '<div class="btn-row"><button class="btn pri" id="notifySent">Copy and mark sent</button><button class="btn" data-close>Cancel</button></div></div>');
  $("#notifyTa").value=txt;
  $("#notifySent").addEventListener("click",function(){
    $("#notifyTa").select(); try{document.execCommand("copy");}catch(e){}
    t.notifiedAt=nowISO(); addHist(t,"System","Notification sent to "+teamName(t.teamId));
    save("alerts",t); closeModal(); toast("Copied and marked sent"); render(); renderTabs();
  });
}

function notifyText(t){
  var as=t.assetId?asset(t.assetId):null, tm=team(t.teamId);
  var label = as? (as.name+" ("+as.code+")") : ("tag "+t.epc);
  var act = t.type==="return" ? "Return the asset to its allotted area, or record a permanent re-allotment."
          : t.type==="locate" ? "Trace the asset and record the outcome. If it has been scrapped or written off, say so — that closes it for good."
          : "Identify what this tag is on and enrol it in the register.";
  var L=[];
  L.push("To: "+(tm?tm.name+" <"+tm.email+">":"area owner")+(t.assignee?"  (attn: "+t.assignee+")":""));
  L.push("Subject: ["+t.id+"] "+TTYPE[t.type].label+" — "+label+(isOverdue(t)?"  [OVERDUE]":""));
  L.push("");
  L.push("An RFID audit of "+locName(t.foundLoc||t.expectedLoc)+" on "+fmtDate(t.raisedAt)+" raised this task.");
  L.push("");
  L.push("Task:           "+TTYPE[t.type].label+" — "+TTYPE[t.type].desc);
  L.push("Asset:          "+label);
  L.push("Tag ID:         "+t.epc);
  L.push("Allotted area:  "+(t.expectedLoc?locName(t.expectedLoc)+" ("+locCode(t.expectedLoc)+")":"not registered"));
  L.push("Read in:        "+(t.foundLoc?locName(t.foundLoc)+" ("+locCode(t.foundLoc)+")":"not read in any area"));
  L.push("Assigned to:    "+teamName(t.teamId)+(t.assignee?" · "+t.assignee:" · unassigned"));
  if(as){ var cu2=custodianOf(as);
    if(cu2) L.push("Custodian:      "+cu2.name+(cu2.empCode?" ("+cu2.empCode+")":"")+(cu2.teamId?" · "+teamName(cu2.teamId):""));
    else if(as.custodian) L.push("Custodian:      "+as.custodian); }
  L.push("Due by:         "+fmtDate(t.dueAt)+"  ("+dueLabel(t)+")");
  L.push("");
  L.push("Action required: "+act);
  L.push("");
  L.push("This task closes automatically once the next audit of the area confirms the outcome.");
  L.push("");
  L.push("— RFID Asset Audit Console");
  return L.join("\n");
}

function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCsv(rows){ return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n"); }
function parseCsv(txt){
  var rows=[],row=[],cur="",q=false,i,ch;
  txt=String(txt).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(i=0;i<txt.length;i++){
    ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){return String(c).trim()!=="";}); });
}

async function offerFile(filename,text){
  var dl=null;
  try{ if(window.claude&&claude.use) dl=await claude.use("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename:filename,data:text}); toast("Saved "+filename); return; }
    catch(e){ if(e&&e.code==="declined") return; }
  }
  /* Standalone page: hand the browser a real file. */
  if(!window.claude){
    try{
      var blob=new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"});
      var url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download=filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },400);
      toast("Downloaded "+filename); return;
    }catch(e){}
  }
  modal('<div class="panel-h"><h2>'+esc(filename)+'</h2></div><div class="panel-b stack">'+
    '<div class="muted">Saving is not available in this view — select all and copy.</div>'+
    '<textarea rows="14" id="csvOut"></textarea>'+
    '<div class="btn-row"><button class="btn pri" id="copyCsv">Copy</button><button class="btn" data-close>Close</button></div></div>');
  $("#csvOut").value=text;
  $("#copyCsv").addEventListener("click",function(){ $("#csvOut").select(); try{document.execCommand("copy"); toast("Copied");}catch(e){} });
}

/* Registers come out of Tally, SAP and Excel with the date written every
   possible way. Day-first is assumed when it is ambiguous, which is right
   for an Indian client file. */
function normDate(v){
  v=String(v||"").trim(); if(!v) return "";
  var m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
  m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ var d=m[1],mo=m[2],y=m[3]; if(y.length===2) y=(Number(y)>70?"19":"20")+y;
         return y+"-"+("0"+mo).slice(-2)+"-"+("0"+d).slice(-2); }
  var dt=new Date(v); return isNaN(dt)? "" : dt.toISOString().slice(0,10);
}
function importAssets(txt){

  if(rows.length && /code/i.test(rows[0][0]||"")){

    var find=function(){ for(var i=0;i<arguments.length;i++){ var k=head.indexOf(arguments[i]); if(k>=0) return k; } return -1; };
    var m2={code:find("code","assetcode"), name:find("name","description","assetname"),

  }
  var at=function(r,k){ var i=MAP[k]; return (i==null||i<0)? "" : String(r[i]==null?"":r[i]).trim(); };
  rows.forEach(function(r){
    var code=at(r,"code"); if(!code) return;
    var lc=at(r,"location").toUpperCase();
    var l=list("locations").filter(function(x){return x.code.toUpperCase()===lc||x.name.toUpperCase()===lc;})[0];
    if(!l && lc){ l={id:uid("L"),code:lc,name:lc,area:"",owner:"",email:"",anchor:""}; save("locations",l); }
    var epc=at(r,"epc").toUpperCase().replace(/[^A-Z0-9]/g,"");
    var ex=list("assets").filter(function(a){return a.code.toUpperCase()===code.toUpperCase();})[0];
    if(epc){ var clash=assetByEpc(epc); if(clash && (!ex||clash.id!==ex.id)){ skipped++; epc=""; } }
    var o=ex||{id:uid("A"),code:code,lastSeenLoc:"",lastSeenAt:"",status:"active",custodian:""};
    o.code=code; o.name=at(r,"name")||code; o.category=at(r,"category"); o.home=l?l.id:(o.home||"");
    /* Cost and the date put to use are what depreciation is worked out from;
       dropping them on import is how a register arrives with a blank net block. */
    var cc=at(r,"classcode").toUpperCase();
    if(cc){
      var cl=list("classes").filter(function(x){ return String(x.code).toUpperCase()===cc; })[0];
      if(cl) o.classId=cl.id; else noclass++;
    }
    var cv=at(r,"cost").replace(/[^0-9.\-]/g,"");
    if(cv!=="") o.cost=Number(cv)||0;
    var dv=at(r,"inusedate");
    if(dv){ var iso=normDate(dv); if(iso) o.inUseDate=iso; }
    if(epc){ var st2=stamp(); o.epc=epc; o.taggedAt=o.taggedAt||nowISO();
             if(!o.taggedBy){ o.taggedBy=st2.byName; o.taggedById=st2.by; } } else if(!ex) o.epc="";
    save("assets",o); n++;
  });
  toast(n+" assets imported"+(skipped?", "+skipped+" duplicate EPCs skipped":"")+
        (noclass?", "+noclass+" with a class code that does not exist yet":"")); render(); renderTabs();
}

/* ============ report export ============ */
function exportReport(id){
  var a=S.audits[id]; if(!a) return;
  var d=deltaOf(a);
  var rows=[["RFID audit report"],["Area",locName(a.locationId)+" ("+locCode(a.locationId)+")"],
    ["Audited by",(a.operator||"")+(a.operatorCode?" ("+a.operatorCode+")":"")],
    ["Started",a.startedAt],["Finished",a.endedAt],["RSSI floor",a.floor+" dBm"],["Allotted assets",a.expected],
    ["In place",a.counts.inplace],["Misplaced",a.counts.misplaced],["Missing",a.counts.missing],["Unknown tags",a.counts.unknown],[]];
  rows.push(["result","asset_code","asset_name","epc","allotted_area","rssi"]);
  (a.rows||[]).forEach(function(r){ var as=r.assetId?asset(r.assetId):null;
    rows.push([r.b,as?as.code:"",as?as.name:"",r.epc,r.home?locName(r.home):(r.b==="missing"?locName(a.locationId):""),r.rssi!=null?r.rssi:""]); });
  if(d){
    rows.push([]); rows.push(["Change since previous audit",fmtDate(d.prev.endedAt)]);
    rows.push(["change","asset_code","asset_name","epc"]);
    var push=function(label,arr){ arr.forEach(function(r){ var as=r.assetId?asset(r.assetId):null;
      rows.push([label,as?as.code:"",as?as.name:"",r.epc]); }); };
    push("newly missing",d.newMissing); push("still missing",d.stillMissing); push("back in place",d.recovered);
    push("newly misplaced",d.newMisplaced); push("misplacement cleared",d.clearedMisplaced); push("new unknown tag",d.newUnknown);
  }
  offerFile("audit-"+locCode(a.locationId)+"-"+(a.endedAt||"").slice(0,10)+".csv", toCsv(rows));
}

  if(b.dataset.addphoto){
    var aid=b.dataset.addphoto, av=asset(aid); if(!av) return;

      var id=savePhoto(d,"asset",av.name+" ("+av.code+")");
      var n=clone(av); n.photoIds=(n.photoIds||[]).concat([id]).slice(-4); save("assets",n);
      closeModal(); toast("Photo added"); showTrail(aid);
    });

  }
  if(b.dataset.evphoto){
    pickPhoto(function(d){
      EVPHOTO=savePhoto(d,"writeoff","Write-off evidence");

      toast("Evidence photo attached");
    });

  }
  if(b.dataset.sortby){
    var sp=b.dataset.sortby.split(":"), gg=GRID[sp[0]];
    if(gg.sort===sp[1]) gg.dir = gg.dir==="asc"?"desc":"asc";

  /* Widening or narrowing the scope changes which rows exist, so the page
     number and the tick-boxes from the old slice have to go with it — a
     selection carried across would act on jobs no longer on screen. */

  if(b.dataset.preset!=null&&b.dataset.preset!==""){ setPreset(parseInt(b.dataset.preset,10)); GRID.reports.page=1; render(); return; }
  if(b.id==="tfClear"){ TF.q=""; TF.type="all"; TF.status="all"; TF.team="all"; TF.area="all"; TF.overdue=false; GRID.tasks.page=1; render(); return; }
  if(b.id==="repClear"){ REP.q=""; REP.area="all"; REP.from=""; REP.to=""; REP.exOnly=false; GRID.reports.page=1; render(); return; }
  if(b.id==="repEx"){ REP.exOnly=!REP.exOnly; GRID.reports.page=1; render(); return; }

  if(b.id==="bulkApply"){
    if(!can("task.assign")){ toast("Your role cannot reassign jobs"); return; }
    var tm=$("#bulkTeam").value, uid3=$("#bulkWho").value, u3=uid3?person(uid3):null, n=0;
    if(!tm&&!u3){ toast("Pick a team or a person first"); return; }
    Object.keys(TSEL).forEach(function(id){
      if(!TSEL[id]) return; var t=S.alerts[id]; if(!t||t.status==="closed") return;
      migrateTask(t);

      if(u3){ t.assigneeId=u3.id; t.assignee=u3.name; }

  }
  if(b.dataset.startloc){
    if(!can("audit")){ toast("Your role cannot run an audit"); return; }

    return;

  if(b.dataset.task){ showTask(b.dataset.task); return; }
  if(b.id==="tfOver"){ TF.overdue=!TF.overdue; render(); return; }
  if(b.id==="regRet"){ REG_RET=!REG_RET; render(); return; }
  if(b.dataset.status){
    var sa=asset(b.dataset.status); if(!sa) return;
    modal('<div class="panel-h"><h2>Asset status — '+esc(sa.name)+'</h2><span class="sub">'+esc(sa.code)+'</span>'+
      '<button class="btn sm" data-close>Close</button></div><div class="panel-b stack">'+
      '<div class="muted">Taking an asset off the books removes it from every area\'s expected count, so audits stop raising it as missing. It stays in the register with its history intact.</div>'+
      '<label class="fld"><span>Status</span><select id="stSel">'+
        ["active","at_repair","on_loan","in_transit","scrapped","written_off"].map(function(v){
          return '<option value="'+v+'"'+((sa.status||"active")===v?" selected":"")+'>'+esc(statusLabel(v))+'</option>';}).join("")+
      '</select></label>'+
      '<label class="fld"><span>Note</span><input type="text" id="stWhy" placeholder="Where it has gone, or the work order" value="'+esc(sa.statusNote||"")+'"></label>'+
      '<label class="fld"><span>Expected back (for repair, loan or transit)</span>'+
        '<input type="date" id="stBack" value="'+esc(sa.dueBack||"")+'"></label>'+
      '<div class="muted">An asset out for repair, on loan or in transit stays on the books and keeps depreciating, '+
      'but stops being counted as missing in its area. It is listed separately on the audit report, and an '+
      'overdue return is flagged.</div>'+
      '<div class="muted">Scrapping or writing off needs evidence and a second person\'s sign-off — choosing one opens the request form.</div>'+
      '<div class="btn-row"><button class="btn pri" id="stOk">Continue</button><button class="btn" data-close>Cancel</button></div></div>');
    $("#stOk").addEventListener("click",function(){
      var want=$("#stSel").value, note=$("#stWhy").value.trim();
      if(needsApproval(want)&&mod("approval")){
        EVNBV=String(nbvOf(sa)||"");
        evidenceForm("Write-off request",sa.name+" · "+sa.code,want,function(d){
          var exist=tasks().map(migrateTask).filter(function(x){return x.assetId===sa.id&&x.status!=="closed";})[0];
          if(!exist){
            var lo=loc(sa.home);
            exist={id:uid("TSK"),type:"retire",assetId:sa.id,epc:sa.epc,expectedLoc:sa.home,foundLoc:"",
              auditId:"",raisedAt:nowISO(),dueAt:new Date(Date.now()+slaDays("locate")*86400000).toISOString(),
              teamId:(lo&&lo.team)||"",assignee:d.by,priority:"normal",status:"open",resolution:"",remarks:"",
              closedAt:"",closedBy:"",verifiedBy:"",notifiedAt:"",
              history:[{at:nowISO(),who:d.by,what:"Write-off raised from the asset register"}]};
          }
          requestOffBooks(exist,d);
        });
        return;
      }
      var n=clone(sa);
      if(isRetired(sa)&&want==="active") addHistAsset(n,"Reinstated to the books"+(note?" — "+note:""));
      n.status=want; n.statusNote=note; n.statusAt=nowISO();
      var _bk=$("#stBack")? $("#stBack").value : "";
      n.dueBack = (OFFSITE.indexOf(want)>=0) ? _bk : "";
      if(OFFSITE.indexOf(want)>=0) addHistAsset(n,statusLabel(want)+(note?" — "+note:"")+(_bk?" · expected back "+_bk:""));
      save("assets",n);
      closeModal(); toast("Status updated"); render(); renderTabs();
    });
    return;
  }
  if(b.dataset.export){ exportData(b.dataset.export); return; }
  if(b.id==="reseed"){
    if(!confirm("Replace everything with the sample site?")) return;
    COLS.forEach(function(c){ list(c).forEach(function(o){ remove(c,o.id); }); });
    var d=buildDemo(); COLS.forEach(function(c){ S[c]=d[c]; if(DB) list(c).forEach(function(o){ save(c,o); }); });
    sweepClear(); AUD.active=false; AUD.shell=false; toast("Sample data reloaded"); renderTabs(); render(); return;
  }
  if(b.id==="wipe"){
    if(!can("*")){ toast("Only an administrator can empty the register"); return; }
    if(!confirm("Delete every location, asset, tag, audit and job?\n\nPeople and teams are kept, so you can still sign in. This cannot be undone.")) return;
    var keepPeople=list("people").map(clone), wasDemo=demoMode();
    COLS.forEach(function(c){ list(c).forEach(function(o){ remove(c,o.id); }); S[c]={}; });
    save("meta",{id:"config",org:"New site",floor:-70,power:24,dwellMs:400,
      slaLocate:7,slaReturn:3,slaIdentify:5,woLimit:25000,demo:wasDemo});
    DEMO_TEAMS.forEach(function(r){ save("teams",{id:r[0],code:r[1],name:r[2],lead:r[3],email:r[4]}); });
    /* The people roll survives the wipe. Without it nobody could sign in
       and the console would be unusable with no way back. */
    keepPeople.forEach(function(u){ save("people",u); });
    if(!person(ME)) ME="";
    sweepClear(); AUD.active=false; AUD.shell=false; toast("Register emptied \u2014 people kept"); renderTabs(); render(); return;
  }
});

function liveSearch(e,id,set){
  if(e.target.id!==id) return false;
  var pos=e.target.selectionStart; set(e.target.value); render();
  var el=$("#"+id); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(x){} }
  return true;
}

  if(liveSearch(e,"regq",function(v){ REG_Q=v; GRID.assets.page=1; })) return;
  if(liveSearch(e,"tfQ",function(v){ TF.q=v; GRID.tasks.page=1; })) return;

});

     rooms individually, so the floor select writes every room under it \u2014
     the per-room select below is there for the exceptions. */

  if(e.target.id==="tfType"){ TF.type=e.target.value; GRID.tasks.page=1; render(); }
