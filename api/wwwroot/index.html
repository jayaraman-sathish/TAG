function asOnDate(){
  var c=cfg();
  if(c.asOn) return new Date(c.asOn+"T23:59:59");
  return new Date();   /* today — see the note below */
  /* This used to return 31 March of the financial year in progress, which is
     a date in the future for most of the year, so the net block carried
     depreciation that had not been charged yet and every "value at risk"
     figure in an audit report was understated. Year-end reporting is what
     the "Register as on" date is for. */
}
function wdvRate(cost,residual,life){
  if(!cost||!life) return 0;
  var r=residual/cost; if(r<=0) r=0.0001;
  return 1-Math.pow(r,1/life);
}
/* Year-by-year schedule so the numbers can be shown, not just asserted. */
function depSchedule(a,asOn){
  var p=depParams(a), cost=Number(a.cost||0);
  var out={cost:cost,life:p.life,method:p.method,residual:0,rate:0,accum:0,nbv:cost,rows:[],ok:false};
  if(!cost||!p.life||!a.inUseDate) return out;
  var start=new Date(a.inUseDate+"T00:00:00");
  if(isNaN(start)) return out;
  var end=asOn||asOnDate();
  if(end<start) return out;
  out.residual=Math.round(cost*p.resPct/100);
  out.rate = p.method==="WDV"? wdvRate(cost,out.residual,p.life) : (1/p.life);
  var open=cost, accum=0, y0=fyOf(start), y1=fyOf(end);
  for(var y=y0;y<=y1;y++){
    var ps=Math.max(fyStart(y).getTime(), start.getTime());
    var pe=Math.min(fyEnd(y).getTime(), end.getTime());
    if(pe<=ps) continue;
    var days=Math.round((pe-ps)/DAY);
    var inYear=Math.round((fyEnd(y).getTime()-fyStart(y).getTime())/DAY);
    var full = p.method==="WDV" ? open*out.rate : (cost-out.residual)/p.life;
    var dep=full*(days/inYear);
    if(open-dep < out.residual) dep=Math.max(0,open-out.residual);
    out.rows.push({fy:fyLabel(y),days:days,opening:Math.round(open),dep:Math.round(dep),closing:Math.round(open-dep)});
    open-=dep; accum+=dep;
  }
  out.accum=Math.round(accum); out.nbv=Math.round(cost-accum); out.ok=true;
  return out;
}
function nbvOf(a,asOn){ var d=depSchedule(a,asOn); return d.ok? d.nbv : Number(a.cost||0); }
/* Income Tax block: WDV at the class rate, whole-year convention with the
   half-rate rule for assets used under 180 days in the year of purchase. */
function taxBlock(a,asOn){
  var p=depParams(a), cost=Number(a.cost||0);
  if(!cost||!p.itRate||!a.inUseDate) return null;
  var start=new Date(a.inUseDate+"T00:00:00"), end=asOn||asOnDate();
  if(isNaN(start)||end<start) return null;
  var wdv=cost, y0=fyOf(start), y1=fyOf(end), r=p.itRate/100;
  for(var y=y0;y<=y1;y++){
    var daysUsed=Math.round((Math.min(fyEnd(y).getTime(),end.getTime())-Math.max(fyStart(y).getTime(),start.getTime()))/DAY);
    var rate = (y===y0 && daysUsed<180) ? r/2 : r;
    wdv -= wdv*rate;
  }
  return {rate:p.itRate,wdv:Math.round(wdv),claimed:Math.round(cost-wdv)};
}
function inr(n){
  n=Math.round(Number(n)||0);
  return "₹"+n.toLocaleString("en-IN");
}
function inrShort(n){
  n=Number(n)||0;
  if(Math.abs(n)>=1e7) return "₹"+(n/1e7).toFixed(2)+" Cr";
  if(Math.abs(n)>=1e5) return "₹"+(n/1e5).toFixed(2)+" L";
  return inr(n);
}
/* Three states were not enough for a factory. A megger goes to the
   calibration lab for three weeks; a motor goes to the rewinding vendor for a
   month. Those assets are not missing and not scrapped — they are on the
   books, still depreciating, and legitimately not in the plant. Called
   missing they raise a job nobody can close and they land in the net-block
   figure CARO 3(i)(b) asks about, which is the number the auditor
   challenges first. Each carries an expected return date so that "out for
   repair" cannot quietly become a parking space. */
var OFFSITE=["at_repair","on_loan","in_transit"];
function isOffsite(a){ return !!a && OFFSITE.indexOf(a.status)>=0; }
function statusLabel(s){
  return s==="scrapped"?"Scrapped"
       : s==="written_off"?"Written off"
       : s==="at_repair"?"Out for repair"
       : s==="on_loan"?"On loan to another site"
       : s==="in_transit"?"In transit"
       : "Active"; }
function offsiteOverdue(a){
  if(!isOffsite(a) || !a.dueBack) return false;
  return new Date(a.dueBack+"T23:59:59") < new Date();
}

/* ============ THE SERVER ============
   A third backend, beside browser storage and the cloud document store.
   It presents the same shape the console already works against —
   DB.collection(c).get() and DB.collection(c).doc(id).set(body) — so
   nothing else in this file has to know where the records are kept.

   Why it exists: a twenty-thousand asset register is about 4.8 MB against
   a browser's ~5 MB ceiling, so a real register does not fit; and four
   handhelds each holding their own copy means whoever saves last wins,
   silently. Neither can be fixed in the browser, however good the code is.

   When the page is served from the API, the API is the server. Served from
   a file it is not, and the console falls back to browser storage as
   before — the same file still works on a laptop with nothing installed.
*/
var SERVER = (location.protocol==="http:"||location.protocol==="https:") ? "" : null;
var SERVER_DOWN=false;

function restBackend(){
  function req(path,opts){
    return fetch(SERVER+path, Object.assign({credentials:"same-origin"},opts||{}))
      .then(function(r){
        if(r.status===401){ var e=new Error("signed out"); e.signedOut=true; throw e; }
        return r.json().catch(function(){ return null; }).then(function(body){
          if(!r.ok){
            var m=(body&&(body.message||body.error))||("HTTP "+r.status);
            var err=new Error(m); err.status=r.status; err.body=body; throw err;
          }
          return body;
        });
      });
  }
  return {
    isServer:true,
    req:req,
    /* One request, not fourteen: the console loads every collection at boot
       and then reads from memory, and a handheld on plant wifi feels the
       difference. */
    loadAll:function(){ return req("/api/store"); },
    collection:function(name){
      return {
        get:function(){
          return req("/api/store/"+encodeURIComponent(name)).then(function(rows){
            return { docs:(rows||[]).map(function(o){
              return { id:o.id, data:function(){ return o; } }; }) };
          });
        },
        doc:function(id){
          return {
            set:function(body){
              return req("/api/store/"+encodeURIComponent(name)+"/"+encodeURIComponent(id),
                { method:"PUT", headers:{"Content-Type":"application/json"},
                  body:JSON.stringify(body) });
            },
            delete:function(){
              return req("/api/store/"+encodeURIComponent(name)+"/"+encodeURIComponent(id),
                { method:"DELETE" });
            }
          };
        }
      };
    }
  };
}

/* A write that fails must not look like a write that worked. The console
   updates its own copy first so the screen stays responsive, which means a
   rejected write leaves the screen disagreeing with the register until it
   is reloaded — so say so, loudly, rather than letting somebody carry on
   believing a cost correction was saved. */
/* Pull one collection back from the server and replace this console's copy of
   it. Used after a stale write: the rest of the register is fine, so reloading
   everything would be a heavy answer to a small, ordinary event. */
function refreshCollection(col){
  if(!DB || !DB.isServer || !col) return Promise.resolve(false);
  return DB.collection(col).get().then(function(snap){
    S[col]={};
    (snap.docs||[]).forEach(function(d){ var o=d.data(); if(o&&o.id) S[col][o.id]=o; });
    if(col==="assets") epcIndexDrop();
    shadowSync();
    try{ renderTabs(); render(); }catch(x){}
    return true;
  }).catch(function(){ return false; });
}

/* The register answering "no" is not the register being down. Those were one
   state, so a single refused write branded the header SERVER REFUSED until
   somebody reloaded the page - and the commonest refusal of all, two tabs open
   on the same record, is not a fault at all. */
function serverWriteOk(){
  if(!SERVER_DOWN) return;
  SERVER_DOWN=false; SERVER_ERR="";
  try{ paintReadout(); }catch(x){}
}

function serverWriteFailed(e, col, id){
  if(e && e.signedOut){
    toast("Signed out - sign in again to keep working");
    ME=""; renderTabs(); render();
    return;
  }
  /* 409: somebody else - another person, or this person in a second tab -
     changed that record first. Nothing was saved, nothing is broken, and the
     right move is to take their version and say so. */
  if(e && e.status===409){
    toast("Somebody else changed that first - taking their version");
    if(col) refreshCollection(col);
    return;
  }
  SERVER_DOWN=true; SERVER_ERR=(e&&e.message)||"";
  try{ paintReadout(); }catch(x){}
  toast("The register refused that: "+(e&&e.message?e.message:"unknown error"));
}

/* Pulls every collection in one request. The console reads from memory
   afterwards, so this is the only moment the whole register crosses the wire
   — one call beats fourteen on plant wifi. */
async function loadFromServer(){
  var all=await DB.loadAll();
  COLS.forEach(function(c){ S[c]={}; });
  Object.keys(all.collections||{}).forEach(function(c){
    (all.collections[c]||[]).forEach(function(o){ if(o&&o.id) S[c][o.id]=o; });
  });
  SERVER_SITE=all.siteId||SERVER_SITE;
  /* loadAll() replaces every collection, meta included, so the site name set
     at boot is gone by the time we get here. Hard-coding "Site" is what put
     the word Site in the header of a console that knew perfectly well it was
     looking at Plant A. */
  if(!S.meta.config) S.meta.config={id:"config",org:SERVER_SITE_NAME||"Site"};
  epcIndexDrop();
  try{ shadowSync(); }catch(e){}
}

async function boot(){
  /* Served from the API: it is the store. */
  if(SERVER!==null){
    try{
      var probe=await fetch("/api/health",{credentials:"same-origin"});
      if(probe.ok){
        DB=restBackend();
        var who=await fetch("/api/me",{credentials:"same-origin"});
        if(who.ok){
          var m=await who.json();
          SERVER_ME=m;
        }
      } else { DB=null; SERVER_ERR="/api/health returned "+probe.status; }
    }catch(e){ DB=null; SERVER_ERR=(e&&e.message)||String(e); }
  }
  /* Chicken and egg: the sign-in screen is drawn from the list of people, and
     the register is only readable once somebody has signed in. So boot loads
     just enough to draw the sign-in screen, and the register follows after.
     Loading everything first is what produced a 401 and sent the whole thing
     down the "server unreachable" path. */
  if(DB && DB.isServer){
    try{
      var sites=await DB.req("/api/sites");
      if(!sites || !sites.length) throw new Error("the database holds no site yet \u2014 run db/003_seed.sql");
      SERVER_SITE=sites[0].id;
      SERVER_SITE_NAME=sites[0].name||"";
      if(!S.meta.config) S.meta.config={id:"config",org:SERVER_SITE_NAME};

      if(SERVER_ME && SERVER_ME.personId){
        await loadFromServer();                 /* already signed in */
      } else {
        /* Names and roles only. The PIN is still what authenticates, and the
           database is still where it is checked. */
        var ppl=await DB.req("/api/sites/"+SERVER_SITE+"/people");
        S.people={};
        (ppl||[]).forEach(function(p){
          S.people[p.id]={ id:p.id, empCode:p.emp_code, name:p.name, role:p.role,
                           teamId:p.team_id||"", hasPin:p.has_pin, active:true };
        });
      }
    }catch(e){ DB=null; SERVER_ERR=(e&&e.message)||String(e);
               toast("Could not reach the register: "+SERVER_ERR); }
  }
  /* Reaching here with SERVER set means the page was served by the API but
     the API did not answer. That must not quietly become a local demo: the
     screen would show a plausible plant that exists nowhere, and anything
     typed into it would be lost on reload. Say so, in the way hardest to
     miss, and do not seed anything. */
  if(!DB && SERVER!==null) SERVER_FAILED=true;
  if(!DB){ try{ if(window.claude && claude.use) DB=await claude.use("db"); }catch(e){ DB=null; } }
  if(DB && !DB.isServer){
    try{
      var snaps=await Promise.all(COLS.map(function(c){ return DB.collection(c).get(); }));
      COLS.forEach(function(c,i){ snaps[i].docs.forEach(function(d){ var v=d.data(); if(v) S[c][d.id]=clone(v); }); });
      epcIndexDrop();
    }catch(e){ DB=null; }
  }
  if(!DB){
    try{ localStorage.setItem("tagtrail_probe","1"); localStorage.removeItem("tagtrail_probe"); LS=true; }catch(e){ LS=false; }
    if(LS && !SERVER_FAILED){ COLS.forEach(function(c){ S[c]=lsLoad(c); }); epcIndexDrop(); }
  }
  /* The sample site is laid down once, on a store that has never been
     written to. After that the store is the client's: emptying the register
     stays empty across a reload, and deleted people do not come back. */
  /* Against the server the register is the client's, seeded there. Laying
     the sample site over it because this browser has not seen a config
     record would overwrite a real plant with a demo. */
  if(!S.meta.config && !(DB && DB.isServer) && !SERVER_FAILED){
    var d=buildDemo();
    COLS.forEach(function(c){ S[c]=d[c]; });
    epcIndexDrop();
    if(DB) COLS.forEach(function(c){ list(c).forEach(function(o){ save(c,o); }); });
    else if(LS) COLS.forEach(lsSave);
  }
  /* bring a store written by an earlier version up to date */
  /* Starter teams are generic and useful; their sample leads and inboxes
     are not, so a store that is not the demonstration build gets the teams
     with the contact left for the client to fill in. */
  if(!list("teams").length){
    var dm0=demoMode();
    DEMO_TEAMS.forEach(function(r){ save("teams",{id:r[0],code:r[1],name:r[2],lead:dm0?r[3]:"",email:dm0?r[4]:""}); });
  }
  if(!list("classes").length)
    DEMO_CLASSES.forEach(function(r){ save("classes",{id:r[0],code:r[1],name:r[2],life:r[3],method:r[4],residualPct:5,itRate:r[5],deptTeamId:r[6]||""}); });
  /* A store from before people existed gets the sample roll, but only while
     it is still a demonstration build. A live site with no people asks for
     its first administrator instead. */
  if(!list("people").length && demoMode())
    DEMO_PEOPLE.forEach(function(r){ save("people",{id:r[0],empCode:r[1],name:r[2],role:r[3],teamId:r[4],pin:r[5],active:true}); });
  var saved=localStorage_get("me");
  if(saved && person(saved)) ME=saved;
  var ft=list("teams")[0];
  list("locations").forEach(function(l){ if(!l.team&&ft){ l.team=ft.id; save("locations",l); } });
  tasks().forEach(function(t){ var b4=JSON.stringify(t); migrateTask(t); if(JSON.stringify(t)!==b4) save("alerts",t); });

  /* Boot is done: take the baseline the change log diffs against, and start
     recording. Everything written from here is somebody's decision. */
  shadowSync(); LOG_OFF=false;

  /* This browser may remember who was signed in while the server's session
     has since expired. Believing the local half would put somebody on a
     console whose every request is refused, so the server's answer wins. */
  if(DB && DB.isServer && ME && !(SERVER_ME && SERVER_ME.personId)){
    ME=""; localStorage_set("me","");
  }

  paintReadout(); renderTabs();
  if(SERVER_FAILED){
    document.body.insertAdjacentHTML("afterbegin",
      '<div style="background:#B52A2A;color:#fff;padding:12px 16px;font:600 14px system-ui;'+
      'position:sticky;top:0;z-index:999">'+
      'The register could not be reached. Nothing you do here will be saved.'+
      '<div style="font-weight:400;font-size:12.5px;margin-top:4px">'+
      'This page was served by the API, so the API is where the data lives \u2014 but it did not '+
      'answer. Check the service is running, then reload. Details: '+esc(SERVER_ERR||"no response")+
      '</div></div>');
  }
  if(me()) go(localStorage_get("tab")||"dash"); else render();
}
function localStorage_get(k){ try{ return localStorage.getItem("rfid_"+k); }catch(e){ return null; } }
function localStorage_set(k,v){ try{ localStorage.setItem("rfid_"+k,v); }catch(e){} }

/* ============ derived ============ */
function taggedCount(){ return list("assets").filter(function(a){return !!a.epc;}).length; }

/* ============ chrome paint ============ */
/* The header says what matters right now: reader telemetry mid-scan,
   plain site status the rest of the time. */
/* ===== Reader bridge =====
   The IH40/IH45 speak through Honeywell's Android SDK, not a keyboard wedge,
   so a host app feeds this page. Two ways in, both landing on bridgeFeed():
     1. Android WebView  -> window.TagTrail.feed([...])  via evaluateJavascript
     2. Desktop/handheld -> a WebSocket the page connects to
   Nothing below knows which reader model produced the tags. */
var BRIDGE={host:"",connected:false,ws:null,url:"",lastAt:0,total:0,battery:null,error:""};

function normEpc(e){ return String(e==null?"":e).toUpperCase().replace(/[^A-Z0-9]/g,""); }

function bridgeFeed(tags,source){
  /* While the reader check is armed, tags go there instead \u2014 so a host app
     can prove itself without a sweep being open. */
  if(RCHK.on && !AUD.active){
    var a0=Array.isArray(tags)? tags : (tags?[tags]:[]), k=0;
    a0.forEach(function(t){
      if(typeof t==="string"){ if(rchkAdd(t,null,source||"host app")) k++; }
      else if(t&&typeof t==="object"){
        if(rchkAdd(t.epc||t.EPC||t.epcHex||t.tagId||"", t.rssi, source||"host app")) k++;
      }
    });
    return {ok:true,mode:"reader_check",accepted:k};
  }
  if(!AUD.active){
    /* Point at the door tag and go.
       Every area can carry an anchor tag on its door frame. With no sweep open,
       a read that matches one opens that area instead of being refused, which is
       the whole of the scanner's interface: walk in, point, pull the trigger.
       Nothing to choose and nothing to type, which matters when the person
       holding the reader is a contractor who was handed it this morning. */
    var _anchor=null;
    (Array.isArray(tags)? tags : (tags?[tags]:[])).forEach(function(t){
      if(_anchor) return;
      var e=normEpc(typeof t==="string"? t : (t&&(t.epc||t.EPC||t.epcHex||t.tagId))||"");
      if(!e) return;
      var hit=list("locations").filter(function(x){ return !!x.anchor && normEpc(x.anchor)===e; })[0];
      if(hit) _anchor=hit;
    });
    if(_anchor){
      /* Without this the reader happily counted a room behind the sign-in
         screen: the header filled with tags while the operator saw a list of
         names, and the sweep belonged to nobody. A verification of record has
         to have a person attached to it, so the door tag waits for one. */
      if(!ME){
        toast("Sign in on the reader first, then point at the door tag");
        return {ok:false,reason:"not_signed_in",
                message:"Nobody is signed in on this reader."};
      }
      startAudit(_anchor.id, BRIDGE.host||source||"");
      if(VIEW!=="audit") go("audit"); else render();
      toast("Counting "+_anchor.name+" — sweep the room");
      return {ok:true,started:_anchor.name,areaCode:_anchor.code};
    }
    return {ok:false,reason:"no_audit",message:"Point at the door tag of the room, or start an audit on the console."};
  }
  var arr = Array.isArray(tags)? tags : (tags?[tags]:[]);
  var n=0, dup=0;
  arr.forEach(function(t){
    var epc,rssi=null,cnt=0;
    if(typeof t==="string"){ epc=normEpc(t); }
    else if(t&&typeof t==="object"){
      epc=normEpc(t.epc||t.EPC||t.epcHex||t.tagId||"");
      if(t.rssi!=null) rssi=Number(t.rssi);
      if(t.count!=null) cnt=Number(t.count);
      else if(t.readCount!=null) cnt=Number(t.readCount);
    }
    if(!epc||epc.length<4) return;
    var had=!!AUD.reads[epc];
    if(addRead(epc,rssi)){ if(had) dup++; else n++;
      if(cnt>1&&AUD.reads[epc]&&AUD.reads[epc].count<cnt) AUD.reads[epc].count=cnt; }
  });
  BRIDGE.total+=arr.length; BRIDGE.lastAt=Date.now(); BRIDGE.connected=true;
  if(source&&!BRIDGE.host) BRIDGE.host=source;
  if(VIEW==="audit"&&AUD.shell) paintAudit();
  paintReadout();
  return {ok:true,accepted:n,repeats:dup,unique:Object.keys(AUD.reads).length};
}

/* ===== Page to host =====
   The console has to be able to tell the handheld things: which area is being
   audited, what antenna power to use, when to stop. Three transports, tried in
   order — a JavaScript channel injected by the WebView (Flutter's
   addJavaScriptChannel and Android's @JavascriptInterface both land here), a
   callback the host registered, or the open WebSocket. If none exist the event
   is dropped, which is correct: a browser with no reader has nobody to tell. */
var HOSTCB=null, API_VERSION="1.1";
function hostEvent(type,data){
  var evt={type:type,at:nowISO(),data:data||{}};
  var payload;
  try{ payload=JSON.stringify(evt); }catch(e){ return false; }
  var sent=false;
  try{ if(window.TagTrailHost&&typeof window.TagTrailHost.postMessage==="function"){
    window.TagTrailHost.postMessage(payload); sent=true; } }catch(e){}
  try{ if(typeof HOSTCB==="function"){ HOSTCB(evt); sent=true; } }catch(e){}
  try{ if(BRIDGE.ws&&BRIDGE.ws.readyState===1){ BRIDGE.ws.send(payload); sent=true; } }catch(e){}
  return sent;
}
/* The reader profile the handheld should apply for this sweep. */
function readerProfile(){
  var c=cfg();
  return {power:Number(c.power||24), floor:Number(c.floor||-70), dwellMs:Number(c.dwellMs||400),
          region:c.region||"India"};
}

/* The contract a host app codes against. Keep these names stable. */
window.TagTrail={
  version:API_VERSION,
  feed:function(tags){ return bridgeFeed(tags,BRIDGE.host||"host app"); },
  hello:function(info){
    info=info||{};
    BRIDGE.host=info.device||info.name||"host app";
    BRIDGE.connected=true; BRIDGE.error="";
    if(info.battery!=null) BRIDGE.battery=Number(info.battery);
    paintReadout(); if(VIEW==="data") render();
    toast(BRIDGE.host+" connected");
    return {ok:true,app:"TagTrail",version:API_VERSION};
  },
  bye:function(){ BRIDGE.connected=false; paintReadout(); if(VIEW==="data") render(); return {ok:true}; },
  auditActive:function(){ return !!AUD.active; },
  context:function(){
    if(!AUD.active) return null;
    return {area:locName(AUD.locationId),areaCode:locCode(AUD.locationId),
            expected:expectedCount(),unique:Object.keys(AUD.reads).length,floor:cfg().floor};
  },
  areas:function(){ return list("locations").map(function(l){
      return {id:l.id,code:l.code,name:l.name,anchor:l.anchor||""}; }); },
  /* Register a callback to receive audit_started, audit_finished,
     audit_cancelled and settings events. Returns the current profile so a
     host that connects mid-audit is not left guessing. */
  onEvent:function(cb){
    HOSTCB=(typeof cb==="function")? cb : null;
    return {ok:true,active:!!AUD.active,
            profile:readerProfile(),
            context:AUD.active? window.TagTrail.context() : null};
  },
  profile:function(){ return readerProfile(); },
  /* Like hello(), but silent. A handheld reports its battery every couple of
     minutes and hello() would toast "connected" each time. */
  status:function(info){
    info=info||{};
    if(info.device&&!BRIDGE.host) BRIDGE.host=info.device;
    if(info.battery!=null) BRIDGE.battery=Number(info.battery);
    BRIDGE.connected=true; BRIDGE.error="";
    paintReadout(); if(VIEW==="data") render();
    return {ok:true};
  },
  /* A barcode or QR read, as opposed to a tag. The Zebra's imager and its RFID
     radio are the same trigger on the same device, so both arrive here; this one
     goes into whichever field is waiting for something to be scanned, and the
     existing submit handlers work out whether it is an asset code, a tag or a
     search. tagFind comes first because a barcode is nearly always an asset
     label, and tagFind already redirects a tag that lands in it by mistake. */
  barcode:function(text){
    var t=String(text==null?"":text).trim();
    if(!t) return {ok:false,reason:"empty"};
    var ids=["tagFind","verFixCode","runFind","verEpc","runEpc","tagEpc"];
    var el=document.activeElement, target=null;
    if(el&&el.tagName==="INPUT"&&!el.disabled&&ids.indexOf(el.id)>=0) target=el;
    if(!target){ for(var i=0;i<ids.length;i++){
      var c=document.getElementById(ids[i]); if(c&&!c.disabled){ target=c; break; } } }
    if(!target){ toast("Scanned "+t+" — nothing on this screen is waiting for it");
      return {ok:false,reason:"no_field"}; }
    target.value=t;
    var f=target.form;
    if(f){
      if(typeof f.requestSubmit==="function") f.requestSubmit();
      else f.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
    } else {
      target.dispatchEvent(new Event("input",{bubbles:true}));
    }
    return {ok:true,field:target.id};
  },
  startAudit:function(areaCodeOrId,operator){
    var key=String(areaCodeOrId||"").toUpperCase();
    var l=list("locations").filter(function(x){
      return x.id===areaCodeOrId||x.code.toUpperCase()===key||(x.anchor||"").toUpperCase()===normEpc(key);})[0];
    if(!l) return {ok:false,reason:"unknown_area"};
    startAudit(l.id,operator||BRIDGE.host||"");
    if(VIEW!=="audit") go("audit");
    return {ok:true,area:l.name};
  },
  finishAudit:function(){
    if(!AUD.active) return {ok:false,reason:"no_audit"};
    commitAudit(); return {ok:true};
  }
};

function bridgeConnect(url){
  bridgeDisconnect();
  BRIDGE.url=url; BRIDGE.error="";
  try{ BRIDGE.ws=new WebSocket(url); }
  catch(e){ BRIDGE.error="That address could not be opened."; render(); return; }
  BRIDGE.ws.onopen=function(){
    BRIDGE.connected=true; BRIDGE.host=BRIDGE.host||"WebSocket bridge"; BRIDGE.error="";
    try{ BRIDGE.ws.send(JSON.stringify({type:"hello",app:"TagTrail",version:API_VERSION})); }catch(e){}
    toast("Reader bridge connected"); paintReadout(); if(VIEW==="data") render();
  };
  BRIDGE.ws.onmessage=function(ev){
    var m; try{ m=JSON.parse(ev.data); }catch(e){ bridgeFeed(String(ev.data).split(/[\s,;]+/),"WebSocket"); return; }
    if(!m) return;
    if(m.type==="tags"||m.tags) bridgeFeed(m.tags||m.data,"WebSocket");
    else if(m.type==="hello") window.TagTrail.hello(m);
    else if(m.type==="status"){ if(m.battery!=null) BRIDGE.battery=Number(m.battery); paintReadout(); }
    else if(m.epc) bridgeFeed([m],"WebSocket");
  };
  BRIDGE.ws.onerror=function(){ BRIDGE.error="Could not reach "+url+". Is the bridge running?"; if(VIEW==="data") render(); };
  BRIDGE.ws.onclose=function(){ BRIDGE.connected=false; BRIDGE.ws=null; paintReadout(); if(VIEW==="data") render();
    /* Mid-sweep this is the difference between a real count and a page of
       phantom discrepancies, so it is said out loud, not just shown. */
    if(AUD.active){ toast("Reader connection lost \u2014 stop scanning. Reads so far are saved."); } };
}
function bridgeDisconnect(){
  if(BRIDGE.ws){ try{ BRIDGE.ws.close(); }catch(e){} }
  BRIDGE.ws=null; BRIDGE.connected=false; paintReadout();
}

function paintReadout(){
  var el=$("#readout"); if(!el) return;
  if(AUD.active){
    /* A reader that has died used to show the same green dot and the word
       "Ready", which reads as healthy. The operator then walks the bay,
       reads nothing, and commits a sweep full of phantom discrepancies.
       The header has to be able to say that nothing is listening. */
    var _bridged = BRIDGE.ws || BRIDGE.host;
    var _stale = BRIDGE.connected && BRIDGE.lastAt && (Date.now()-BRIDGE.lastAt > 60000)
                 && Object.keys(AUD.reads).length>0;
    var _state = !_bridged        ? {t:"Typed in", c:"", p:"on"}
               : !BRIDGE.connected ? {t:"READER LOST", c:"warn", p:"off"}
               : _stale            ? {t:"No tags for "+Math.round((Date.now()-BRIDGE.lastAt)/1000)+"s", c:"warn", p:"off"}
               :                     {t:(BRIDGE.host||"Reader"), c:"", p:"on"};
    var _batt = (BRIDGE.connected && BRIDGE.battery!=null) ? BRIDGE.battery : null;
    el.innerHTML =
      '<div><dt>Scanner</dt><dd class="live '+_state.c+'"><span class="pulse '+_state.p+'"></span>'+
        esc(_state.t)+'</dd></div>'+
      '<div><dt>Tags read</dt><dd'+(SWEEP_UNSAFE?' class="warn"':'')+'>'+Object.keys(AUD.reads).length+
        (SWEEP_UNSAFE?' · not saved':'')+'</dd></div>'+
      (_batt!=null
        ? '<div><dt>Battery</dt><dd'+(_batt<=20?' class="warn"':'')+'>'+_batt+'%</dd></div>'
        : '<div><dt>Signal filter</dt><dd>'+cfg().floor+' dBm</dd></div>')+
      '<div><dt>Area</dt><dd>'+esc(locCode(AUD.locationId))+'</dd></div>';
    return;
  }
  var od=openTasks().map(migrateTask).filter(isOverdue).length;
  var last=list("audits").sort(function(a,b){return (b.endedAt||"").localeCompare(a.endedAt||"");})[0];
  var su = DB? null : storageUse();
  /* Order matters here and used not to. "DB ?" caught the server case first,
     so the Server and SERVER REFUSED arms below it could never be reached and
     a database-backed console reported itself as "Shared" \u2014 the label for the
     old shared-file store. Worse, a server that had started refusing writes
     still read as normal. The most specific case goes first. */
  var store = (DB&&DB.isServer) ? (READONLY? "View only" : SERVER_DOWN? "SERVER REFUSED" : "Server")
            : DB ? (READONLY?"View only":"Shared")
            : STORAGE_FULL ? "FULL \u2014 not saving"
            : SERVER_FAILED ? "NO STORE \u2014 demo only"
            : (LS? ("This computer"+(su&&su.pct>=70? " \u00b7 "+su.pct+"%":"")) : "Not saved");

    '<div><dt>Site</dt><dd>'+esc((cfg().org||"Site").slice(0,22))+'</dd></div>'+
    '<div><dt>Open tasks</dt><dd class="'+(od?"warn":"")+'">'+openTasks().length+(od?' · '+od+' late':'')+'</dd></div>'+
    '<div><dt>Last audit</dt><dd>'+(last?esc(ago(last.endedAt))+' ago':'none yet')+'</dd></div>'+
    '<div><dt>'+(BRIDGE.connected?'Reader':'Data')+'</dt><dd'+
      ((!BRIDGE.connected&&(STORAGE_FULL||(su&&su.pct>=70)))?' class="warn"':'')+'>'+
      esc(BRIDGE.connected? (BRIDGE.host||"connected")+(BRIDGE.battery!=null?" "+BRIDGE.battery+"%":"") : store)+'</dd></div>';
  paintUser();
}

/* ===== Photo evidence =====
   A plain file input with capture="environment" opens the rear camera on a
   phone or tablet and the file picker on a desktop — no library, no plugin.
   Every shot is scaled down and re-encoded before it is stored. */
function pickPhoto(cb){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.setAttribute("capture","environment");
  inp.style.display="none"; document.body.appendChild(inp);
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0];
    inp.remove();
    if(!f) return;
    shrinkImage(f,900,0.58,function(dataUrl,kb){
      if(!dataUrl){ toast("Could not read that image"); return; }
      cb(dataUrl,kb);
    });
  });
  inp.click();
}
function shrinkImage(file,max,q,cb){
  var url,img=new Image();
  try{ url=URL.createObjectURL(file); }catch(e){ cb(null); return; }
  img.onload=function(){
    try{
      var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      var sc=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
      var x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,0,0,c.width,c.height);
      var d=c.toDataURL("image/jpeg",q);
      URL.revokeObjectURL(url);
      cb(d,Math.round(d.length*0.75/1024));
    }catch(e){ try{URL.revokeObjectURL(url);}catch(x){} cb(null); }
  };
  img.onerror=function(){ try{URL.revokeObjectURL(url);}catch(x){} cb(null); };
  img.src=url;
}

/* Measured, not assumed: the header's height drives where the tab bar sticks.
   A ResizeObserver catches a window resize, a wrapping header, a font that
   loads late and the on-screen keyboard opening on a phone \u2014 all of which
   change that height after load. */
function syncStickyOffsets(){
  var tb=document.querySelector(".topbar"); if(!tb) return;
  var h=Math.round(tb.getBoundingClientRect().height);
  if(h>0) document.documentElement.style.setProperty("--topbar-h", h+"px");
}

  var start=function(){
    var tb=document.querySelector(".topbar"); if(!tb){ setTimeout(start,200); return; }
    syncStickyOffsets();
    if(window.ResizeObserver){ new ResizeObserver(syncStickyOffsets).observe(tb); }
    else { window.addEventListener("resize", syncStickyOffsets); }
  };
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start);
  else start();
})();

/* ============ DASHBOARD ============ */
/* The date a sweep belongs to, in the reader's own timezone. */
function dayKey(iso){
  if(!iso) return "";
  var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10);
  var mm=String(d.getMonth()+1), dd=String(d.getDate());
  return d.getFullYear()+"-"+(mm.length<2?"0":"")+mm+"-"+(dd.length<2?"0":"")+dd;
}
function fmtDay(iso){ if(!iso) return "—"; var d=new Date(iso+(iso.length===10?"T00:00:00":""));
  return isNaN(d)? "—" : d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}); }
function fmtDate(iso){ if(!iso) return "—"; var d=new Date(iso); if(isNaN(d)) return "—";
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
function ago(iso){ if(!iso) return "—"; var s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<3600) return Math.max(1,Math.round(s/60))+"m"; if(s<86400) return Math.round(s/3600)+"h"; return Math.round(s/86400)+"d"; }

function viewDash(){

  var oa=openTasks().map(migrateTask), tagged=taggedCount();

function tile(k,v,f,alarm,act){
  var body='<div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div><div class="f">'+esc(f)+'</div>';

function alertChip(t){
  if(t==="misplaced") return '<span class="chip warn">Misplaced</span>';
  if(t==="missing") return '<span class="chip crit">Missing</span>';
  if(t==="unknown") return '<span class="chip unk">Unknown tag</span>';
  if(t==="away") return '<span class="chip mute">Mobile</span>';
  if(t==="retired") return '<span class="chip mute">Replaced tag</span>';
  if(t==="eyeballed") return '<span class="chip warn">Seen, tag unreadable</span>';
  if(t==="offsite") return '<span class="chip mute">Away from plant</span>';
  if(t==="inplace") return '<span class="chip ok">In place</span>';
  return '<span class="chip mute">'+esc(t)+'</span>';
}

/* ============ ASSET CLASSES ============
   Depreciation needs three things from the register: what the asset cost,
   the date it was put to use, and which class it belongs to. The class is
   where the accounting policy lives — useful life under Schedule II, the
   method, the residual percentage, and the Income Tax block rate. Without
   a class editor those values could only ever come from seeded data, which
   is no use to a client loading their own register.
*/
var DEP_METHODS=[["SLM","Straight line"],["WDV","Written down value"]];

function classOpts(sel,blank){
  var cs=list("classes").sort(function(a,b){return String(a.code).localeCompare(String(b.code));});
  return '<option value="">'+(blank||"— no class —")+'</option>'+
    cs.map(function(c){ return '<option value="'+esc(c.id)+'"'+(sel===c.id?" selected":"")+'>'+
      esc(c.code)+' — '+esc(c.name)+'</option>'; }).join("");
}

/* ---- Master data, corrected in place -------------------------------------
   Teams, areas and people could be added and removed but never edited. On a
   register that is not a small gap: an area with a mistyped code cannot be
   deleted once assets are allotted to it — and rightly so, an asset with no

   dialogues close that off. Each one writes the whole record back through
   save(), so the change log picks it up field by field, and the stale-write

/* ===== Tag stock =====
   Blank tags are bought in batches and handed to a team to apply. The ledger
   answers the question finance and audit both ask: how many were bought, who
   holds them, how many made it onto an asset, and where are the rest. */
/* Tags arrive pre-encoded in a sequential EPC range, so stock can be tracked
   by serial rather than by count. Ranges are compared as big integers. */
function epcHex(e){ return String(e==null?"":e).toUpperCase().replace(/[^0-9A-F]/g,""); }
function epcNum(e){ var h=epcHex(e); if(!h) return null; try{ return BigInt("0x"+h); }catch(x){ return null; } }
function epcAdd(e,n){
  var v=epcNum(e); if(v==null) return "";
  var width=epcHex(e).length, hx=(v+BigInt(n)).toString(16).toUpperCase();
  while(hx.length<width) hx="0"+hx;
  return hx;
}
function epcSpan(a,b){ var x=epcNum(a),y=epcNum(b); if(x==null||y==null) return 0; return Number(y-x)+1; }
function inRange(e,a,b){ var v=epcNum(e),x=epcNum(a),y=epcNum(b); if(v==null||x==null||y==null) return false; return v>=x&&v<=y; }
function shortEpc(e){ e=epcHex(e); return e.length>10? "…"+e.slice(-8) : e; }
function rangeLabel(a,b){ return a&&b? shortEpc(a)+" – "+shortEpc(b) : ""; }
/* The next unissued serial in a batch. */
function nextSerial(batch){
  if(!batch||!batch.epcFrom) return "";
  var n=issues().filter(function(i){return i.batchId===batch.id;})
                .reduce(function(t,i){return t+Number(i.qty||0);},0);
  return epcAdd(batch.epcFrom,n);
}
function batches(){ return list("tagbatches").sort(function(a,b){return (b.receivedAt||"").localeCompare(a.receivedAt||"");}); }
function issues(){ return list("tagissues").sort(function(a,b){return (b.at||"").localeCompare(a.at||"");}); }
function issuedFrom(batchId){ return issues().filter(function(i){return i.batchId===batchId;}).reduce(function(n,i){return n+Number(i.qty||0);},0); }
/* A tag counts as used when an asset carries it and the same team applied it. */
function usedByTeam(teamId,since){
  return list("assets").filter(function(a){
    return a.epc && a.taggedTeam===teamId && (!since || (a.taggedAt||"")>=since);
  }).length;
}
function usedFromIssue(iss){
  /* Serial ranges give an exact answer: which of these tags reached an asset. */
  if(iss.epcFrom&&iss.epcTo){
    return list("assets").filter(function(a){ return a.epc && inRange(a.epc,iss.epcFrom,iss.epcTo); }).length;
  }
  /* No range on file: fall back to counting what the team applied after the issue. */
  var later=issues().filter(function(x){ return x.teamId===iss.teamId && (x.at||"")>(iss.at||""); });
  var cut=later.length? later[later.length-1].at : "";
  var used=list("assets").filter(function(a){
    return a.epc && a.taggedTeam===iss.teamId && (a.taggedAt||"")>=(iss.at||"") && (!cut || (a.taggedAt||"")<cut);
  }).length;
  return Math.min(used, Number(iss.qty||0));
}
/* Which issue a given tag came from — the question a bare count cannot answer. */
function issueOfEpc(epc){
  return issues().filter(function(i){ return i.epcFrom&&i.epcTo&&inRange(epc,i.epcFrom,i.epcTo); })[0]||null;
}
function batchOfEpc(epc){
  return batches().filter(function(b){ return b.epcFrom&&b.epcTo&&inRange(epc,b.epcFrom,b.epcTo); })[0]||null;
}
/* Tags taken off the roll and stuck on an asset without ever being issued. */
function unissuedApplied(){
  return list("assets").filter(function(a){
    return a.epc && batchOfEpc(a.epc) && !issueOfEpc(a.epc);
  });
}
/* Serials issued to a team that have not reached an asset. */
function unusedSerials(iss,limit){
  if(!iss.epcFrom||!iss.epcTo) return [];
  var out=[], q=Math.min(Number(iss.qty||0), 2000);
  for(var k=0;k<q;k++){
    var e=epcAdd(iss.epcFrom,k);
    if(!assetByEpc(e)) out.push(e);
    if(limit&&out.length>=limit) break;
  }
  return out;
}
function stockTotals(){
  var recv=batches().reduce(function(n,b){return n+Number(b.qty||0);},0);
  var iss=issues().reduce(function(n,i){return n+Number(i.qty||0);},0);
  var used=issues().reduce(function(n,i){return n+usedFromIssue(i);},0);
  return {received:recv, issued:iss, inStore:recv-iss, withTeams:iss-used, used:used};
}

function tagStockPanel(){
  var t=stockTotals();
  var h='<div class="note"><b>Tag stock.</b> Tags are bought in batches and handed to a team to go and apply. '+

/* ============ TAG VERIFICATION ============
   An audit proves a tag was in a room. It cannot prove the tag is on the
   right object — two assets in the same bay can have their tags swapped and
   every sweep comes back clean. This mode is the only thing that tests
   identity rather than presence: read one tag, the screen says what the
   register thinks it is, and the operator agrees or corrects it against the
   item in their hands.

   A flag does not just record a problem. The mapping is wrong, so the fix is
   to re-map, and that happens here while the operator is still standing in
   front of the asset. */
var VER={checked:0, ok:0, bad:0, log:[], pending:"", fixing:false};

function verifyReset(){ VER={checked:0, ok:0, bad:0, log:[], pending:"", fixing:false}; }

function tagVerifyPanel(){
  var rate = VER.checked? Math.round(VER.bad/VER.checked*100) : 0;
  var cur = VER.pending? assetByEpc(VER.pending) : null;
  var h='<div class="note"><b>Verify tags.</b> Read one tag and the register says which asset it claims to be. '+
    'Confirm it against the item in your hands, or correct the mapping on the spot. '+
    'Run this over a sample after bulk tagging — an audit cannot catch a tag stuck on the wrong machine.</div>';

  h+='<section class="panel"><div class="panel-h"><h2>Verify tags</h2>'+
    '<span class="sub">'+VER.checked+' checked · '+VER.ok+' confirmed · '+VER.bad+' corrected'+
      (VER.checked>=5? ' · '+rate+'% error rate' : '')+'</span>'+
    (VER.checked? '<button class="btn sm" id="verReset">Start over</button>' : '')+
    '</div><div class="panel-b stack">';

  if(VER.checked>=5 && rate>=10){
    h+='<div class="note" style="border-left-color:var(--crit)"><b>'+rate+'% of the tags checked were on the wrong asset.</b> '+
       'That is high enough to stop and re-check the whole batch rather than carry on sampling.</div>';
  }

  if(!VER.pending){
    h+='<div class="scanbox armed"><input type="text" id="verEpc" placeholder="Pull the trigger — read one tag" autocomplete="off" spellcheck="false">'+
       '<div class="hint">Read a single tag. Lower the antenna power in Setup first so you only catch the one in front of you.</div></div>'+
       (demoMode()? '<div class="btn-row"><button class="btn" id="verSim">Simulate a read</button></div>' : '');
  } else if(!cur){
    h+='<div class="note" style="border-left-color:var(--warn)"><b>That tag is not in the register.</b> '+
       '<span class="epc">'+esc(VER.pending)+'</span> is not mapped to any asset. It is either a spare, or it belongs to an asset that was never mapped.</div>'+
       '<div class="btn-row"><button class="btn pri" id="verAssign">Map it to an asset now</button>'+
       '<button class="btn" id="verSkip">Skip</button></div>';
  } else {
    var cls=assetClass(cur);
    h+='<div class="worknow"><div class="wn-head"><span class="eyebrow">This tag claims to be</span>'+
       '<span class="epc" style="font-size:12px">'+esc(VER.pending)+'</span></div>'+
       '<div class="wn-name">'+esc(cur.name)+'</div>'+
       '<div class="wn-meta"><span class="epc">'+esc(cur.code)+'</span> · '+esc(cur.category||"uncategorised")+
       ' · allotted to '+esc(locName(cur.home))+
       (cls? ' · '+esc(cls.code) : '')+
       (cur.taggedBy? ' · tagged by '+esc(cur.taggedBy) : '')+'</div>'+
       (((cur.photoIds||[]).length)? '<div class="pstrip" style="margin-top:9px">'+photoStrip([cur.photoIds[cur.photoIds.length-1]],64)+'</div>' : '')+
       '</div>';

    if(!VER.fixing){
      h+='<div class="btn-row">'+
         '<button class="btn pri" id="verOk">Correct — this is the asset</button>'+
         '<button class="btn danger" id="verBad">Wrong asset</button>'+
         (mod("photos")? '<button class="btn" id="verShot">📷 Photograph it</button>' : '')+
         '</div>'+
         '<div class="muted" style="font-size:12px">Confirming records who checked it and when, against the asset.</div>';
    } else {
      h+='<div class="note" style="border-left-color:var(--crit)"><b>Which asset is this tag actually on?</b> '+
         'Scan that asset’s own code, or pick it from the list. The tag moves to it and comes off '+esc(cur.code)+'.</div>'+
         '<div class="scanbox armed"><input type="text" id="verFixCode" placeholder="Scan the asset’s printed code" autocomplete="off" spellcheck="false">'+
         '<div class="hint">A barcode or Data Matrix on the asset, or type the code and press Enter.</div></div>'+
         '<div class="grid-form"><label class="fld w-lg"><span>… or choose it</span><select id="verFixPick">'+
           '<option value="">— pick the right asset —</option>'+
           list("assets").sort(function(a,b){return a.code.localeCompare(b.code);}).map(function(a){
             return '<option value="'+esc(a.id)+'">'+esc(a.code)+' — '+esc(a.name)+'</option>'; }).join("")+
         '</select></label>'+
         '<button class="btn pri" id="verFixGo">Move the tag</button></div>'+
         '<div class="btn-row"><button class="btn sm" id="verCancel">Cancel</button></div>';
    }
  }
  h+='</div></section>';

  if(VER.log.length){
    h+='<section class="panel"><div class="panel-h"><h2>Checked this run</h2>'+
      '<span class="sub">newest first</span></div><div class="tw"><table><thead><tr>'+
      '<th>Tag</th><th>Asset</th><th>Result</th><th>By</th></tr></thead><tbody>';
    VER.log.slice().reverse().forEach(function(e){
      h+='<tr><td class="epc">'+esc(e.epc)+'</td>'+
         '<td>'+(e.code? '<b>'+esc(e.code)+'</b> <span class="muted">'+esc(e.name||"")+'</span>' : '<span class="muted">not in the register</span>')+'</td>'+
         '<td>'+(e.result==="ok"? '<span class="chip ok">Confirmed</span>'
                : e.result==="moved"? '<span class="chip crit">Moved to '+esc(e.to||"")+'</span>'
                : e.result==="mapped"? '<span class="chip acc">Newly mapped</span>'
                : '<span class="chip mute">Skipped</span>')+'</td>'+
         '<td><small class="muted">'+esc(e.by)+'</small></td></tr>';
    });
    h+='</tbody></table></div></section>';
  }
  return h;
}

function verifyRead(epc){
  epc=String(epc||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(epc.length<4){ toast("That read was too short to be a tag"); return; }
  VER.pending=epc; VER.fixing=false; render();
}
function verifyConfirm(){
  var a=VER.pending? assetByEpc(VER.pending):null; if(!a) return;
  var st=stamp(), n=clone(a);
  n.verifiedAt=nowISO(); n.verifiedBy=st.byName; n.verifiedById=st.by;
  save("assets",n);
  VER.checked++; VER.ok++;
  VER.log.push({epc:VER.pending,code:a.code,name:a.name,result:"ok",by:st.byName});
  VER.pending=""; VER.fixing=false;
  toast(a.code+" confirmed");
  render(); setTimeout(function(){ var el=$("#verEpc"); if(el) el.focus(); },20);
}
function verifyMove(toId){
  var from=VER.pending? assetByEpc(VER.pending):null;
  var to=asset(toId);
  if(!to){ toast("Pick the asset this tag is really on"); return; }
  if(from && from.id===to.id){ verifyConfirm(); return; }
  var st=stamp(), epc=VER.pending, displaced="";
  if(to.epc && to.epc!==epc){
    if(!confirm(to.code+" already carries tag "+to.epc+".\n\nMoving this tag replaces it. Continue?")) return;
    displaced=to.epc;
  }
  if(from){
    var f=clone(from);
    f.epc=""; f.taggedAt=""; f.taggedBy=""; f.taggedById="";
    save("assets",f);
  }
  var t=clone(to);
  t.epc=epc; t.taggedAt=nowISO(); t.taggedBy=st.byName; t.taggedById=st.by;
  t.verifiedAt=nowISO(); t.verifiedBy=st.byName; t.verifiedById=st.by;
  if(TAGM.team) t.taggedTeam=TAGM.team;
  t.retagCount=displaced? (t.retagCount||0)+1 : t.retagCount;
  save("assets",t);
  /* A tag knocked off an asset during the verification pass is still a
     replaced tag. It is recorded as unsigned, because no PIN was entered
     here, and the report shows it as such rather than pretending otherwise. */
  if(displaced){
    save("retags",{id:uid("RT"), assetId:t.id, assetCode:t.code, assetName:t.name||"",
      oldEpc:displaced, newEpc:epc, reason:"wrong",
      remarks:"Corrected during the verification pass"+(from? " — tag was reading as "+from.code : ""),
      by:st.byName, byId:st.by, byCode:st.byCode, byRole:st.byRole,
      at:nowISO(), signed:false, areaId:t.home||""});
  }
  VER.checked++; VER.bad++;
  VER.log.push({epc:epc, code:from?from.code:"", name:from?from.name:"",
                result:from?"moved":"mapped", to:to.code, by:st.byName});
  VER.pending=""; VER.fixing=false;
  toast("Tag moved to "+to.code+(from?" · "+from.code+" is now untagged":""));
  render(); renderTabs(); setTimeout(function(){ var el=$("#verEpc"); if(el) el.focus(); },20);
}

/* ---- shared: find an asset from a scanned or typed code ---- */
function assetByCode(code){
  code=String(code||"").trim().toUpperCase();
  if(!code) return null;
  var all=list("assets");
  var hit=all.filter(function(a){ return String(a.code).toUpperCase()===code; })[0];
  if(hit) return hit;
  /* A 2D label often carries more than the bare code — take the longest run
     that matches an asset code anywhere in the payload. */
  return all.filter(function(a){ return code.indexOf(String(a.code).toUpperCase())>=0; })
    .sort(function(x,y){ return String(y.code).length-String(x.code).length; })[0]||null;
}

/* ---- photo taken at the moment of tagging ---- */
function attachAssetPhoto(assetId,note){
  if(!mod("photos")) return;
  pickPhoto(function(dataUrl){
    var a=asset(assetId); if(!a) return;
    var pid=savePhoto(dataUrl,"asset",note||"At tagging",meName());
    var n=clone(a); n.photoIds=(n.photoIds||[]).concat([pid]).slice(-4);
    save("assets",n);
    toast("Photo attached to "+n.code);
    render();
  });
}

/* ---- Picking one asset out of thousands -----------------------------------
   This used to be a <select> holding every asset on the register. At twenty-
   eight that reads as thoughtful; at a thousand the browser builds a thousand
   options on every render and the operator scrolls a 4-inch dropdown with a
   reader in the other hand. It is also the wrong instrument: on the floor you
   are standing in front of ONE asset, and its code is printed on it.

   So: scan the label and it is chosen. Type part of a code or a name and the
   few matches appear. Nothing is listed until something is asked for, which is
   what makes this the same screen at 28 assets and at 100,000. */
var TAGM_PICK={id:"", q:"", hits:[]};

function tagMatches(q,limit){
  q=String(q||"").trim().toLowerCase();
  if(!q) return [];
  var exact=[], starts=[], holds=[];
  list("assets").forEach(function(a){
    var c=String(a.code||"").toLowerCase(), n=String(a.name||"").toLowerCase();
    if(c===q){ exact.push(a); return; }
    if(c.indexOf(q)===0||n.indexOf(q)===0){ starts.push(a); return; }
    if(c.indexOf(q)>=0||n.indexOf(q)>=0) holds.push(a);
  });
  /* Exact code first, so a scanned label never has to be disambiguated. */
  return exact.concat(starts,holds).slice(0,limit||8);
}

function runAssign(epc){
  epc=String(epc).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(epc.length<4){ toast("That scan was too short to be a tag"); return; }
  var cur=tagCurrent(); if(!cur) return;
  var clash=assetByEpc(epc);
  if(clash&&clash.id!==cur.id){ toast("That tag is already on "+clash.code+" — skipped"); return; }
  var prev=cur.epc;
  var tst=stamp();
  /* Clone before writing. A document-backed store hands back frozen objects,
     so mutating in place works on this backend and throws on the next one. */
  var nc=clone(cur);
  nc.epc=epc; nc.taggedAt=nowISO(); nc.taggedBy=tst.byName; nc.taggedById=tst.by;
  if(TAGM.team) nc.taggedTeam=TAGM.team;
  save("assets",nc);
  TAGM.done.push({id:cur.id,epc:epc,prev:prev});
  TAGM.idx++;
  render(); renderTabs();
  setTimeout(function(){ var el=$("#runEpc"); if(el) el.focus(); },20);
}

    });

function splitPairs(txt){
  return String(txt||"").split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean)
    .map(function(l){ return l.split(/[,;\t]/).map(function(p){return p.trim();}); })
    .filter(function(p){ return !/^(asset_?code|code|asset)$/i.test(p[0]); });
}
function previewBulkTags(txt){
  var pairs=splitPairs(txt), seen={}, rows=[];
  pairs.forEach(function(p){
    var code=(p[0]||"").toUpperCase(), epc=(p[1]||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    var a=list("assets").filter(function(x){return x.code.toUpperCase()===code;})[0];
    var r={cells:[p[0]||"",epc],status:"new",msg:"assign",assetId:a?a.id:"",epc:epc};
    if(!code){ r.status="error"; r.msg="no asset code"; }
    else if(!a){ r.status="error"; r.msg="unknown asset"; }
    else if(epc.length<4){ r.status="error"; r.msg="bad EPC"; }
    else if(seen[epc]){ r.status="error"; r.msg="repeated in paste"; }
    else { var clash=assetByEpc(epc);
      if(clash&&clash.id!==a.id){ r.status="error"; r.msg="on "+clash.code; }
      else if(a.epc&&a.epc!==epc){ r.status="update"; r.msg="retag"; }
      seen[epc]=true; }
    rows.push(r);
  });
  /* The whole register is built on knowing who did a thing. A bulk paste that
     writes the tag but not the person leaves the biggest batch of assets with
     a blank tagged-by, which is the one column an auditor checks. */
  var bt=$("#bulkTagTeam"), team=bt? bt.value : TAGM.team;
  previewCommit("Tag many at once",["Asset code","Tag ID"],rows,function(ok){
    var st=stamp();
    /* First-time assignments go straight through. Replacements do not: they
       are held back and written only against one reason and one signature
       covering the batch. Demanding a PIN per row for a 200-asset re-label
       would only teach people to share PINs, which is worse than the gap. */
    var fresh=[], repl=[];
    ok.forEach(function(r){
      var a=asset(r.assetId); if(!a) return;
      if(a.epc && normEpc(a.epc)!==normEpc(r.epc)) repl.push(r); else fresh.push(r);
    });
    fresh.forEach(function(r){
      var a=asset(r.assetId); if(!a) return;
      var n=clone(a);
      n.epc=r.epc; n.taggedAt=nowISO();
      n.taggedBy=st.byName; n.taggedById=st.by;
      if(team) n.taggedTeam=team;
      save("assets",n);
    });
    if(repl.length) setTimeout(function(){ retagBatchDialog(repl,team); },260);
    return fresh.length;
  });
}

function previewBulkAssets(txt){

    var r={cells:[code,name||code,cat,lc,epc,mob?"yes":""],status:ex?"update":"new",msg:ex?"update":"new",
           code:code,name:name||code,cat:cat,lc:lc,epc:epc,mob:mob,exId:ex?ex.id:"",locId:l?l.id:""};
    if(!code){ r.status="error"; r.msg="no code"; }

    }
    if(r.status!=="error"){

      if(lc&&!l) r.msg=(ex?"update":"new")+" + new area";
    }

  previewCommit("Bulk asset entry",["Code","Name","Category","Area code","Tag ID","Mobile"],rows,function(ok){
    ok.forEach(function(r){

      var o=r.exId? clone(asset(r.exId)) : {id:uid("A"),code:r.code,lastSeenLoc:"",lastSeenAt:"",status:"active",custodian:"",epc:""};
      o.code=r.code; o.name=r.name; o.category=r.cat; if(l) o.home=l.id;
      if(r.mob) o.mobile=true;
      if(r.epc){ o.epc=r.epc; o.taggedAt=o.taggedAt||nowISO(); }

  });
}

/* ============ AUDIT ============ */
var AUD={active:false, roundId:"", roundRef:"", locationId:"", operator:"", startedAt:"", reads:{}, mode:"wedge", shell:false, peek:false, wedge:true, lastNew:"", photos:{}, cond:{}, areaPhoto:""};

/* ===== Surviving the floor =====
   A sweep is forty minutes of walking. Until now it lived only in memory, so
   a dead reader battery, a tablet that slept, a closed tab or a shift change
   threw all of it away with no warning — the operator walked the area again.

   The live sweep is therefore written to this device after every read. It is
   deliberately NOT synced to the shared store: an unfinished sweep is one
   person's work in progress, not shared state, and four handhelds must not
   overwrite each other's. On commit it becomes an audits record, which is
   what syncs. */
var SWEEPKEY="tagtrail_livesweep";
function sweepSave(){
  if(!AUD.active){ sweepClear(); return; }
  try{
    localStorage.setItem(SWEEPKEY, JSON.stringify({
      v:1, savedAt:nowISO(),
      roundId:AUD.roundId, roundRef:AUD.roundRef, locationId:AUD.locationId,
      operator:AUD.operator, operatorId:AUD.operatorId, operatorCode:AUD.operatorCode,
      startedAt:AUD.startedAt, reads:AUD.reads, mode:AUD.mode,
      photos:AUD.photos, cond:AUD.cond, areaPhoto:AUD.areaPhoto,
      found:AUD.found||{}, handover:AUD.handover||[]
    }));
  }catch(e){
    /* Silently failing here is the worst case: the operator believes the
       sweep is protected and it stopped being recoverable. Say it once. */
    if(!SWEEP_UNSAFE){ SWEEP_UNSAFE=true;
      toast("This device's storage is full \u2014 the sweep in progress is NOT being saved. Finish and commit it now.");
      try{ paintReadout(); }catch(x){}
    }
  }
}
var SWEEP_UNSAFE=false;
function sweepStored(){
  try{ var raw=localStorage.getItem(SWEEPKEY); if(!raw) return null;
       var o=JSON.parse(raw); return (o&&o.locationId)?o:null; }catch(e){ return null; }
}
function sweepClear(){ try{ localStorage.removeItem(SWEEPKEY); }catch(e){} }
function sweepReadCount(o){ return o&&o.reads? Object.keys(o.reads).length : 0; }

/* ---- Sweeps the server has not taken yet ----------------------------------
   A finished sweep whose write failed is kept in a slot of its own, not in the
   live-sweep slot: the operator walks straight into the next room, and that
   next sweep would otherwise write over the one still waiting to be sent.
   Each is retried whenever the console next connects. */
var UNSENTKEY="tagtrail_unsent_sweeps";
function unsentList(){
  try{ var r=localStorage.getItem(UNSENTKEY); var a=r?JSON.parse(r):[]; return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function unsentPut(audit){
  try{
    var a=unsentList().filter(function(x){ return x && x.id!==audit.id; });
    a.push(audit);
    localStorage.setItem(UNSENTKEY, JSON.stringify(a));
    return true;
  }catch(e){ return false; }
}
function unsentDrop(id){
  try{ localStorage.setItem(UNSENTKEY,
    JSON.stringify(unsentList().filter(function(x){ return x && x.id!==id; }))); }catch(e){}
}
function resendUnsent(quiet){
  var a=unsentList();
  if(!a.length || !DB) return;
  var sent=0, tried=a.length;
  a.forEach(function(au){
    if(!au || !au.id) { return; }
    /* Straight back through the same write path, so the register applies the
       same rules to it as it would have at the time. */
    S.audits=S.audits||{}; S.audits[au.id]=au;
    var pr=save("audits",au);
    if(pr && pr.then) pr.then(function(ok){
      if(ok){ unsentDrop(au.id); sent++;
        if(!quiet||sent===tried) toast("Sweep of "+locName(au.locationId)+" has now been saved");
        if(VIEW==="reports"||VIEW==="audit") render();
      }
    });
  });
}

/* Hold the sweep on the device until the server acknowledges it, and say so
   plainly when it does not \u2014 the operator is about to walk away from the
   area, and silence here reads as success. */
function sweepHoldUntilSaved(p, audit){
  if(!p || typeof p.then!=="function"){ sweepClear(); return; }
  p.then(function(ok){
    if(ok){ sweepClear(); return; }
    var kept=unsentPut(audit);
    sweepClear();
    var where=locName(audit.locationId), n=(audit.rows||[]).length;
    modal('<div class="panel-h"><h2>This sweep is waiting to be sent</h2>'+
      '<span class="sub">'+esc(where)+'</span>'+
      '<button class="btn sm" data-close>Close</button></div>'+
      '<div class="panel-b stack">'+
      '<div class="tallybar '+(kept?'warn':'bad')+'"><b>'+
        (kept? 'The server did not take it, so it is held on this device.'
             : 'The server did not take it, and this device could not hold it either.')+
      '</b> Usually the network where you are standing, or the service restarting.</div>'+
      (kept
        ? '<div class="muted">All '+n+' readings are safe here. The console will send it by itself '+
          'as soon as it can reach the server \u2014 you do not need to walk the area again. '+
          'Do not clear this browser until it has gone.</div>'+
          '<div class="btn-row"><button class="btn pri" id="resendNow">Try now</button>'+
          '<span class="muted">or just carry on with the next room</span></div>'
        : '<div class="muted">Do not close this page. Move to where there is signal and press Try now.</div>'+
          '<div class="btn-row"><button class="btn pri" id="resendNow">Try now</button></div>')+
      '</div>');
  });
}

/* Picking an interrupted sweep back up. If a different person resumes it the
   handover is recorded, because the sweep record has to name everyone whose
   reads are in it — an auditor asking "who counted this area" must not get
   one name when two people walked it. */
function sweepResume(){
  var o=sweepStored(); if(!o) return false;
  var st=stamp();
  AUD.active=true;
  AUD.roundId=o.roundId||""; AUD.roundRef=o.roundRef||"";
  AUD.locationId=o.locationId; AUD.startedAt=o.startedAt||nowISO();
  AUD.reads=o.reads||{}; AUD.photos=o.photos||{}; AUD.cond=o.cond||{};
  AUD.areaPhoto=o.areaPhoto||""; AUD.mode=o.mode||"wedge"; AUD.found=o.found||{};
  AUD.wedge=true; AUD.shell=false; AUD.lastNew="";
  AUD.handover=(o.handover||[]).slice();
  if(o.operatorId && st.by && o.operatorId!==st.by){
    AUD.handover.push({from:o.operator, fromId:o.operatorId,
                       to:st.byName, toId:st.by, at:nowISO(),
                       readsAtHandover:sweepReadCount(o)});
    toast("Resumed "+locName(AUD.locationId)+" from "+o.operator+" — handover recorded");
  } else {
    toast("Resumed "+locName(AUD.locationId)+" — "+sweepReadCount(o)+" read"+(sweepReadCount(o)===1?"":"s")+" recovered");
  }
  AUD.operator=st.byName||o.operator; AUD.operatorId=st.by; AUD.operatorCode=st.byCode;
  sweepSave();
  go("audit");
  setTimeout(function(){ var el=$("#scanIn"); if(el) el.focus(); },40);
  return true;
}
function sweepDiscard(){
  var o=sweepStored();
  if(o) hostEvent("audit_cancelled",{area:locName(o.locationId),areaCode:locCode(o.locationId),
    reads:sweepReadCount(o),reason:"discarded after interruption"});
  sweepClear(); AUD.active=false; AUD.reads={}; AUD.photos={}; AUD.cond={};
  renderTabs(); render();
}
/* Shown on whatever screen the person lands on, because an abandoned sweep
   that nobody is told about is the same as a lost one. */
function sweepRecoveryBar(){
  var o=sweepStored(); if(!o || AUD.active) return "";
  var n=sweepReadCount(o), m=me();
  var mine=!m || !o.operatorId || o.operatorId===m.id;
  return '<div class="note" style="border-left-color:var(--signal)">'+
    '<b>An unfinished sweep of '+esc(locName(o.locationId))+' is still on this device.</b> '+
    n+' tag'+(n===1?'':'s')+' read, started '+esc(fmtDate(o.startedAt))+
    (mine? '' : ' by '+esc(o.operator||"someone else"))+
    (o.savedAt? ', last saved '+esc(fmtDate(o.savedAt)) : '')+'. '+
    (mine? 'Carry on where it stopped, or throw it away.'
         : 'Carrying on records a handover, so the report names both of you.')+
    '<div class="btn-row" style="margin-top:9px">'+
      '<button class="btn pri" id="sweepResume">Carry on with this sweep</button>'+
      '<button class="btn danger" id="sweepDrop">Throw it away</button>'+
    '</div></div>';
}

function rssiClass(r){ return r>=cfg().floor; }
/* A laptop is not misplaced because it is not on its own desk, and it is not
   missing because it went to a meeting. Assets flagged as moving by design
   get their own bucket: still counted, still on the register, never an
   exception and never a job. Without this the exception list fills with
   false positives every sweep and the plant stops reading it. */
function classify(epc){
  var a=assetByEpc(epc);
  /* A tag that was replaced is dead, not unknown. Saying so turns a puzzle
     into a fact: this came off AST-1014 in March, Deepa replaced it because
     it was damaged, go and destroy it. */
  if(!a){ var dd=deadEpc(epc); if(dd) return {b:"retired",asset:null,dead:dd}; }
  if(!a) return {b:"unknown",asset:null};
  if(a.home===AUD.locationId) return {b:"inplace",asset:a};
  if(a.mobile) return {b:"away",asset:a};
  return {b:"misplaced",asset:a};
}
/* Physical verification and tag integrity are two different findings, and the
   floor hits the gap between them constantly: the asset is standing there,
   its tag has fallen off or is buried under paint, and RFID is blind to it.
   Called missing, it raises a locate job for something nobody has lost and
   adds its book value to the figure the auditor challenges under CARO.
   So an operator can say "I can see it" — the asset counts as verified, and
   what is raised is a re-tag job, which is the work that actually needs doing. */
function buckets(){
  var out={inplace:[],misplaced:[],missing:[],unknown:[],away:[],retired:[],eyeballed:[],offsite:[]};
  var seen={};
  Object.keys(AUD.reads).forEach(function(epc){
    var r=AUD.reads[epc]; if(!rssiClass(r.rssi)) return;
    var c=classify(epc);
    if(c.asset) seen[c.asset.id]=true;
    out[c.b].push({epc:epc,asset:c.asset,rssi:r.rssi,count:r.count,dead:c.dead||null});
  });
  assetsHomedIn(AUD.locationId).forEach(function(a){
    if(!a.epc || seen[a.id] || isRetired(a)) return;
    var fb=AUD.found&&AUD.found[a.id];
    if(fb) out.eyeballed.push({epc:a.epc,asset:a,found:fb});
    else if(isOffsite(a)) out.offsite.push({epc:a.epc,asset:a});
    else if(a.mobile) out.away.push({epc:a.epc,asset:a});
    else out.missing.push({epc:a.epc,asset:a});
  });
  return out;
}
/* Mobile assets are left out of the expected count, so coverage stays an
   honest number: you cannot expect a laptop to be at its desk. */
function expectedCount(){ return assetsHomedIn(AUD.locationId).filter(function(a){return a.epc && !isRetired(a) && !isOffsite(a) && !a.mobile;}).length; }
function retiredRead(b){ return b.inplace.concat(b.misplaced).filter(function(x){return isRetired(x.asset);}); }


function countPicks(){
